<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021629"/>
      <stop offset="50%" stop-color="#062d54"/>
      <stop offset="100%" stop-color="#010e1c"/>
    </linearGradient>
    <linearGradient id="nepGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="nepBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#nepBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#4fc3f7" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Trident de Neptune marin -->
  <g transform="translate(256, 175)">
    <circle cx="0" cy="0" r="76" fill="#041d36" stroke="url(#nepGold)" stroke-width="5"/>
    <!-- Trident stylisé -->
    <rect x="-4" y="-35" width="8" height="75" rx="2" fill="url(#nepGold)"/>
    <path d="M -22 -15 C -22 10 -4 10 -4 10 L 4 10 C 4 10 22 10 22 -15" fill="none" stroke="url(#nepGold)" stroke-width="6" stroke-linecap="round"/>
    <polygon points="-22,-25 -26,-15 -18,-15" fill="url(#nepGold)"/>
    <polygon points="22,-25 18,-15 26,-15" fill="url(#nepGold)"/>
    <polygon points="0,-45 -6,-35 6,-35" fill="url(#nepGold)"/>
  </g>

  <!-- Badge Fréquence 95.0 FM -->
  <g transform="translate(256, 285)">
    <rect x="-110" y="-18" width="220" height="38" rx="19" fill="url(#nepGold)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#021629" text-anchor="middle" letter-spacing="1">95.0 FM</text>
  </g>

  <!-- Titre RADIO NEPTUNE -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">RADIO NEPTUNE</text>

  <!-- Slogan -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#81d4fa" text-anchor="middle" letter-spacing="3">CLASSIQUE, JAZZ &amp; MUSIQUES DE FILM</text>

  <!-- Ville / Pays -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffd54f" text-anchor="middle" letter-spacing="2">BREST • SANS PUBLICITÉ ⚓</text>
</svg>