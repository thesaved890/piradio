<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="informBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021B10"/>
      <stop offset="50%" stop-color="#093820"/>
      <stop offset="100%" stop-color="#001408"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F3B43F"/>
      <stop offset="100%" stop-color="#B7791F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#informBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.85"/>

  <!-- Info Speech Bubble / Microphone Icon -->
  <g transform="translate(256, 170)">
    <circle cx="0" cy="0" r="65" fill="#002412" stroke="url(#gold)" stroke-width="4"/>
    <text x="0" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="70" fill="url(#gold)" text-anchor="middle">ℹ️</text>
  </g>

  <!-- Typography -->
  <text x="256" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="46" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">INFORM ME</text>
  <text x="256" y="345" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="url(#gold)" text-anchor="middle" letter-spacing="8">RADIO</text>
  <text x="256" y="390" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#A5D6A7" text-anchor="middle" letter-spacing="4">NIGERIA • PIONEER NETWORK</text>

  <!-- Live Tag -->
  <g transform="translate(136, 424)">
    <rect width="240" height="40" rx="20" fill="#001a0d" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="25" cy="20" r="5" fill="#00E676"/>
    <text x="135" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">NEWS • MUSIC • 24/7</text>
  </g>
</svg>

