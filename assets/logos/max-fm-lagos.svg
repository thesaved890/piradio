<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="maxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140024"/>
      <stop offset="50%" stop-color="#2D004D"/>
      <stop offset="100%" stop-color="#0E0018"/>
    </linearGradient>
    <linearGradient id="maxRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="100%" stop-color="#D50000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F3B43F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#maxBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Frequency Pill -->
  <g transform="translate(156, 65)">
    <rect width="200" height="46" rx="23" fill="url(#maxRed)"/>
    <text x="100" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">102.3 FM</text>
  </g>

  <!-- Big MAX Typography -->
  <text x="256" y="220" font-family="'Impact', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="120" fill="url(#maxRed)" text-anchor="middle" letter-spacing="4">MAX FM</text>
  <text x="256" y="280" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">LAGOS</text>

  <!-- Slogan -->
  <text x="256" y="350" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="26" fill="#FF80AB" text-anchor="middle" letter-spacing="3">MAXIMUM MUSIC HIT</text>
  <text x="256" y="388" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" fill="#E1BEE7" text-anchor="middle" letter-spacing="2">LAGOS &amp; ABUJA</text>

  <!-- Live Tag -->
  <g transform="translate(146, 422)">
    <rect width="220" height="40" rx="20" fill="#003318" stroke="url(#gold)" stroke-width="2"/>
    <text x="110" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#00E676" text-anchor="middle" letter-spacing="3">🇳🇬 LAGOS 100% LIVE</text>
  </g>
</svg>

