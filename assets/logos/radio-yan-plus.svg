<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="yanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140608"/>
      <stop offset="50%" stop-color="#2b0d12"/>
      <stop offset="100%" stop-color="#0a0304"/>
    </linearGradient>
    <linearGradient id="yanGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#00A896"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <filter id="yanShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#yanBg)" stroke="#00A896" stroke-width="3" filter="url(#yanShadow)"/>

  <!-- Sigle YAN PLUS dynamique -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#00A896"/>
    <text x="-4" y="7" fill="#140608" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="18" text-anchor="middle">YAN</text>
    <text x="12" y="7" fill="#FFD100" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="18" text-anchor="middle">+</text>
  </g>

  <!-- Titre YAN PLUS -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="2" text-anchor="middle" filter="url(#yanShadow)">YAN PLUS</text>

  <!-- Tag MUSIQUE AMAZIGH -->
  <rect x="36" y="116" width="128" height="26" rx="8" fill="url(#yanGold)"/>
  <text x="100" y="134" fill="#140608" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.2" text-anchor="middle">RADIO YAN PLUS</text>

  <!-- Pied MAROC -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#1a070a" stroke="#00A896" stroke-width="1.2"/>
  <text x="100" y="171" fill="#FFD100" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">TAMAZIGHT &amp; MAROC</text>
</svg>
