<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="abBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a0d"/>
      <stop offset="50%" stop-color="#142e18"/>
      <stop offset="100%" stop-color="#051007"/>
    </linearGradient>
    <linearGradient id="abGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <linearGradient id="abRasta" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="50%" stop-color="#FDD835"/>
      <stop offset="100%" stop-color="#43A047"/>
    </linearGradient>
    <radialGradient id="abGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FCD116" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FCD116" stop-opacity="0"/>
    </radialGradient>
    <filter id="abDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#abBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#abGold)" stroke-width="3" stroke-opacity="0.8"/>
  <circle cx="256" cy="190" r="170" fill="url(#abGlow)"/>

  <!-- Ondes radio -->
  <g fill="none" stroke="url(#abGold)" stroke-linecap="round" opacity="0.8">
    <path d="M 140 170 A 130 130 0 0 1 372 170" stroke-width="3" stroke-dasharray="6 8"/>
    <path d="M 170 180 A 100 100 0 0 1 342 180" stroke-width="4"/>
    <path d="M 200 190 A 70 70 0 0 1 312 190" stroke-width="5"/>
  </g>

  <!-- Médaillon Alpha Blondy aux couleurs Rasta -->
  <g filter="url(#abDrop)" transform="translate(256, 185)">
    <circle cx="0" cy="0" r="62" fill="url(#abRasta)"/>
    <circle cx="0" cy="0" r="54" fill="#0a1a0d"/>
    <!-- Étoile centrale dorée et initiales AB -->
    <text x="0" y="16" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="900" fill="url(#abGold)" text-anchor="middle" letter-spacing="2">AB</text>
  </g>

  <!-- Badge 97.9 FM Reggae & Peace -->
  <g transform="translate(256, 285)">
    <rect x="-95" y="-18" width="190" height="36" rx="18" fill="url(#abGold)" filter="url(#abDrop)"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="900" fill="#0a1a0d" text-anchor="middle" letter-spacing="2">97.9 FM</text>
  </g>

  <!-- Titre Principal ALPHA BLONDY FM -->
  <text x="256" y="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">ALPHA BLONDY FM</text>

  <!-- Sous-titre Reggae & Culture -->
  <text x="256" y="395" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="url(#abGold)" text-anchor="middle" letter-spacing="3">ABIDJAN • REGGAE &amp; PEACE</text>

  <!-- Drapeau ivoirien miniature en bas -->
  <g transform="translate(256, 430)">
    <rect x="-18" y="-7" width="12" height="14" fill="#FF8200" rx="2"/>
    <rect x="-6" y="-7" width="12" height="14" fill="#FFFFFF"/>
    <rect x="6" y="-7" width="12" height="14" fill="#009A44" rx="2"/>
    <rect x="-18" y="-7" width="36" height="14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" rx="2"/>
  </g>
</svg>