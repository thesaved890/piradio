<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rfiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0406"/>
      <stop offset="50%" stop-color="#3d0a0f"/>
      <stop offset="100%" stop-color="#120304"/>
    </linearGradient>
    <linearGradient id="rfiRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a3a"/>
      <stop offset="100%" stop-color="#c40018"/>
    </linearGradient>
    <linearGradient id="badgeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    
  </defs>
  
  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#rfiBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#e53935" stroke-opacity="0.3" stroke-width="4"/>
  
  <!-- Ondes radio -->
  <circle cx="256" cy="220" r="160" fill="none" stroke="#ff5252" stroke-opacity="0.1" stroke-width="2"/>
  <circle cx="256" cy="220" r="190" fill="none" stroke="#ff5252" stroke-opacity="0.06" stroke-width="2"/>
  
  <!-- RFI Badge Carré -->
  <g>
    <rect x="156" y="100" width="200" height="150" rx="28" fill="url(#rfiRed)"/>
    <text x="256" y="206" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="88" text-anchor="middle" letter-spacing="-2">rfi</text>
  </g>
  
  <!-- Label AFRIQUE -->
  <rect x="136" y="270" width="240" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" stroke="#ff5252" stroke-width="1.5"/>
  <text x="256" y="300" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" text-anchor="middle" letter-spacing="6">AFRIQUE</text>
  
  <!-- Fréquence Abidjan Badge -->
  <rect x="146" y="335" width="220" height="48" rx="24" fill="url(#badgeGold)"/>
  <text x="256" y="367" fill="#111111" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="25" text-anchor="middle" letter-spacing="1">87.5 FM</text>
  
  <!-- Ville -->
  <text x="256" y="425" fill="#f07070" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="19" text-anchor="middle" letter-spacing="2">ABIDJAN • CÔTE D'IVOIRE</text>
</svg>