<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgEcr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081829"/>
      <stop offset="50%" stop-color="#0e3459"/>
      <stop offset="100%" stop-color="#051221"/>
    </linearGradient>
    <linearGradient id="yellowEcr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>
    <linearGradient id="cyanEcr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40C4FF"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgEcr)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#yellowEcr)" stroke-width="2.5" opacity="0.85"/>

  <!-- Logo ECR & Vagues de Durban / Côte Est -->
  <g transform="translate(100, 68)">
    <circle cx="0" cy="0" r="38" fill="#07223b" stroke="url(#cyanEcr)" stroke-width="2"/>
    <!-- Acronyme ECR vibrant -->
    <text x="0" y="12" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" fill="url(#yellowEcr)" text-anchor="middle" letter-spacing="1">ECR</text>
    <!-- Vagues océan indien -->
    <path d="M -24,18 Q -12,12 0,18 T 24,18" fill="none" stroke="url(#cyanEcr)" stroke-width="2"/>
  </g>

  <!-- Titre EAST COAST RADIO -->
  <text x="100" y="126" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">EAST COAST</text>
  <text x="100" y="144" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="url(#yellowEcr)" text-anchor="middle" letter-spacing="2">RADIO</text>

  <!-- Cartouche Durban & KZN -->
  <rect x="20" y="158" width="160" height="26" rx="8" fill="url(#cyanEcr)"/>
  <text x="100" y="175" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#081829" text-anchor="middle" letter-spacing="1">DURBAN & KWAZULU-NATAL</text>
</svg>