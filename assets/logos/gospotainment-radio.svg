<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A102F"/>
      <stop offset="50%" stop-color="#321D59"/>
      <stop offset="100%" stop-color="#0E081A"/>
    </linearGradient>
    <linearGradient id="purpleGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F3B43F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#gosBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Gospel Musical Dove / Note Motif -->
  <g transform="translate(256, 160)">
    <circle cx="0" cy="0" r="60" fill="#20113B" stroke="url(#purpleGold)" stroke-width="4"/>
    <text x="0" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="url(#purpleGold)" text-anchor="middle">🎶</text>
  </g>

  <!-- Typography -->
  <text x="256" y="285" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">GOSPOTAINMENT</text>
  <text x="256" y="335" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="url(#purpleGold)" text-anchor="middle" letter-spacing="8">RADIO</text>
  <text x="256" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#D1C4E9" text-anchor="middle" letter-spacing="3">NIGERIA GOSPEL &amp; INSPIRATION</text>

  <!-- Live Tag -->
  <g transform="translate(146, 420)">
    <rect width="220" height="40" rx="20" fill="#003318" stroke="url(#gold)" stroke-width="2"/>
    <text x="110" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#00E676" text-anchor="middle" letter-spacing="3">🇳🇬 GOSPEL 24/7</text>
  </g>
