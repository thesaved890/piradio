<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="zmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b0e"/>
      <stop offset="50%" stop-color="#0f381c"/>
      <stop offset="100%" stop-color="#041209"/>
    </linearGradient>
    <linearGradient id="zmGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#198754"/>
      <stop offset="100%" stop-color="#0f5132"/>
    </linearGradient>
    <linearGradient id="zmOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#zmBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#198754" stroke-opacity="0.4" stroke-width="4"/>

  <!-- Ondes radio -->
  <circle cx="256" cy="190" r="140" fill="none" stroke="#ff9800" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="256" cy="190" r="170" fill="none" stroke="#ff9800" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Emblème central aux couleurs zambiennes -->
  <g>
    <circle cx="256" cy="180" r="76" fill="#0c2e17" stroke="url(#zmOrange)" stroke-width="4"/>
    
    <!-- Tricolore vertical zambien stylisé (Rouge, Noir, Orange) -->
    <rect x="232" y="145" width="16" height="70" fill="#de2010" rx="3"/>
    <rect x="248" y="145" width="16" height="70" fill="#111111" rx="3"/>
    <rect x="264" y="145" width="16" height="70" fill="#ef7d00" rx="3"/>

    <!-- Aigle pêcheur africain stylisé en vol -->
    <path d="M 230 140 Q 256 120 282 140 Q 256 130 230 140 Z" fill="#ffb300"/>
    <circle cx="256" cy="130" r="4" fill="#ffd54f"/>
  </g>

  <!-- Titre ZAMBIA RADIO -->
  <text x="256" y="295" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30" text-anchor="middle" letter-spacing="3">ZAMBIA RADIO</text>
  <text x="256" y="325" fill="#81c784" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" text-anchor="middle" letter-spacing="3">ONE ZAMBIA • ONE NATION</text>

  <!-- Badge National FM -->
  <rect x="166" y="350" width="180" height="46" rx="23" fill="url(#zmOrange)"/>
  <text x="256" y="381" fill="#071b0e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="2">FM &amp; LIVE</text>

  <!-- Ville / Pays -->
  <text x="256" y="435" fill="#ffb74d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" text-anchor="middle" letter-spacing="2">LUSAKA • ZAMBIE 🇿🇲</text>
</svg>