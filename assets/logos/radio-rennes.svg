<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="renBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0709"/>
      <stop offset="50%" stop-color="#380e12"/>
      <stop offset="100%" stop-color="#120406"/>
    </linearGradient>
    <linearGradient id="renRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e53935"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="renGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#renBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#e53935" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Tour radio rennaise stylisée -->
  <g transform="translate(256, 175)">
    <circle cx="0" cy="0" r="76" fill="#24070a" stroke="url(#renRed)" stroke-width="5"/>
    <!-- Tour d'émission -->
    <polygon points="0,-42 -22,35 -14,35 -6,8 6,8 14,35 22,35" fill="none" stroke="#ffffff" stroke-width="4"/>
    <circle cx="0" cy="-42" r="6" fill="url(#renGold)"/>
    <!-- Ondes -->
    <path d="M -16 -35 A 20 20 0 0 1 16 -35" fill="none" stroke="url(#renGold)" stroke-width="3"/>
  </g>

  <!-- Badge Fréquence 100.8 FM -->
  <g transform="translate(256, 285)">
    <rect x="-110" y="-18" width="220" height="38" rx="19" fill="url(#renRed)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">100.8 FM</text>
  </g>

  <!-- Titre RADIO RENNES -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">RADIO RENNES</text>

  <!-- Slogan -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffcdd2" text-anchor="middle" letter-spacing="3">RADIO ASSOCIATIVE DEPUIS 1981</text>

  <!-- Ville / Pays -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffd54f" text-anchor="middle" letter-spacing="2">RENNES • ILLE-ET-VILAINE</text>
</svg>