<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="natBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0407"/>
      <stop offset="50%" stop-color="#38080d"/>
      <stop offset="100%" stop-color="#120204"/>
    </linearGradient>
    <linearGradient id="natGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#E70013"/>
    </linearGradient>
    <filter id="natShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#natBg)" stroke="#FFD100" stroke-width="3" filter="url(#natShadow)"/>

  <!-- Antenne nationale et croissant tunisien -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#E70013" stroke="#FFD100" stroke-width="2"/>
    <circle cx="0" cy="0" r="13" fill="#FFFFFF"/>
    <path d="M 2 -7 A 8 8 0 1 0 2 7 A 6.5 6.5 0 1 1 2 -7 Z" fill="#E70013"/>
    <polygon points="3,-1.5 4,0.5 6.5,0.5 4.5,2 5.5,4 3.5,3 1.5,4 2.5,2 0.5,0.5 3,0.5" fill="#E70013"/>
  </g>

  <!-- Titre RADIO NATIONALE -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="1.5" text-anchor="middle" filter="url(#natShadow)">RADIO NATIONALE</text>

  <!-- Tag الإذاعة الوطنية -->
  <rect x="34" y="116" width="132" height="26" rx="8" fill="#E70013" stroke="#FFD100" stroke-width="1.2"/>
  <text x="100" y="134" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.2" text-anchor="middle">الإذاعة الوطنية التونسية</text>

  <!-- Pied TUNISIE -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#170305" stroke="#FFD100" stroke-width="1.2"/>
  <text x="100" y="171" fill="#FFD100" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">VOIX DE LA TUNISIE</text>
</svg>

