<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="oxyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031b24"/>
      <stop offset="50%" stop-color="#073142"/>
      <stop offset="100%" stop-color="#020e14"/>
    </linearGradient>
    <linearGradient id="oxyAqua" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="50%" stop-color="#48CAE4"/>
      <stop offset="100%" stop-color="#90E0EF"/>
    </linearGradient>
    <filter id="oxyShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#oxyBg)" stroke="#00B4D8" stroke-width="3" filter="url(#oxyShadow)"/>

  <!-- Bulle d'oxygène / O2 -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#082b3a" stroke="#00B4D8" stroke-width="2"/>
    <circle cx="-4" cy="-2" r="10" fill="none" stroke="#90E0EF" stroke-width="3"/>
    <text x="10" y="8" fill="#48CAE4" font-family="'Inter', sans-serif" font-weight="900" font-size="12">2</text>
  </g>

  <!-- Titre OXYGÈNE FM -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="21" letter-spacing="2" text-anchor="middle" filter="url(#oxyShadow)">OXYGÈNE FM</text>

  <!-- Tag BIZERTE & NORD -->
  <rect x="36" y="116" width="128" height="26" rx="8" fill="url(#oxyAqua)"/>
  <text x="100" y="134" fill="#031B24" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.2" text-anchor="middle">BIZERTE • 90.0 FM</text>

  <!-- Pied TUNISIE -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#05212c" stroke="#00B4D8" stroke-width="1.2"/>
  <text x="100" y="171" fill="#48CAE4" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">L'AIR DE LA JEUNESSE</text>
</svg>

