<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bonheurBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f14"/>
      <stop offset="50%" stop-color="#123321"/>
      <stop offset="100%" stop-color="#06120b"/>
    </linearGradient>
    <linearGradient id="bonheurSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#FFB703"/>
      <stop offset="100%" stop-color="#FB8500"/>
    </linearGradient>
    <filter id="bonheurShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#bonheurBg)" stroke="#00C853" stroke-width="3" filter="url(#bonheurShadow)"/>

  <!-- Soleil éclatant et sourire / bonheur -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="22" fill="url(#bonheurSun)"/>
    <path d="M -12 2 Q 0 14 12 2" fill="none" stroke="#0b1f14" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-6" cy="-4" r="2.5" fill="#0b1f14"/>
    <circle cx="6" cy="-4" r="2.5" fill="#0b1f14"/>
    <!-- Rayons -->
    <path d="M 0 -28 L 0 -34 M 20 -20 L 25 -25 M 28 0 L 34 0 M 20 20 L 25 25 M -20 -20 L -25 -25 M -28 0 L -34 0 M -20 20 L -25 25" stroke="#FFE066" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Texte BONHEUR FM -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="2" text-anchor="middle" filter="url(#bonheurShadow)">BONHEUR FM</text>

  <!-- Fréquence 101.4 -->
  <rect x="42" y="116" width="116" height="26" rx="8" fill="#00C853"/>
  <text x="100" y="134" fill="#051a0e" font-family="'Inter', sans-serif" font-weight="900" font-size="14" letter-spacing="1.5" text-anchor="middle">101.4 FM</text>

  <!-- Sous-titre CONAKRY GUINÉE -->
  <rect x="26" y="152" width="148" height="28" rx="8" fill="#091c12" stroke="url(#bonheurSun)" stroke-width="1.2"/>
  <text x="100" y="171" fill="#FFE066" font-family="'Inter', sans-serif" font-weight="800" font-size="10.5" letter-spacing="1.8" text-anchor="middle">CONAKRY • GUINÉE</text>
</svg>

