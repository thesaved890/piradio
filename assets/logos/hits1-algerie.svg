<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgHits1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14061f"/>
      <stop offset="50%" stop-color="#260b3b"/>
      <stop offset="100%" stop-color="#0e0417"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1776"/>
      <stop offset="100%" stop-color="#E0005E"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#00A2FF"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgHits1)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#neonPink)" stroke-width="2" opacity="0.85"/>

  <!-- Logo Hits 1 stylisé -->
  <g transform="translate(100, 72)">
    <circle cx="0" cy="0" r="42" fill="#1b082a" stroke="url(#neonCyan)" stroke-width="2.5"/>
    <text x="-14" y="10" font-family="'Arial Black', Impact, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">HITS</text>
    <rect x="12" y="-22" width="26" height="44" rx="6" fill="url(#neonPink)"/>
    <text x="25" y="12" font-family="'Arial Black', Impact, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
  </g>

  <!-- Titre Algérie -->
  <text x="100" y="132" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">ALGÉRIE</text>
  <text x="100" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="url(#neonCyan)" text-anchor="middle" letter-spacing="2">TOP HITS &amp; ELECTRO</text>

  <!-- Cartouche inférieur -->
  <rect x="25" y="160" width="150" height="25" rx="8" fill="#006233" stroke="url(#neonPink)" stroke-width="1"/>
  <text x="100" y="176" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">🇩🇿 #1 WEB RADIO STREAM</text>
</svg>
