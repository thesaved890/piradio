<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="babBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140608"/>
      <stop offset="50%" stop-color="#260b10"/>
      <stop offset="100%" stop-color="#0a0304"/>
    </linearGradient>
    <linearGradient id="babRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E70013"/>
      <stop offset="50%" stop-color="#FF334B"/>
      <stop offset="100%" stop-color="#FFD100"/>
    </linearGradient>
    
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#babBg)" stroke="#E70013" stroke-width="3"/>

  <!-- Logo Babnet b stylisé -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#E70013"/>
    <text x="0" y="8" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle">b</text>
  </g>

  <!-- Titre BABNET -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="23" letter-spacing="2" text-anchor="middle">BABNET</text>

  <!-- Tag ACTUALITÉS TUNISIE -->
  <rect x="36" y="116" width="128" height="26" rx="8" fill="url(#babRed)"/>
  <text x="100" y="134" fill="#140608" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.2" text-anchor="middle">TUNISIE EN DIRECT</text>

  <!-- Pied TUNISIE -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#1a0609" stroke="#E70013" stroke-width="1.2"/>
  <text x="100" y="171" fill="#FFD100" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">LE PORTAIL DE TUNISIE</text>
</svg>