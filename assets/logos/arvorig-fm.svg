<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="arvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141a"/>
      <stop offset="50%" stop-color="#19222c"/>
      <stop offset="100%" stop-color="#090d12"/>
    </linearGradient>
    <linearGradient id="arvGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#arvBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Triskell hermine stylisé -->
  <g transform="translate(256, 175)">
    <circle cx="0" cy="0" r="76" fill="#141c24" stroke="url(#arvGold)" stroke-width="5"/>
    <!-- Triskell -->
    <path d="M 0 0 C 15 -25 35 -10 25 10 C 15 25 -5 15 0 0 Z" fill="url(#arvGold)"/>
    <path d="M 0 0 C -25 -15 -10 -35 10 -25 C 25 -15 15 5 0 0 Z" fill="url(#arvGold)" transform="rotate(120)"/>
    <path d="M 0 0 C -15 25 -35 10 -25 -10 C -15 -25 5 -15 0 0 Z" fill="url(#arvGold)" transform="rotate(240)"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- Badge Multi-fréquences -->
  <g transform="translate(256, 285)">
    <rect x="-140" y="-18" width="280" height="38" rx="19" fill="url(#arvGold)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#0f141a" text-anchor="middle" letter-spacing="1">91.7 FM • 107.0 FM</text>
  </g>

  <!-- Titre ARVORIG FM -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">ARVORIG FM</text>

  <!-- Slogan -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#e0e0e0" text-anchor="middle" letter-spacing="3">100% E BREZHONEG • PAB</text>

  <!-- Ville / Pays -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffd54f" text-anchor="middle" letter-spacing="2">LANDERNEAU • MORLAIX • BZH</text>
</svg>