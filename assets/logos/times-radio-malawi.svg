<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="tmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240707"/>
      <stop offset="50%" stop-color="#450d0d"/>
      <stop offset="100%" stop-color="#140303"/>
    </linearGradient>
    <linearGradient id="tmRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3838"/>
      <stop offset="100%" stop-color="#c01515"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#tmBg)"/>
  <circle cx="100" cy="84" r="58" fill="none" stroke="url(#tmRed)" stroke-width="2.5"/>
  <!-- Bold "TIMES" Emblem -->
  <rect x="52" y="62" width="96" height="42" rx="8" fill="url(#tmRed)"/>
  <text x="100" y="91" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="3" text-anchor="middle">TIMES</text>
  <!-- Radio Wave Badge -->
  <circle cx="100" cy="116" r="4" fill="#ffffff"/>
  <path d="M 88 116 A 12 12 0 0 1 112 116" fill="none" stroke="#ff3838" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 80 116 A 20 20 0 0 1 120 116" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <text x="100" y="134" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="900" fill="#ffd700" letter-spacing="1.5" text-anchor="middle">FIRST WITH THE NEWS</text>
  <!-- Banner -->
  <rect x="18" y="146" width="164" height="36" rx="10" fill="#1a0505" stroke="url(#tmRed)" stroke-width="1.5"/>
  <text x="100" y="163" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">TIMES RADIO MALAWI</text>
  <text x="100" y="176" font-family="system-ui,-apple-system,sans-serif" font-size="8.5" font-weight="700" fill="#ff3838" letter-spacing="1.2" text-anchor="middle">BLANTYRE &amp; LILONGWE</text>
</svg>