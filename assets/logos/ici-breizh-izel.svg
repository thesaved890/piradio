<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bziBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041b33"/>
      <stop offset="50%" stop-color="#0a325e"/>
      <stop offset="100%" stop-color="#021021"/>
    </linearGradient>
    <linearGradient id="bziBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a0e9"/>
      <stop offset="100%" stop-color="#005bac"/>
    </linearGradient>
    <linearGradient id="bziOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ff6d00"/>
    </linearGradient>
    
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#bziBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#00a0e9" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Emblème ICI Radio France -->
  <g transform="translate(256, 175)">
    <rect x="-85" y="-55" width="170" height="110" rx="26" fill="url(#bziBlue)" stroke="#ffffff" stroke-width="3"/>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">ici</text>
  </g>

  <!-- Badge Fréquences -->
  <g transform="translate(256, 285)">
    <rect x="-140" y="-18" width="280" height="38" rx="19" fill="url(#bziOrange)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">BREST 99.3 • QUIMPER 98.6</text>
  </g>

  <!-- Titre Principal ICI BREIZH IZEL -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">ICI BREIZH IZEL</text>

  <!-- Slogan -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#80d8ff" text-anchor="middle" letter-spacing="3">LA VOIX DU FINISTÈRE &amp; MORBIHAN</text>

  <!-- Villes de diffusion -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffd54f" text-anchor="middle" letter-spacing="2">RADIO FRANCE • BRETAGNE OUEST</text>
</svg>