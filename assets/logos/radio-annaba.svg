<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgAnnaba" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071d2b"/>
      <stop offset="50%" stop-color="#0e3d59"/>
      <stop offset="100%" stop-color="#05151f"/>
    </linearGradient>
    <linearGradient id="cyanAnnaba" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80DEEA"/>
      <stop offset="50%" stop-color="#26C6DA"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>
    <linearGradient id="goldAnnaba" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgAnnaba)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#cyanAnnaba)" stroke-width="2" opacity="0.85"/>

  <!-- En-tête Radio Algérie -->
  <text x="100" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="url(#goldAnnaba)" text-anchor="middle" letter-spacing="2">RADIO ALGÉRIE</text>

  <!-- Phare du Cap de Garde &amp; Baie d'Annaba stylisé -->
  <g transform="translate(100, 74)">
    <circle cx="0" cy="0" r="40" fill="#082333" stroke="url(#cyanAnnaba)" stroke-width="2.5"/>
    <!-- Phare stylisé -->
    <polygon points="-8,18 8,18 4,-16 -4,-16" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="0" cy="-20" r="4" fill="url(#goldAnnaba)"/>
    <!-- Faisceaux de lumière -->
    <line x1="-6" y1="-20" x2="-26" y2="-30" stroke="url(#goldAnnaba)" stroke-width="1.5" stroke-dasharray="2 3"/>
    <line x1="6" y1="-20" x2="26" y2="-30" stroke="url(#goldAnnaba)" stroke-width="1.5" stroke-dasharray="2 3"/>
    <!-- Mer turquoise -->
    <path d="M -26,20 Q -13,14 0,20 T 26,20" fill="none" stroke="url(#cyanAnnaba)" stroke-width="2"/>
  </g>

  <!-- Titre Annaba -->
  <text x="100" y="132" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ANNABA</text>
  <text x="100" y="150" font-family="'Amiri', 'Traditional Arabic', serif" font-size="17" font-weight="bold" fill="url(#cyanAnnaba)" text-anchor="middle">إذاعة عنابة • بونة</text>

  <!-- Cartouche inférieur -->
  <rect x="25" y="162" width="150" height="25" rx="8" fill="url(#cyanAnnaba)"/>
  <text x="100" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="900" fill="#071D2B" text-anchor="middle" letter-spacing="1">HIPPONE • PERLE DE L'EST</text>
</svg>
