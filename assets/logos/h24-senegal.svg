<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="h24Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001833"/>
      <stop offset="50%" stop-color="#003366"/>
      <stop offset="100%" stop-color="#000F21"/>
    </linearGradient>
    <linearGradient id="h24Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40C4FF"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F3B43F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#h24Bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.85"/>

  <!-- Clock 24/7 Motif -->
  <g transform="translate(256, 150)">
    <circle cx="0" cy="0" r="65" fill="#001E3D" stroke="url(#h24Cyan)" stroke-width="4"/>
    <text x="0" y="24" font-family="'Impact', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="url(#gold)" text-anchor="middle">24H</text>
  </g>

  <!-- Big Typography -->
  <text x="256" y="265" font-family="'Impact', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="96" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">H24</text>
  <text x="256" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="url(#h24Cyan)" text-anchor="middle" letter-spacing="8">RADIO SÉNÉGAL</text>

  <!-- Slogan &amp; Country -->
  <text x="256" y="370" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#B3E5FC" text-anchor="middle" letter-spacing="3">L'INFO EN CONTINU</text>
  <text x="256" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#E1F5FE" text-anchor="middle" letter-spacing="2">DAKAR • 24 HEURES SUR 24</text>

  <!-- Live Tag -->
  <g transform="translate(146, 430)">
    <rect width="220" height="38" rx="19" fill="#00180B" stroke="url(#gold)" stroke-width="2"/>
    <text x="110" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" fill="#00E676" text-anchor="middle" letter-spacing="3">🇸🇳 LIVE 24/7</text>
  </g>
</svg>
