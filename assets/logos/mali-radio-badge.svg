<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="mlDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1912"/>
      <stop offset="50%" stop-color="#142618"/>
      <stop offset="100%" stop-color="#1d0a0a"/>
    </linearGradient>
    <linearGradient id="mlGoldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE853"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#D4A000"/>
    </linearGradient>
    <linearGradient id="mlGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14B53A"/>
      <stop offset="100%" stop-color="#0E8228"/>
    </linearGradient>
    <linearGradient id="mlRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3848"/>
      <stop offset="100%" stop-color="#CE1126"/>
    </linearGradient>
    <filter id="mlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="200" height="200" rx="36" fill="url(#mlDarkBg)"/>
  <rect width="194" height="194" x="3" y="3" rx="33" fill="none" stroke="url(#mlGoldGlow)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Subtle Mali tricolor vertical bar accents -->
  <g opacity="0.35">
    <rect x="24" y="20" width="48" height="160" rx="10" fill="url(#mlGreenGrad)"/>
    <rect x="76" y="20" width="48" height="160" rx="10" fill="url(#mlGoldGlow)"/>
    <rect x="128" y="20" width="48" height="160" rx="10" fill="url(#mlRedGrad)"/>
  </g>

  <!-- Inner Dark Glass Circle -->
  <circle cx="100" cy="95" r="62" fill="#0b1713" stroke="url(#mlGoldGlow)" stroke-width="2" filter="url(#mlGlow)"/>

  <!-- Radio Antenna & Signal Waves -->
  <path d="M 68 80 A 42 42 0 0 1 68 110" fill="none" stroke="url(#mlGreenGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 58 72 A 56 56 0 0 1 58 118" fill="none" stroke="url(#mlGreenGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>
  <path d="M 132 80 A 42 42 0 0 0 132 110" fill="none" stroke="url(#mlRedGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 142 72 A 56 56 0 0 0 142 118" fill="none" stroke="url(#mlRedGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>

  <!-- Pi Network Symbol π in Gold -->
  <g transform="translate(100, 92) scale(1.15)">
    <!-- Pi top bar -->
    <path d="M -22 -14 C -20 -18, -12 -18, 0 -18 C 12 -18, 20 -18, 22 -14 C 23 -11, 20 -11, 16 -13 C 10 -15, -10 -15, -16 -13 C -20 -11, -23 -11, -22 -14 Z" fill="url(#mlGoldGlow)"/>
    <!-- Pi legs -->
    <path d="M -12 -14 C -12 0, -14 10, -18 16 C -20 18, -17 20, -14 18 C -10 13, -7 0, -6 -14 Z" fill="url(#mlGoldGlow)"/>
    <path d="M 7 -14 L 7 12 C 7 17, 10 19, 14 19 C 17 19, 18 17, 16 16 C 13 16, 12 14, 12 11 L 12 -14 Z" fill="url(#mlGoldGlow)"/>
  </g>

  <!-- Mali Cultural Kanaga Sign / Antenna top dot -->
  <circle cx="100" cy="56" r="4.5" fill="#FFE853" filter="url(#mlGlow)"/>

  <!-- Banner Bottom -->
  <rect x="22" y="152" width="156" height="30" rx="8" fill="#07100b" stroke="url(#mlGoldGlow)" stroke-width="1.5"/>
  <text x="100" y="172" fill="#FFE853" font-family="'Inter', sans-serif" font-weight="900" font-size="13" letter-spacing="2.5" text-anchor="middle">MALI RADIO</text>
</svg>
