<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="trBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1405"/>
      <stop offset="50%" stop-color="#14260a"/>
      <stop offset="100%" stop-color="#060c02"/>
    </linearGradient>
    <linearGradient id="trLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEFF41"/>
      <stop offset="50%" stop-color="#C6FF00"/>
      <stop offset="100%" stop-color="#AEEA00"/>
    </linearGradient>
    <radialGradient id="trGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#C6FF00" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C6FF00" stop-opacity="0"/>
    </radialGradient>
    
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#trBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#trLime)" stroke-width="3" stroke-opacity="0.8"/>
  <circle cx="256" cy="190" r="170" fill="url(#trGlow)"/>

  <!-- Ondes radio -->
  <g fill="none" stroke="url(#trLime)" stroke-linecap="round" opacity="0.8">
    <path d="M 140 170 A 130 130 0 0 1 372 170" stroke-width="3" stroke-dasharray="6 8"/>
    <path d="M 170 180 A 100 100 0 0 1 342 180" stroke-width="4"/>
    <path d="M 200 190 A 70 70 0 0 1 312 190" stroke-width="5"/>
  </g>

  <!-- Capsule TRACE noire avec typographie Lime néon -->
  <g transform="translate(256, 185)">
    <rect x="-95" y="-50" width="190" height="100" rx="20" fill="#000000" stroke="url(#trLime)" stroke-width="3"/>
    <text x="0" y="20" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="url(#trLime)" text-anchor="middle" letter-spacing="3">TRACE</text>
  </g>

  <!-- Badge 95.0 FM Abidjan -->
  <g transform="translate(256, 285)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="url(#trLime)"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="2">95.0 FM • ABIDJAN</text>
  </g>

  <!-- Titre Principal TRACE FM -->
  <text x="256" y="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">TRACE FM CÔTE D'IVOIRE</text>

  <!-- Sous-titre We Are Urban Music -->
  <text x="256" y="395" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="url(#trLime)" text-anchor="middle" letter-spacing="3">WE ARE URBAN MUSIC</text>

  <!-- Drapeau ivoirien miniature en bas -->
  <g transform="translate(256, 430)">
    <rect x="-18" y="-7" width="12" height="14" fill="#FF8200" rx="2"/>
    <rect x="-6" y="-7" width="12" height="14" fill="#FFFFFF"/>
    <rect x="6" y="-7" width="12" height="14" fill="#009A44" rx="2"/>
    <rect x="-18" y="-7" width="36" height="14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" rx="2"/>
  </g>
</svg>