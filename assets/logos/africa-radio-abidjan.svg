<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="arBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0f0a"/>
      <stop offset="50%" stop-color="#361b12"/>
      <stop offset="100%" stop-color="#120704"/>
    </linearGradient>
    <linearGradient id="arTerra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043"/>
      <stop offset="50%" stop-color="#D84315"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>
    <linearGradient id="arGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <radialGradient id="arGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FF7043" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF7043" stop-opacity="0"/>
    </radialGradient>
    
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#arBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#arTerra)" stroke-width="3" stroke-opacity="0.8"/>
  <circle cx="256" cy="190" r="170" fill="url(#arGlow)"/>

  <!-- Ondes radio -->
  <g fill="none" stroke="url(#arGold)" stroke-linecap="round" opacity="0.8">
    <path d="M 140 170 A 130 130 0 0 1 372 170" stroke-width="3" stroke-dasharray="6 8"/>
    <path d="M 170 180 A 100 100 0 0 1 342 180" stroke-width="4"/>
    <path d="M 200 190 A 70 70 0 0 1 312 190" stroke-width="5"/>
  </g>

  <!-- Disque central Terracotta avec silhouette de l'Afrique stylisée -->
  <g transform="translate(256, 185)">
    <circle cx="0" cy="0" r="62" fill="url(#arTerra)"/>
    <circle cx="0" cy="0" r="54" fill="#1c0f0a"/>
    <text x="0" y="14" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="url(#arGold)" text-anchor="middle" letter-spacing="2">AFRICA</text>
  </g>

  <!-- Badge 107.5 FM Abidjan -->
  <g transform="translate(256, 285)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="url(#arGold)"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#1c0f0a" text-anchor="middle" letter-spacing="2">107.5 FM • ABIDJAN</text>
  </g>

  <!-- Titre Principal AFRICA RADIO -->
  <text x="256" y="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">AFRICA RADIO</text>

  <!-- Sous-titre Le Son du Continent -->
  <text x="256" y="395" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="url(#arTerra)" text-anchor="middle" letter-spacing="3">LE SON DU CONTINENT</text>

  <!-- Drapeau ivoirien miniature en bas -->
  <g transform="translate(256, 430)">
    <rect x="-18" y="-7" width="12" height="14" fill="#FF8200" rx="2"/>
    <rect x="-6" y="-7" width="12" height="14" fill="#FFFFFF"/>
    <rect x="6" y="-7" width="12" height="14" fill="#009A44" rx="2"/>
    <rect x="-18" y="-7" width="36" height="14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" rx="2"/>
  </g>
</svg>