<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="capBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04182b"/>
      <stop offset="50%" stop-color="#093054"/>
      <stop offset="100%" stop-color="#020e1a"/>
    </linearGradient>
    <linearGradient id="capSea" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#90E0EF"/>
    </linearGradient>
    <filter id="capShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#capBg)" stroke="#00B4D8" stroke-width="3" filter="url(#capShadow)"/>

  <!-- Phare du Cap et rayons lumineux -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#062542" stroke="#00B4D8" stroke-width="2"/>
    <polygon points="-4,12 4,12 2,-6 -2,-6" fill="#FFFFFF"/>
    <rect x="-3" y="-10" width="6" height="4" fill="#FFD166"/>
    <!-- Faisceaux du phare -->
    <path d="M 3 -8 L 18 -14 M -3 -8 L -18 -14" stroke="#FFD166" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Titre CAP RADIO -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="23" letter-spacing="2" text-anchor="middle" filter="url(#capShadow)">CAP RADIO</text>

  <!-- Tag TANGER &amp; NORD -->
  <rect x="36" y="116" width="128" height="26" rx="8" fill="url(#capSea)"/>
  <text x="100" y="134" fill="#04182B" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.5" text-anchor="middle">TANGER • NORD</text>

  <!-- Pied MAROC -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#051f38" stroke="#00B4D8" stroke-width="1.2"/>
  <text x="100" y="171" fill="#90E0EF" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">VOIX DE LA MÉDITERRANÉE</text>
</svg>
