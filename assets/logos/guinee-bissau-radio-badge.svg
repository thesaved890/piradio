<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gwBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a0c"/>
      <stop offset="50%" stop-color="#241217"/>
      <stop offset="100%" stop-color="#0a0507"/>
    </linearGradient>
    <linearGradient id="gwGoldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD116"/>
      <stop offset="50%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#E53935"/>
    </linearGradient>
    <filter id="gwDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fond arrondi avec bordure dorée -->
  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#gwBgGrad)" stroke="url(#gwGoldGlow)" stroke-width="3" filter="url(#gwDropShadow)"/>

  <!-- Écusson officiel Guinée-Bissau -->
  <g transform="translate(42, 28)" filter="url(#gwDropShadow)">
    <clipPath id="gwShieldClip">
      <path d="M 0 10 Q 0 0 10 0 L 106 0 Q 116 0 116 10 L 116 55 Q 116 95 58 116 Q 0 95 0 55 Z"/>
    </clipPath>
    <g clip-path="url(#gwShieldClip)">
      <!-- Bande Rouge verticale à gauche -->
      <rect x="0" y="0" width="45" height="120" fill="#CE1126"/>
      <!-- Étoile noire africaine sur fond rouge -->
      <polygon points="22.5,22 26.5,33 38,33 28.5,40 32,51 22.5,44 13,51 16.5,40 7,33 18.5,33" fill="#000000"/>
      <!-- Bande Jaune horizontale en haut à droite -->
      <rect x="45" y="0" width="71" height="58" fill="#FCD116"/>
      <!-- Bande Verte horizontale en bas à droite -->
      <rect x="45" y="58" width="71" height="62" fill="#009460"/>
    </g>
    <!-- Contour de l'écusson -->
    <path d="M 0 10 Q 0 0 10 0 L 106 0 Q 116 0 116 10 L 116 55 Q 116 95 58 116 Q 0 95 0 55 Z" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    
    <!-- Médaillon Pi au centre -->
    <circle cx="58" cy="62" r="24" fill="#0e0a0d" opacity="0.92" stroke="url(#gwGoldGlow)" stroke-width="2.5"/>
    <text x="58" y="71" fill="#FCD116" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="24" text-anchor="middle">π</text>
  </g>

  <!-- Cartouche GUINÉE-BISSAU -->
  <rect x="18" y="152" width="164" height="30" rx="8" fill="#120608" stroke="url(#gwGoldGlow)" stroke-width="1.5"/>
  <text x="100" y="172" fill="#FCD116" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.5" text-anchor="middle">GUINÉE-BISSAU</text>
</svg>
