<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="sahelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e05"/>
      <stop offset="50%" stop-color="#2a1607"/>
      <stop offset="100%" stop-color="#0a0501"/>
    </linearGradient>
    <linearGradient id="sahelOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <linearGradient id="sahelGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#B2FF59"/>
    </linearGradient>
    <linearGradient id="sahelGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#FFAB00"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#sahelBg)"/>
  <rect width="194" height="194" x="3" y="3" rx="33" fill="none" stroke="url(#sahelGold)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Flag emblem with sun -->
  <circle cx="100" cy="74" r="38" fill="#100802" stroke="url(#sahelOrange)" stroke-width="2"/>
  <path d="M 76 60 L 124 60" stroke="url(#sahelOrange)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="74" r="10" fill="url(#sahelGold)"/>
  <path d="M 76 88 L 124 88" stroke="url(#sahelGreen)" stroke-width="4" stroke-linecap="round"/>

  <text x="100" y="130" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="16" letter-spacing="1" text-anchor="middle">VOIX DU SAHEL</text>
  <text x="100" y="148" fill="url(#sahelGold)" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="1.5" text-anchor="middle">RTN 91.3 FM</text>

  <rect x="36" y="166" width="128" height="20" rx="6" fill="#080301" stroke="url(#sahelOrange)" stroke-width="1.2"/>
  <text x="100" y="180" fill="#B2FF59" font-family="'Inter', sans-serif" font-weight="700" font-size="8.5" letter-spacing="1" text-anchor="middle">NIAMEY • RADIO NATIONALE</text>
