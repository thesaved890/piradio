<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgTizi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d17"/>
      <stop offset="50%" stop-color="#123b2c"/>
      <stop offset="100%" stop-color="#071712"/>
    </linearGradient>
    <linearGradient id="kabyleRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#D32F2F"/>
    </linearGradient>
    <linearGradient id="kabyleYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgTizi)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#kabyleYellow)" stroke-width="2" opacity="0.85"/>

  <!-- En-tête Radio Algérie -->
  <text x="100" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="url(#kabyleYellow)" text-anchor="middle" letter-spacing="2">RADIO ALGÉRIE</text>

  <!-- Montagnes du Djurdjura &amp; Symbole Yaz Amazigh ⵣ -->
  <g transform="translate(100, 74)">
    <circle cx="0" cy="0" r="40" fill="#0b241c" stroke="url(#kabyleRed)" stroke-width="2.5"/>
    <!-- Sommets enneigés Djurdjura -->
    <polygon points="-30,16 -12,-12 0,4 14,-18 30,16" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Symbole Yaz -->
    <text x="0" y="10" font-family="'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="url(#kabyleYellow)" text-anchor="middle">ⵣ</text>
  </g>

  <!-- Titre Tizi Ouzou -->
  <text x="100" y="132" font-family="'Arial Black', sans-serif" font-size="15" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">TIZI OUZOU</text>
  <text x="100" y="150" font-family="'Amiri', 'Traditional Arabic', serif" font-size="16" font-weight="bold" fill="url(#kabyleYellow)" text-anchor="middle">إذاعة تيزي وزو • تامازيغت</text>

  <!-- Cartouche inférieur -->
  <rect x="20" y="162" width="160" height="25" rx="8" fill="url(#kabyleRed)"/>
  <text x="100" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GRANDE KABYLIE • DJURDJURA</text>
</svg>
