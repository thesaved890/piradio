<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tnBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24070a"/>
      <stop offset="50%" stop-color="#3d0a0f"/>
      <stop offset="100%" stop-color="#140305"/>
    </linearGradient>
    <linearGradient id="tnGoldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    <filter id="tnDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fond arrondi avec liseré or -->
  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#tnBgGrad)" stroke="url(#tnGoldGlow)" stroke-width="3" filter="url(#tnDropShadow)"/>

  <!-- Écusson tunisien officiel -->
  <g transform="translate(42, 28)" filter="url(#tnDropShadow)">
    <clipPath id="tnShieldClip">
      <path d="M 0 10 Q 0 0 10 0 L 106 0 Q 116 0 116 10 L 116 55 Q 116 95 58 116 Q 0 95 0 55 Z"/>
    </clipPath>
    <g clip-path="url(#tnShieldClip)">
      <!-- Fond Rouge Tunisien -->
      <rect x="0" y="0" width="116" height="120" fill="#E70013"/>
      <!-- Disque blanc central -->
      <circle cx="58" cy="56" r="32" fill="#FFFFFF"/>
      <!-- Croissant rouge tunisien -->
      <path d="M 64 36 A 20 20 0 1 0 64 76 A 16 16 0 1 1 64 36 Z" fill="#E70013"/>
      <!-- Étoile rouge à 5 branches -->
      <polygon points="65,46 67.5,52.5 74.5,52.5 69,57 71,63.5 65,59.5 59,63.5 61,57 55.5,52.5 62.5,52.5" fill="#E70013"/>
    </g>
    <!-- Contour de l'écusson -->
    <path d="M 0 10 Q 0 0 10 0 L 106 0 Q 116 0 116 10 L 116 55 Q 116 95 58 116 Q 0 95 0 55 Z" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.95"/>
    
    <!-- Médaillon Pi au centre bas -->
    <circle cx="58" cy="94" r="16" fill="#140305" opacity="0.92" stroke="url(#tnGoldGlow)" stroke-width="2"/>
    <text x="58" y="100" fill="#FFD100" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="16" text-anchor="middle">π</text>
  </g>

  <!-- Cartouche TUNISIE -->
  <rect x="22" y="152" width="156" height="30" rx="8" fill="#180407" stroke="url(#tnGoldGlow)" stroke-width="1.5"/>
  <text x="100" y="172" fill="#FFD100" font-family="'Inter', sans-serif" font-weight="900" font-size="13" letter-spacing="2.5" text-anchor="middle">TUNISIE 🇹🇳</text>
</svg>
