<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="reBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26"/>
      <stop offset="50%" stop-color="#0d3247"/>
      <stop offset="100%" stop-color="#04121a"/>
    </linearGradient>
    <linearGradient id="reBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="reGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <filter id="reDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#reBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#reBlue)" stroke-width="3" stroke-opacity="0.8"/>

  <g filter="url(#reDrop)" transform="translate(256, 185)">
    <circle cx="0" cy="0" r="62" fill="url(#reBlue)"/>
    <circle cx="0" cy="0" r="54" fill="#071b26"/>
    <!-- Croix chrétienne stylisée et flamme d'espoir -->
    <path d="M -6 -28 L 6 -28 L 6 -6 L 24 -6 L 24 6 L 6 6 L 6 28 L -6 28 L -6 6 L -24 6 L -24 -6 L -6 -6 Z" fill="url(#reGold)"/>
  </g>

  <!-- Badge 102.8 FM Port-Bouët / Abidjan -->
  <g transform="translate(256, 285)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="url(#reGold)" filter="url(#reDrop)"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#071b26" text-anchor="middle" letter-spacing="2">102.8 FM • ABIDJAN</text>
  </g>

  <!-- Titre Principal RADIO ESPOIR -->
  <text x="256" y="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">RADIO ESPOIR</text>

  <!-- Sous-titre La Voix Catholique -->
  <text x="256" y="395" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="url(#reBlue)" text-anchor="middle" letter-spacing="3">LA VOIX CATHOLIQUE • PORT-BOUËT</text>

  <!-- Drapeau ivoirien miniature en bas -->
  <g transform="translate(256, 430)">
    <rect x="-18" y="-7" width="12" height="14" fill="#FF8200" rx="2"/>
    <rect x="-6" y="-7" width="12" height="14" fill="#FFFFFF"/>
    <rect x="6" y="-7" width="12" height="14" fill="#009A44" rx="2"/>
    <rect x="-18" y="-7" width="36" height="14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" rx="2"/>
  </g>
</svg>