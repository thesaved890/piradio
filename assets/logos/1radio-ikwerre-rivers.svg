<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ikwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="50%" stop-color="#004C87"/>
      <stop offset="100%" stop-color="#001020"/>
    </linearGradient>
    <linearGradient id="ikwGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F3B43F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#ikwBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#ikwGold)" stroke-width="4" stroke-opacity="0.85"/>

  <!-- Center Ikwerre Symbol / 1Radio -->
  <g transform="translate(256, 150)">
    <circle cx="0" cy="0" r="65" fill="#00162B" stroke="url(#ikwGold)" stroke-width="4"/>
    <text x="0" y="24" font-family="'Impact', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="70" fill="url(#ikwGold)" text-anchor="middle">1R</text>
  </g>

  <!-- Big Typography -->
  <text x="256" y="270" font-family="'Impact', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">1RADIO IKWERRE</text>
  <text x="256" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" fill="url(#ikwGold)" text-anchor="middle" letter-spacing="6">PORT HARCOURT</text>

  <!-- Slogan -->
  <text x="256" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#B3E5FC" text-anchor="middle" letter-spacing="3">RIVERS STATE • NIGERIA</text>
  <text x="256" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#E1F5FE" text-anchor="middle" letter-spacing="2">IKWERRE HERITAGE &amp; MUSIC</text>

  <!-- Live Tag -->
  <g transform="translate(146, 430)">
    <rect width="220" height="38" rx="19" fill="#003318" stroke="url(#ikwGold)" stroke-width="2"/>
    <text x="110" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" fill="#00E676" text-anchor="middle" letter-spacing="3">🇳🇬 RIVERS LIVE</text>
  </g>
