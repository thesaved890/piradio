<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="gnBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1712"/>
      <stop offset="50%" stop-color="#14241b"/>
      <stop offset="100%" stop-color="#070c0a"/>
    </linearGradient>
    <linearGradient id="gnGoldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD116"/>
      <stop offset="50%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    <filter id="gnDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fond arrondi avec bordure dorée -->
  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#gnBgGrad)" stroke="url(#gnGoldGlow)" stroke-width="3" filter="url(#gnDropShadow)"/>

  <!-- Écusson tricolore Guinéen (Rouge, Jaune, Vert en bandes verticales) -->
  <g transform="translate(42, 28)" filter="url(#gnDropShadow)">
    <clipPath id="gnShieldClip">
      <path d="M 0 10 Q 0 0 10 0 L 106 0 Q 116 0 116 10 L 116 55 Q 116 95 58 116 Q 0 95 0 55 Z"/>
    </clipPath>
    <g clip-path="url(#gnShieldClip)">
      <!-- Bande Rouge (gauche) -->
      <rect x="0" y="0" width="38.7" height="120" fill="#CE1126"/>
      <!-- Bande Jaune (centre) -->
      <rect x="38.7" y="0" width="38.7" height="120" fill="#FCD116"/>
      <!-- Bande Verte (droite) -->
      <rect x="77.4" y="0" width="38.7" height="120" fill="#009460"/>
    </g>
    <!-- Contour de l'écusson -->
    <path d="M 0 10 Q 0 0 10 0 L 106 0 Q 116 0 116 10 L 116 55 Q 116 95 58 116 Q 0 95 0 55 Z" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.9"/>
    
    <!-- Symbole Pi au cœur de l'écusson -->
    <circle cx="58" cy="56" r="28" fill="#0c1a13" opacity="0.88" stroke="url(#gnGoldGlow)" stroke-width="2.5"/>
    <text x="58" y="66" fill="#FCD116" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="28" text-anchor="middle">π</text>
  </g>

  <!-- Cartouche textuel GUINÉE CONAKRY -->
  <rect x="22" y="152" width="156" height="30" rx="8" fill="#06120b" stroke="url(#gnGoldGlow)" stroke-width="1.5"/>
  <text x="100" y="172" fill="#FCD116" font-family="'Inter', sans-serif" font-weight="900" font-size="13" letter-spacing="2.5" text-anchor="middle">GUINÉE</text>
</svg>
