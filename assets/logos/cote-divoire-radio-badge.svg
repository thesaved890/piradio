<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ciBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1105"/>
      <stop offset="50%" stop-color="#2d1a08"/>
      <stop offset="100%" stop-color="#0e0702"/>
    </linearGradient>
    <linearGradient id="ciOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA040"/>
      <stop offset="50%" stop-color="#FF8200"/>
      <stop offset="100%" stop-color="#D65F00"/>
    </linearGradient>
    <linearGradient id="ciGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="50%" stop-color="#009A44"/>
      <stop offset="100%" stop-color="#00662A"/>
    </linearGradient>
    <linearGradient id="ciGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <radialGradient id="ciGlow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FF8200" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF8200" stop-opacity="0"/>
    </radialGradient>
    
  </defs>

  <!-- Fond circulaire sombre -->
  <circle cx="256" cy="256" r="240" fill="url(#ciBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ciGold)" stroke-width="4" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="256" cy="205" r="180" fill="url(#ciGlow)"/>

  <!-- Ondes Radio supérieures -->
  <g fill="none" stroke="url(#ciGold)" stroke-linecap="round" opacity="0.85">
    <path d="M 120 180 A 150 150 0 0 1 392 180" stroke-width="3" stroke-dasharray="6 8"/>
    <path d="M 150 195 A 120 120 0 0 1 362 195" stroke-width="4"/>
    <path d="M 180 210 A 90 90 0 0 1 332 210" stroke-width="5"/>
  </g>

  <!-- Écusson National Ivoirien (Orange, Blanc, Vert) -->
  <g>
    <clipPath id="ciShieldClip">
      <path d="M 176 140 C 176 140 256 126 336 140 C 336 210 336 266 256 312 C 176 266 176 210 176 140 Z"/>
    </clipPath>
    <g clip-path="url(#ciShieldClip)">
      <rect x="176" y="126" width="54" height="190" fill="url(#ciOrange)"/>
      <rect x="230" y="126" width="52" height="190" fill="#FFFFFF"/>
      <rect x="282" y="126" width="54" height="190" fill="url(#ciGreen)"/>
    </g>
    <path d="M 176 140 C 176 140 256 126 336 140 C 336 210 336 266 256 312 C 176 266 176 210 176 140 Z" fill="none" stroke="url(#ciGold)" stroke-width="5"/>
  </g>

  <!-- Symbole Pi au centre de l'écusson -->
  <g transform="translate(256, 218) scale(1.1)">
    <circle cx="0" cy="0" r="32" fill="#1f1105" stroke="url(#ciGold)" stroke-width="2.5"/>
    <text x="0" y="12" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="url(#ciGold)" text-anchor="middle">π</text>
  </g>

  <!-- Éléphant stylisé en bas du bouclier -->
  <g transform="translate(256, 332)">
    <circle cx="-30" cy="0" r="2" fill="#FF8200" opacity="0.8"/>
    <polygon points="0,-8 2.5,-2.5 8,-2.5 3.5,1.5 5,7 0,3.5 -5,7 -3.5,1.5 -8,-2.5 -2.5,-2.5" fill="url(#ciGold)"/>
    <circle cx="30" cy="0" r="2" fill="#009A44" opacity="0.8"/>
  </g>

  <!-- Banderole CÔTE D'IVOIRE -->
  <g transform="translate(256, 380)">
    <rect x="-160" y="-24" width="320" height="48" rx="24" fill="#140a03" stroke="url(#ciGold)" stroke-width="3"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">CÔTE D'IVOIRE</text>
  </g>

  <!-- Sous-titre officiel -->
  <text x="256" y="434" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="url(#ciGold)" text-anchor="middle" letter-spacing="3" opacity="0.95">RADIO LIVE • FM &amp; WEB</text>
</svg>