<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nagBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002D15"/>
      <stop offset="50%" stop-color="#004D25"/>
      <stop offset="100%" stop-color="#001F0E"/>
    </linearGradient>
    <linearGradient id="nagGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F3B43F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#nagBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#nagGold)" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Islamic / Cultural crescent & star / microphone -->
  <g transform="translate(256, 160)">
    <circle cx="0" cy="0" r="62" fill="#00180B" stroke="url(#nagGold)" stroke-width="4"/>
    <text x="0" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="url(#nagGold)" text-anchor="middle">🌙</text>
  </g>

  <!-- Typography -->
  <text x="256" y="285" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">NAGARI RADIO</text>
  <text x="256" y="335" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="url(#nagGold)" text-anchor="middle" letter-spacing="6">MURYAR AL'UMMA</text>
  <text x="256" y="380" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#A5D6A7" text-anchor="middle" letter-spacing="3">HAUSA BROADCASTING NIGERIA</text>

  <!-- Live Tag -->
  <g transform="translate(146, 420)">
    <rect width="220" height="40" rx="20" fill="#001a0d" stroke="url(#nagGold)" stroke-width="2"/>
    <text x="110" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#00E676" text-anchor="middle" letter-spacing="3">🇳🇬 HAUSA LIVE 24/7</text>
  </g>
</svg>

