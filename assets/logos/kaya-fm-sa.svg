<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgKaya" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19130c"/>
      <stop offset="50%" stop-color="#382512"/>
      <stop offset="100%" stop-color="#120c06"/>
    </linearGradient>
    <linearGradient id="goldKaya" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FB8C00"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgKaya)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#goldKaya)" stroke-width="2.5" opacity="0.85"/>

  <!-- Logo Kaya FM Afropolitan -->
  <g transform="translate(100, 68)">
    <circle cx="0" cy="0" r="38" fill="#24170a" stroke="url(#goldKaya)" stroke-width="2.5"/>
    <!-- Saxophone / Note de Jazz & silhouette urbaine Joburg -->
    <path d="M -10,-18 L -10,8 A 12 12 0 0 0 10,8 L 10,-8" fill="none" stroke="url(#goldKaya)" stroke-width="3"/>
    <circle cx="10" cy="-8" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Titre KAYA 95.9 -->
  <text x="100" y="126" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">KAYA 95.9</text>
  <text x="100" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="url(#goldKaya)" text-anchor="middle" letter-spacing="2">ON THE STREET ON THE AIR</text>

  <!-- Cartouche Joburg Afropolitan -->
  <rect x="20" y="158" width="160" height="26" rx="8" fill="url(#goldKaya)"/>
  <text x="100" y="175" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#1C1106" text-anchor="middle" letter-spacing="1">JOHANNESBURG • SOUL & JAZZ</text>
</svg>
