<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="hodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0933"/>
      <stop offset="50%" stop-color="#321066"/>
      <stop offset="100%" stop-color="#0E051C"/>
    </linearGradient>
    <linearGradient id="hodGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F3B43F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#hodBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#hodGold)" stroke-width="4" stroke-opacity="0.85"/>

  <!-- Center Cross / Beacon -->
  <g transform="translate(256, 160)">
    <circle cx="0" cy="0" r="62" fill="#200a40" stroke="url(#hodGold)" stroke-width="4"/>
    <text x="0" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="url(#hodGold)" text-anchor="middle">✝️</text>
  </g>

  <!-- Big HOD RADIO Typography -->
  <text x="256" y="275" font-family="'Impact', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">HOD RADIO</text>
  <text x="256" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" fill="url(#hodGold)" text-anchor="middle" letter-spacing="8">NIGERIA</text>

  <!-- Slogan -->
  <text x="256" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#E1BEE7" text-anchor="middle" letter-spacing="3">HOUSE OF DAVID BROADCASTING</text>
  <text x="256" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#F3E5F5" text-anchor="middle" letter-spacing="2">GOSPEL, PRAISE &amp; WORSHIP 24/7</text>

  <!-- Live Tag -->
  <g transform="translate(146, 430)">
    <rect width="220" height="38" rx="19" fill="#003318" stroke="url(#hodGold)" stroke-width="2"/>
    <text x="110" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" fill="#00E676" text-anchor="middle" letter-spacing="3">🇳🇬 GOSPEL LIVE</text>
  </g>
</svg>

