<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="allBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#1f283d"/>
      <stop offset="100%" stop-color="#0c0e17"/>
    </linearGradient>
    <linearGradient id="allGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ffa000"/>
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#allBg)"/>
  <circle cx="100" cy="84" r="58" fill="none" stroke="url(#allGold)" stroke-width="2.5"/>
  <!-- Dove &amp; Radiant Cross Motif -->
  <circle cx="100" cy="80" r="30" fill="url(#haloGlow)"/>
  <!-- Latin Cross -->
  <rect x="96" y="52" width="8" height="42" rx="2" fill="#ffffff"/>
  <rect x="85" y="62" width="30" height="8" rx="2" fill="#ffffff"/>
  <!-- Radiant Rays -->
  <g stroke="url(#allGold)" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="100" y1="46" x2="100" y2="38"/>
    <line x1="78" y1="56" x2="72" y2="50"/>
    <line x1="122" y1="56" x2="128" y2="50"/>
    <line x1="72" y1="74" x2="64" y2="74"/>
    <line x1="128" y1="74" x2="136" y2="74"/>
  </g>
  <!-- Soundwaves -->
  <path d="M 66 84 A 36 36 0 0 0 66 102" fill="none" stroke="url(#allGold)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 134 84 A 36 36 0 0 1 134 102" fill="none" stroke="url(#allGold)" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="118" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="2" text-anchor="middle">ALLÉLUIA FM</text>
  <text x="100" y="132" font-family="system-ui,-apple-system,sans-serif" font-size="10" font-weight="800" fill="url(#allGold)" letter-spacing="1.5" text-anchor="middle">96.5 FM • PORTO-NOVO</text>
  <!-- Banner -->
  <rect x="18" y="146" width="164" height="36" rx="10" fill="#10141f" stroke="url(#allGold)" stroke-width="1.5"/>
  <text x="100" y="163" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">ALLÉLUIA FM</text>
  <text x="100" y="176" font-family="system-ui,-apple-system,sans-serif" font-size="8.5" font-weight="700" fill="url(#allGold)" letter-spacing="1.2" text-anchor="middle">LA VOIX DE LA FOI • BÉNIN</text>
</svg>