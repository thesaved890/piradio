<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="rtciBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051a2e"/>
      <stop offset="50%" stop-color="#0a2c4d"/>
      <stop offset="100%" stop-color="#03101c"/>
    </linearGradient>
    <linearGradient id="rtciBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077B6"/>
      <stop offset="50%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#FFD100"/>
    </linearGradient>
    <filter id="rtciShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#rtciBg)" stroke="#00B4D8" stroke-width="3" filter="url(#rtciShadow)"/>

  <!-- Globe international et ondes RTCI -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#092542" stroke="#00B4D8" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="20" ry="10" fill="none" stroke="#FFD100" stroke-width="2"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#FFD100" stroke-width="1.8"/>
  </g>

  <!-- Titre RTCI -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="26" letter-spacing="3" text-anchor="middle" filter="url(#rtciShadow)">RTCI</text>

  <!-- Tag CHAÎNE INTERNATIONALE -->
  <rect x="30" y="116" width="140" height="26" rx="8" fill="url(#rtciBlue)"/>
  <text x="100" y="134" fill="#051A2E" font-family="'Inter', sans-serif" font-weight="900" font-size="11" letter-spacing="1" text-anchor="middle">CHAÎNE INTERNATIONALE</text>

  <!-- Pied TUNISIE -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#061c30" stroke="#00B4D8" stroke-width="1.2"/>
  <text x="100" y="171" fill="#00B4D8" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">RADIO TUNIS • 92.0 FM</text>
</svg>
