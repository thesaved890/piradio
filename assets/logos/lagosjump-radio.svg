  <!-- Typography -->
  <text x="256" y="285" font-family="'Impact', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">LAGOS JUMP</text>
  <text x="256" y="340" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="url(#neonOrange)" text-anchor="middle" letter-spacing="8">RADIO</text>
  <text x="256" y="388" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" fill="#FFCCBC" text-anchor="middle" letter-spacing="4">AFROBEATS • LAGOS VIBES</text>

