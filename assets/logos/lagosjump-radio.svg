<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="jumpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0A00"/>
      <stop offset="50%" stop-color="#3D1800"/>
      <stop offset="100%" stop-color="#120500"/>
    </linearGradient>
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAB00"/>
      <stop offset="50%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#DD2C00"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F3B43F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#jumpBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Headphones / Vinyl Center -->
  <g transform="translate(256, 160)">
    <circle cx="0" cy="0" r="65" fill="#1f0900" stroke="url(#neonOrange)" stroke-width="5"/>
    <circle cx="0" cy="0" r="45" fill="#000000"/>
    <circle cx="0" cy="0" r="20" fill="url(#neonOrange)"/>
    <!-- Headphone Band -->
    <path d="M -75 0 A 75 75 0 0 1 75 0" fill="none" stroke="url(#neonOrange)" stroke-width="8" stroke-linecap="round"/>
    <rect x="-85" y="-15" width="18" height="36" rx="8" fill="url(#gold)"/>
    <rect x="67" y="-15" width="18" height="36" rx="8" fill="url(#gold)"/>
