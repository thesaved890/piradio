<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="mfmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0f04"/>
      <stop offset="50%" stop-color="#3b1d08"/>
      <stop offset="100%" stop-color="#0f0702"/>
    </linearGradient>
    <linearGradient id="mfmOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F77F00"/>
      <stop offset="50%" stop-color="#FCBF49"/>
      <stop offset="100%" stop-color="#EAE2B7"/>
    </linearGradient>
    
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#mfmBg)" stroke="#F77F00" stroke-width="3"/>

  <!-- Sigle MFM dynamique -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#F77F00"/>
    <text x="0" y="8" fill="#1F0F04" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="1" text-anchor="middle">MFM</text>
  </g>

  <!-- Titre RADIO MFM -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="2" text-anchor="middle">RADIO MFM</text>

  <!-- Tag LA RADIO DU MAROC -->
  <rect x="36" y="116" width="128" height="26" rx="8" fill="url(#mfmOrange)"/>
  <text x="100" y="134" fill="#1F0F04" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.2" text-anchor="middle">PROXIMITÉ &amp; DÉBATS</text>

  <!-- Pied MAROC -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#1c0c03" stroke="#F77F00" stroke-width="1.2"/>
  <text x="100" y="171" fill="#FCBF49" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">MAROC FM • CASABLANCA</text>
</svg>