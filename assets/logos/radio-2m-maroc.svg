<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="r2mBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1a30"/>
      <stop offset="50%" stop-color="#162c54"/>
      <stop offset="100%" stop-color="#08101e"/>
    </linearGradient>
    <linearGradient id="r2mGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E5A93C"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <filter id="r2mShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#r2mBg)" stroke="url(#r2mGold)" stroke-width="3" filter="url(#r2mShadow)"/>

  <!-- Sigle 2M stylisé -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="24" fill="#E5A93C"/>
    <text x="-4" y="8" fill="#0E1A30" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="24" text-anchor="middle">2</text>
    <text x="10" y="8" fill="#0E1A30" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="18" text-anchor="middle">M</text>
  </g>

  <!-- Titre RADIO 2M -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="2.5" text-anchor="middle" filter="url(#r2mShadow)">RADIO 2M</text>

  <!-- Tag LA RADIO DU MAROC -->
  <rect x="36" y="116" width="128" height="26" rx="8" fill="#162c54" stroke="url(#r2mGold)" stroke-width="1.5"/>
  <text x="100" y="134" fill="#FFD100" font-family="'Inter', sans-serif" font-weight="900" font-size="11.5" letter-spacing="1.5" text-anchor="middle">INFO • CULTURE • LIVE</text>

  <!-- Cartouche Casablanca -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#0b1424" stroke="url(#r2mGold)" stroke-width="1.2"/>
  <text x="100" y="171" fill="#E5A93C" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">CASABLANCA • MAROC</text>
</svg>
