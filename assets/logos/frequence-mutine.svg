<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="mutYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeb3b"/>
      <stop offset="100%" stop-color="#fbc02d"/>
    </linearGradient>
    <filter id="mutDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#ffeb3b" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#mutBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#ffeb3b" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Logo M mutin stylisé -->
  <g filter="url(#mutDrop)" transform="translate(256, 175)">
    <circle cx="0" cy="0" r="76" fill="#181818" stroke="url(#mutYellow)" stroke-width="5"/>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">M</text>
  </g>

  <!-- Badge Fréquence 103.8 FM -->
  <g transform="translate(256, 285)">
    <rect x="-110" y="-18" width="220" height="38" rx="19" fill="url(#mutYellow)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#141414" text-anchor="middle" letter-spacing="1">103.8 FM</text>
  </g>

  <!-- Titre FRÉQUENCE MUTINE -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">FRÉQUENCE MUTINE</text>

  <!-- Slogan -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#fff59d" text-anchor="middle" letter-spacing="3">RADIO LIBRE DE BREST DEPUIS 1982</text>

  <!-- Ville / Pays -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffd54f" text-anchor="middle" letter-spacing="2">BREST • FINISTÈRE ⚓</text>
</svg>
