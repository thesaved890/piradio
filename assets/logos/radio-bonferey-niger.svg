  <path d="M 100 50 C 90 62, 86 72, 92 84 C 96 90, 104 90, 108 84 C 114 74, 106 64, 100 50 Z" fill="url(#bonfereyPurple)"/>

  <text x="100" y="130" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="18" letter-spacing="1.5" text-anchor="middle">BONFEREY</text>
  <text x="100" y="148" fill="url(#bonfereyGold)" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="2" text-anchor="middle">93.9 FM</text>

  <rect x="36" y="166" width="128" height="20" rx="6" fill="#060108" stroke="url(#bonfereyPurple)" stroke-width="1.2"/>
  <text x="100" y="180" fill="#F27121" font-family="'Inter', sans-serif" font-weight="700" font-size="9" letter-spacing="1.5" text-anchor="middle">NIAMEY • LE MEILLEUR DU NIGER</text>
