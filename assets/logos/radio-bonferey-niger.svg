      <stop offset="0%" stop-color="#14061a"/>
      <stop offset="50%" stop-color="#240c2e"/>
      <stop offset="100%" stop-color="#08020a"/>
    </linearGradient>
    <linearGradient id="bonfereyPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A2387"/>
      <stop offset="50%" stop-color="#E94057"/>
      <stop offset="100%" stop-color="#F27121"/>
    </linearGradient>
    <linearGradient id="bonfereyGold" x1="0%" y1="0%" x2="100%" y2="0%">
