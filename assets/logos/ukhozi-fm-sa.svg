<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgUkhozi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d12"/>
      <stop offset="50%" stop-color="#0e3a1f"/>
      <stop offset="100%" stop-color="#06160d"/>
    </linearGradient>
    <linearGradient id="goldUkhozi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <linearGradient id="greenUkhozi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26A69A"/>
      <stop offset="100%" stop-color="#00695C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgUkhozi)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#goldUkhozi)" stroke-width="2.5" opacity="0.85"/>

  <!-- Logo Aigle Ukhozi (Ukhozi signifie Aigle en zoulou) & Bouclier zoulou -->
  <g transform="translate(100, 70)">
    <circle cx="0" cy="0" r="38" fill="#082915" stroke="url(#goldUkhozi)" stroke-width="2.5"/>
    <!-- Bouclier zoulou traditionnel & lance stylisée -->
    <ellipse cx="0" cy="0" rx="14" ry="26" fill="url(#goldUkhozi)"/>
    <ellipse cx="0" cy="0" rx="9" ry="20" fill="#061F10"/>
    <!-- Ailes d'aigle ouvertes -->
    <path d="M -30,-8 Q -14,-22 0,-10 Q 14,-22 30,-8 Q 18,6 0,0 Q -18,6 -30,-8 Z" fill="#FFFFFF"/>
  </g>

  <!-- Titre UKHOZI FM -->
  <text x="100" y="128" font-family="'Arial Black', Impact, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">UKHOZI FM</text>
  <text x="100" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="url(#goldUkhozi)" text-anchor="middle" letter-spacing="2">LUHAMBA PHAMBILI</text>

  <!-- Cartouche #1 Radio in Africa -->
  <rect x="25" y="158" width="150" height="26" rx="8" fill="#00695C" stroke="url(#goldUkhozi)" stroke-width="1"/>
  <text x="100" y="175" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">🇿🇦 SABC • #1 IN AFRICA</text>
</svg>