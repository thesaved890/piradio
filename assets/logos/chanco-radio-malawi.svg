<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="chBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="50%" stop-color="#222d3d"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="chGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#chBg)"/>
  <circle cx="100" cy="84" r="58" fill="none" stroke="url(#chGold)" stroke-width="2"/>
  <!-- Graduation Cap &amp; Radio Tower (Chancellor College) -->
  <polygon points="100,56 128,68 100,80 72,68" fill="url(#chGold)"/>
  <rect x="86" y="80" width="28" height="12" rx="3" fill="#ffffff"/>
  <!-- Radio Waves -->
  <path d="M 64 80 A 38 38 0 0 0 64 100" fill="none" stroke="#ffd54f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 136 80 A 38 38 0 0 1 136 100" fill="none" stroke="#ffd54f" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="116" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="900" fill="#ffffff" letter-spacing="2" text-anchor="middle">CHANCO</text>
  <text x="100" y="130" font-family="system-ui,-apple-system,sans-serif" font-size="9" font-weight="700" fill="#ffd54f" letter-spacing="1" text-anchor="middle">UNIVERSITY OF MALAWI</text>
  <!-- Banner -->
  <rect x="18" y="146" width="164" height="36" rx="10" fill="#0f141c" stroke="url(#chGold)" stroke-width="1.5"/>
  <text x="100" y="163" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">CHANCO COMMUNITY</text>
  <text x="100" y="176" font-family="system-ui,-apple-system,sans-serif" font-size="8.5" font-weight="700" fill="#ffd54f" letter-spacing="1.2" text-anchor="middle">ZOMBA CAMPUS • MALAWI</text>
</svg>