<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="rcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#032616"/>
      <stop offset="50%" stop-color="#083e25"/>
      <stop offset="100%" stop-color="#021c10"/>
    </linearGradient>
    <linearGradient id="rcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a3"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#rcBg)"/>
  <circle cx="100" cy="85" r="58" fill="none" stroke="url(#rcGold)" stroke-width="2" stroke-dasharray="6 3"/>
  <!-- Holy Quran Book Icon -->
  <g fill="none" stroke="url(#rcGold)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 100 86 Q 80 72 62 76 L 62 106 Q 80 102 100 114 Q 120 102 138 106 L 138 76 Q 120 72 100 86 Z" fill="#042e1b"/>
    <line x1="100" y1="86" x2="100" y2="114" stroke-width="2"/>
  </g>
  <!-- Radiating Rays / Minaret Crescent above -->
  <circle cx="100" cy="56" r="3" fill="url(#rcGold)"/>
  <path d="M 94 56 A 6 6 0 0 1 106 56" fill="none" stroke="url(#rcGold)" stroke-width="2"/>
  <!-- Arabic Text -->
  <text x="100" y="132" font-family="'Amiri', 'Traditional Arabic', serif, system-ui" font-size="15" font-weight="bold" fill="url(#rcGold)" text-anchor="middle">إذاعة القرآن الكريم</text>
  <!-- Banner -->
  <rect x="20" y="148" width="160" height="34" rx="10" fill="#021c10" stroke="url(#rcGold)" stroke-width="1.5"/>
  <text x="100" y="165" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">RADIO CORAN</text>
  <text x="100" y="177" font-family="system-ui,-apple-system,sans-serif" font-size="8.5" font-weight="700" fill="url(#rcGold)" letter-spacing="1.2" text-anchor="middle">MAURITANIE • 98.0 FM</text>
</svg>