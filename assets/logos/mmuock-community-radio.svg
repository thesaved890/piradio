<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00240F"/>
      <stop offset="50%" stop-color="#004D21"/>
      <stop offset="100%" stop-color="#001408"/>
    </linearGradient>
    <linearGradient id="mmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F3B43F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#mmBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.85"/>

  <!-- Mountain / Community Heritage Motif -->
  <g transform="translate(256, 150)">
    <circle cx="0" cy="0" r="65" fill="#001C0B" stroke="url(#mmGold)" stroke-width="4"/>
    <text x="0" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="url(#gold)" text-anchor="middle">🏔️</text>
  </g>

  <!-- Big Typography -->
  <text x="256" y="265" font-family="'Impact', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">MMUOCK</text>
  <text x="256" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="url(#mmGold)" text-anchor="middle" letter-spacing="6">COMMUNITY RADIO</text>

  <!-- Slogan & Country -->
  <text x="256" y="370" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#C8E6C9" text-anchor="middle" letter-spacing="3">SOUTHWEST REGION</text>
  <text x="256" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#E8F5E9" text-anchor="middle" letter-spacing="2">GRASSROOTS VOICE OF CAMEROON</text>

  <!-- Live Tag -->
  <g transform="translate(146, 430)">
    <rect width="220" height="38" rx="19" fill="#003318" stroke="url(#gold)" stroke-width="2"/>
    <text x="110" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" fill="#00E676" text-anchor="middle" letter-spacing="3">🇨🇲 COMMUNITY LIVE</text>
  </g>
</svg>

