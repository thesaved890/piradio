<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="mariaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05192d"/>
      <stop offset="50%" stop-color="#0b2947"/>
      <stop offset="100%" stop-color="#020e1a"/>
    </linearGradient>
    <linearGradient id="mariaBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <linearGradient id="mariaGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE000"/>
      <stop offset="100%" stop-color="#799F0C"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#mariaBg)"/>
  <rect width="194" height="194" x="3" y="3" rx="33" fill="none" stroke="url(#mariaBlue)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Marian Monogram / Dove / Cross -->
  <circle cx="100" cy="74" r="38" fill="#041220" stroke="url(#mariaGold)" stroke-width="2"/>
  <path d="M 86 86 L 94 60 L 100 76 L 106 60 L 114 86 Z" fill="url(#mariaBlue)"/>
  <circle cx="100" cy="54" r="4" fill="#FFFFFF"/>

  <text x="100" y="130" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="18" letter-spacing="1.5" text-anchor="middle">RADIO MARIA</text>
  <text x="100" y="148" fill="url(#mariaBlue)" font-family="'Inter', sans-serif" font-weight="800" font-size="12" letter-spacing="2" text-anchor="middle">BURKINA FASO</text>

  <rect x="36" y="166" width="128" height="20" rx="6" fill="#020810" stroke="url(#mariaBlue)" stroke-width="1.2"/>
  <text x="100" y="180" fill="#00D2FF" font-family="'Inter', sans-serif" font-weight="700" font-size="8.5" letter-spacing="1" text-anchor="middle">UNE VOIX CHRÉTIENNE</text>
</svg>
