<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgHot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190606"/>
      <stop offset="50%" stop-color="#380909"/>
      <stop offset="100%" stop-color="#120404"/>
    </linearGradient>
    <linearGradient id="fireHot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3D00"/>
      <stop offset="50%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgHot)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#fireHot)" stroke-width="2.5" opacity="0.85"/>

  <!-- Logo Flamme & HOT 102.7 -->
  <g transform="translate(100, 68)">
    <circle cx="0" cy="0" r="38" fill="#240707" stroke="url(#fireHot)" stroke-width="2"/>
    <!-- Flamme stylisée -->
    <path d="M 0,-24 C 8,-12 16,-4 12,12 C 8,24 -8,24 -12,12 C -16,-2 0,-14 0,-24 Z" fill="url(#fireHot)"/>
    <text x="0" y="16" font-family="'Arial Black', Impact, sans-serif" font-size="13" font-weight="900" fill="#FFFFFF" text-anchor="middle">102.7</text>
  </g>

  <!-- Titre HOT FM -->
  <text x="100" y="128" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="url(#fireHot)" text-anchor="middle" letter-spacing="3">HOT 102.7</text>
  <text x="100" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">JOBURG'S BEST OLD SKOOL</text>

  <!-- Cartouche Classic Hits -->
  <rect x="20" y="158" width="160" height="26" rx="8" fill="#DD2C00"/>
  <text x="100" y="175" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CLASSIC HITS • GAUTENG</text>
</svg>