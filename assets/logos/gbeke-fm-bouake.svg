<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051912"/>
      <stop offset="50%" stop-color="#0b2e21"/>
      <stop offset="100%" stop-color="#02100b"/>
    </linearGradient>
    <linearGradient id="gbGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="50%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#007E33"/>
    </linearGradient>
    <linearGradient id="gbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#gbBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gbGreen)" stroke-width="3" stroke-opacity="0.8"/>

  <g transform="translate(256, 185)">
    <circle cx="0" cy="0" r="62" fill="url(#gbGreen)"/>
    <circle cx="0" cy="0" r="54" fill="#051912"/>
    <text x="0" y="16" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="url(#gbGold)" text-anchor="middle">GFM</text>
  </g>

  <!-- Badge Bouaké Gbêkê -->
  <g transform="translate(256, 285)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="url(#gbGold)"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#051912" text-anchor="middle" letter-spacing="2">RADIO LIVE • BOUAKÉ</text>
  </g>

  <!-- Titre Principal GBÊKÊ FM -->
  <text x="256" y="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">GBÊKÊ FM BOUAKÉ</text>

  <!-- Sous-titre Centre Côte d'Ivoire -->
  <text x="256" y="395" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="url(#gbGreen)" text-anchor="middle" letter-spacing="3">RÉGION DU GBÊKÊ • BOUAKÉ</text>

  <!-- Drapeau ivoirien miniature en bas -->
  <g transform="translate(256, 430)">
    <rect x="-18" y="-7" width="12" height="14" fill="#FF8200" rx="2"/>
    <rect x="-6" y="-7" width="12" height="14" fill="#FFFFFF"/>
    <rect x="6" y="-7" width="12" height="14" fill="#009A44" rx="2"/>
    <rect x="-18" y="-7" width="36" height="14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" rx="2"/>
  </g>
</svg>