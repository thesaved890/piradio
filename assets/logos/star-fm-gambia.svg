<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="starGmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c0709"/>
      <stop offset="50%" stop-color="#360f14"/>
      <stop offset="100%" stop-color="#120305"/>
    </linearGradient>
    <linearGradient id="starGmRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <linearGradient id="starGmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#starGmBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#ff1744" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Étoile centrale brillante -->
  <g transform="translate(256, 180)">
    <circle cx="0" cy="0" r="76" fill="#1b0507" stroke="url(#starGmRed)" stroke-width="5"/>
    <!-- Étoile à 5 branches dorée -->
    <polygon points="0,-45 13,-12 45,-12 18,8 28,40 0,20 -28,40 -18,8 -45,-12 -13,-12" fill="url(#starGmGold)"/>
  </g>

  <!-- Badge Fréquence 96.6 FM -->
  <g transform="translate(256, 288)">
    <rect x="-110" y="-18" width="220" height="38" rx="19" fill="url(#starGmGold)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#1c0709" text-anchor="middle" letter-spacing="1">96.6 FM</text>
  </g>

  <!-- Titre STAR FM -->
  <text x="256" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">STAR FM 96.6</text>

  <!-- Slogan The Voice of Truth -->
  <text x="256" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ff8a80" text-anchor="middle" letter-spacing="3">THE VOICE OF TRUTH</text>

  <!-- Ville / Pays -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="2">BANJUL • THE GAMBIA 🇬🇲</text>
</svg>