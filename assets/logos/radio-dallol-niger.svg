<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="dallolBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1006"/>
      <stop offset="50%" stop-color="#2d1a0a"/>
      <stop offset="100%" stop-color="#0e0802"/>
    </linearGradient>
    <linearGradient id="dallolAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
    <linearGradient id="dallolGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ECC71"/>
      <stop offset="100%" stop-color="#27AE60"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#dallolBg)"/>
  <rect width="194" height="194" x="3" y="3" rx="33" fill="none" stroke="url(#dallolAmber)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Valley / Oasis (Dallol Bosso &amp; Maouri) -->
  <circle cx="100" cy="74" r="38" fill="#100903" stroke="url(#dallolGreen)" stroke-width="2"/>
  <path d="M 74 86 Q 100 68, 126 86 Z" fill="url(#dallolAmber)"/>
  <circle cx="100" cy="62" r="10" fill="#FFCC00"/>

  <text x="100" y="130" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="20" letter-spacing="1.5" text-anchor="middle">RADIO DALLOL</text>
  <text x="100" y="148" fill="url(#dallolAmber)" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="2" text-anchor="middle">92.8 FM</text>

  <rect x="36" y="166" width="128" height="20" rx="6" fill="#090501" stroke="url(#dallolGreen)" stroke-width="1.2"/>
  <text x="100" y="180" fill="#2ECC71" font-family="'Inter', sans-serif" font-weight="700" font-size="9" letter-spacing="1.5" text-anchor="middle">BALEYARA • DOGONDOUTCHI</text>
</svg>

