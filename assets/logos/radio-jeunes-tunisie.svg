<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="jnsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041a14"/>
      <stop offset="50%" stop-color="#073026"/>
      <stop offset="100%" stop-color="#020e0b"/>
    </linearGradient>
    <linearGradient id="jnsLime" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38B000"/>
      <stop offset="50%" stop-color="#70E000"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <filter id="jnsShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#jnsBg)" stroke="#70E000" stroke-width="3" filter="url(#jnsShadow)"/>

  <!-- Égaliseur pop / jeunesse -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#082b21" stroke="#70E000" stroke-width="2"/>
    <rect x="-12" y="-6" width="4" height="12" rx="2" fill="#00B4D8"/>
    <rect x="-4" y="-12" width="4" height="24" rx="2" fill="#70E000"/>
    <rect x="4" y="-16" width="4" height="32" rx="2" fill="#38B000"/>
    <rect x="12" y="-8" width="4" height="16" rx="2" fill="#00B4D8"/>
  </g>

  <!-- Titre RADIO JEUNES -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="21" letter-spacing="1.5" text-anchor="middle" filter="url(#jnsShadow)">RADIO JEUNES</text>

  <!-- Tag إذاعة الشباب -->
  <rect x="36" y="116" width="128" height="26" rx="8" fill="url(#jnsLime)"/>
  <text x="100" y="134" fill="#041A14" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.2" text-anchor="middle">HITS &amp; JEUNESSE</text>

  <!-- Pied TUNISIE -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#061e17" stroke="#70E000" stroke-width="1.2"/>
  <text x="100" y="171" fill="#70E000" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">إذاعة الشباب • TUNISIE</text>
</svg>
