<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pvrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="50%" stop-color="#283593"/>
      <stop offset="100%" stop-color="#0D133D"/>
    </linearGradient>
    <linearGradient id="pvrGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F3B43F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#pvrBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#pvrGold)" stroke-width="4" stroke-opacity="0.85"/>

  <!-- Cross / Bible Motif -->
  <g transform="translate(256, 160)">
    <circle cx="0" cy="0" r="65" fill="#141C61" stroke="url(#pvrGold)" stroke-width="4"/>
    <text x="0" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="url(#pvrGold)" text-anchor="middle">✝️</text>
  </g>

  <!-- Big Typography -->
  <text x="256" y="275" font-family="'Impact', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">PROTESTANT VOICE</text>
  <text x="256" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="url(#pvrGold)" text-anchor="middle" letter-spacing="8">RADIO</text>

  <!-- Slogan & Country -->
  <text x="256" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#C5CAE9" text-anchor="middle" letter-spacing="3">COMMUNION DES ÉGLISES</text>
  <text x="256" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#E8EAF6" text-anchor="middle" letter-spacing="2">YAOUNDÉ • CAMEROUN</text>

  <!-- Live Tag -->
  <g transform="translate(146, 430)">
    <rect width="220" height="38" rx="19" fill="#003318" stroke="url(#pvrGold)" stroke-width="2"/>
    <text x="110" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" fill="#00E676" text-anchor="middle" letter-spacing="3">🇨🇲 GOSPEL LIVE</text>
  </g>
</svg>
