<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="eastBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140628"/>
      <stop offset="50%" stop-color="#311059"/>
      <stop offset="100%" stop-color="#0d041a"/>
    </linearGradient>
    <linearGradient id="eastSun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F3B43F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#eastBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Rising Sun Motif of the East -->
  <g transform="translate(256, 170)">
    <circle cx="0" cy="0" r="55" fill="url(#eastSun)"/>
    <path d="M 0 -85 L 0 -65" stroke="url(#eastSun)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 60 -60 L 46 -46" stroke="url(#eastSun)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 85 0 L 65 0" stroke="url(#eastSun)" stroke-width="5" stroke-linecap="round"/>
    <path d="M -60 -60 L -46 -46" stroke="url(#eastSun)" stroke-width="5" stroke-linecap="round"/>
    <path d="M -85 0 L -65 0" stroke="url(#eastSun)" stroke-width="5" stroke-linecap="round"/>
    <text x="0" y="14" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="40" fill="#FFFFFF" text-anchor="middle">📻</text>
  </g>

  <!-- Typography -->
  <text x="256" y="295" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">RADIO EAST</text>
  <text x="256" y="345" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="url(#gold)" text-anchor="middle" letter-spacing="8">NIGERIA</text>
  <text x="256" y="388" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" fill="#E1BEE7" text-anchor="middle" letter-spacing="3">VOICE OF EASTERN NIGERIA</text>

  <!-- Live Tag -->
  <g transform="translate(146, 422)">
    <rect width="220" height="40" rx="20" fill="#003318" stroke="url(#gold)" stroke-width="2"/>
    <text x="110" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#00E676" text-anchor="middle" letter-spacing="3">🇳🇬 HIGH-DEF STEREO</text>
  </g>
