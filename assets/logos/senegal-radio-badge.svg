<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="snBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003318"/>
      <stop offset="50%" stop-color="#005C2B"/>
      <stop offset="100%" stop-color="#00210E"/>
    </linearGradient>
    <linearGradient id="snGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="50%" stop-color="#FDD835"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <linearGradient id="snGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00853F"/>
      <stop offset="100%" stop-color="#00632E"/>
    </linearGradient>
    <linearGradient id="snYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDEF42"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>
    <linearGradient id="snRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E31B23"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="512" height="512" rx="96" fill="url(#snBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#snGold)" stroke-width="4" stroke-opacity="0.85"/>

  <!-- Senegalese Flag Tricolor Banner (Green, Yellow with Green Star, Red) -->
  <g transform="translate(141, 50)">
    <rect x="0" y="0" width="74" height="42" rx="6" fill="url(#snGreen)"/>
    <rect x="76" y="0" width="78" height="42" fill="url(#snYellow)"/>
    <rect x="156" y="0" width="74" height="42" rx="6" fill="url(#snRed)"/>
    <!-- Green Star of Senegal on Yellow stripe -->
    <text x="115" y="27" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="20" fill="#00853F" text-anchor="middle">★</text>
    <rect x="0" y="0" width="230" height="42" rx="6" fill="none" stroke="url(#snGold)" stroke-width="2"/>
  </g>

  <!-- Concentric Radio Waves -->
  <g fill="none" stroke="url(#snGold)" stroke-linecap="round" opacity="0.35">
    <circle cx="256" cy="235" r="90" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="256" cy="235" r="125" stroke-width="2.5" stroke-dasharray="10 8"/>
    <circle cx="256" cy="235" r="160" stroke-width="2" stroke-dasharray="14 10"/>
  </g>

  <!-- Central Glowing Disc -->
  <circle cx="256" cy="235" r="70" fill="#00210E" stroke="url(#snGold)" stroke-width="4" filter="url(#glow)"/>

  <!-- Radio Tower &amp; Green Star with Pi Symbol -->
  <path d="M 230 275 L 256 195 L 282 275" fill="none" stroke="url(#snGold)" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 238 250 L 274 250" fill="none" stroke="url(#snGold)" stroke-width="3"/>
  <path d="M 244 230 L 268 230" fill="none" stroke="url(#snGold)" stroke-width="3"/>
  <text x="256" y="196" font-family="'Segoe UI', sans-serif" font-weight="900" font-size="26" fill="#00E676" text-anchor="middle">★</text>
  <text x="256" y="244" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle">π</text>

  <!-- Broadcast Signal Arcs left &amp; right -->
  <path d="M 205 215 A 32 32 0 0 0 205 255" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M 190 205 A 46 46 0 0 0 190 265" fill="none" stroke="url(#snGold)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 307 215 A 32 32 0 0 1 307 255" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M 322 205 A 46 46 0 0 1 322 265" fill="none" stroke="url(#snGold)" stroke-width="3" stroke-linecap="round"/>

  <!-- Typography -->
  <text x="256" y="360" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">SÉNÉGAL</text>
  <text x="256" y="398" font-family="'Segoe UI', Roboto, -apple-system, sans-serif" font-weight="800" font-size="20" fill="url(#snGold)" text-anchor="middle" letter-spacing="6">RADIO PIONEER</text>

  <!-- Bottom Tag Badge -->
  <g transform="translate(116, 428)">
    <rect width="280" height="42" rx="21" fill="#00180B" stroke="url(#snGold)" stroke-width="2"/>
    <circle cx="28" cy="21" r="6" fill="#00E676"/>
    <text x="150" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">100% LIVE • VERIFIED</text>
  </g>
</svg>
