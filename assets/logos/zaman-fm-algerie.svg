<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgZaman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241708"/>
      <stop offset="50%" stop-color="#42290d"/>
      <stop offset="100%" stop-color="#190f05"/>
    </linearGradient>
    <linearGradient id="goldZaman" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997A15"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgZaman)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#goldZaman)" stroke-width="2" opacity="0.85"/>

  <!-- Disque vinyle rétro Zaman -->
  <g transform="translate(100, 78)">
    <circle cx="0" cy="0" r="42" fill="#140c03" stroke="url(#goldZaman)" stroke-width="2.5"/>
    <!-- Sillons de vinyle -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="rgba(255,243,176,0.18)" stroke-width="1"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="rgba(255,243,176,0.15)" stroke-width="1"/>
    <circle cx="0" cy="0" r="21" fill="none" stroke="rgba(255,243,176,0.2)" stroke-width="1"/>
    <!-- Centre du vinyle -->
    <circle cx="0" cy="0" r="14" fill="#006233" stroke="url(#goldZaman)" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Titre Zaman FM -->
  <text x="100" y="134" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ZAMAN FM</text>
  <text x="100" y="152" font-family="'Amiri', 'Traditional Arabic', serif" font-size="18" font-weight="bold" fill="url(#goldZaman)" text-anchor="middle">إذاعة زمان</text>

  <!-- Cartouche inférieur -->
  <rect x="25" y="162" width="150" height="25" rx="8" fill="url(#goldZaman)"/>
  <text x="100" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="900" fill="#241708" text-anchor="middle" letter-spacing="1">PATRIMOINE & NOSTALGIE</text>
</svg>
