<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgSetif" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b1e"/>
      <stop offset="50%" stop-color="#14363d"/>
      <stop offset="100%" stop-color="#081316"/>
    </linearGradient>
    <linearGradient id="tealSetif" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80CBC4"/>
      <stop offset="50%" stop-color="#26A69A"/>
      <stop offset="100%" stop-color="#00695C"/>
    </linearGradient>
    <linearGradient id="goldSetif" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgSetif)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#tealSetif)" stroke-width="2" opacity="0.85"/>

  <!-- En-tête Radio Algérie -->
  <text x="100" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="url(#goldSetif)" text-anchor="middle" letter-spacing="2">RADIO ALGÉRIE</text>

  <!-- Fontaine d'Aïn Fouara & Hauts-Plateaux stylisé -->
  <g transform="translate(100, 74)">
    <circle cx="0" cy="0" r="40" fill="#082126" stroke="url(#tealSetif)" stroke-width="2.5"/>
    <!-- Vasque fontaine d'Aïn Fouara stylisée -->
    <path d="M -22,12 Q 0,24 22,12 L 18,2 Q 0,10 -18,2 Z" fill="none" stroke="url(#goldSetif)" stroke-width="2"/>
    <!-- Jets d'eau jaillissants -->
    <path d="M 0,2 Q -10,-14 -16,-6 M 0,2 Q 10,-14 16,-6 M 0,2 L 0,-18" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
    <circle cx="0" cy="-18" r="2.5" fill="#80CBC4"/>
  </g>

  <!-- Titre Sétif -->
  <text x="100" y="132" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">SÉTIF</text>
  <text x="100" y="150" font-family="'Amiri', 'Traditional Arabic', serif" font-size="17" font-weight="bold" fill="url(#tealSetif)" text-anchor="middle">إذاعة سطيف • الهضاب</text>

  <!-- Cartouche inférieur -->
  <rect x="25" y="162" width="150" height="25" rx="8" fill="url(#tealSetif)"/>
  <text x="100" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="900" fill="#081B1E" text-anchor="middle" letter-spacing="1">HAUTS-PLATEAUX • AÏN FOUARA</text>
</svg>