<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="diaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001F3F"/>
      <stop offset="50%" stop-color="#004080"/>
      <stop offset="100%" stop-color="#001428"/>
    </linearGradient>
    <linearGradient id="diaCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80D8FF"/>
      <stop offset="50%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F3B43F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#diaBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.85"/>

  <!-- Frequency Pill -->
  <g transform="translate(156, 65)">
    <rect width="200" height="46" rx="23" fill="url(#diaCyan)"/>
    <text x="100" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" fill="#001F3F" text-anchor="middle" letter-spacing="2">101.1 FM</text>
  </g>

  <!-- Diamond Polygon Icon -->
  <g transform="translate(256, 160)">
    <polygon points="0,-45 45,0 0,45 -45,0" fill="url(#diaCyan)" stroke="#FFFFFF" stroke-width="4"/>
    <text x="0" y="16" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#001F3F" text-anchor="middle">💎</text>
  </g>

  <!-- Big DIAMOND FM Typography -->
  <text x="256" y="260" font-family="'Impact', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="78" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">DIAMOND FM</text>
  <text x="256" y="315" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" fill="url(#diaCyan)" text-anchor="middle" letter-spacing="8">IBADAN</text>

  <!-- Slogan -->
  <text x="256" y="365" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#B3E5FC" text-anchor="middle" letter-spacing="3">UNIVERSITY OF IBADAN</text>
  <text x="256" y="398" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#E1F5FE" text-anchor="middle" letter-spacing="2">COMMUNITY &amp; EDUCATIONAL RADIO</text>

  <!-- Live Tag -->
  <g transform="translate(146, 426)">
    <rect width="220" height="40" rx="20" fill="#003318" stroke="url(#gold)" stroke-width="2"/>
    <text x="110" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#00E676" text-anchor="middle" letter-spacing="3">🇳🇬 IBADAN LIVE</text>
  </g>
</svg>

