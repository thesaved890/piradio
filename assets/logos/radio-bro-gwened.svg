<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rbgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051f11"/>
      <stop offset="50%" stop-color="#0b381f"/>
      <stop offset="100%" stop-color="#03140a"/>
    </linearGradient>
    <linearGradient id="rbgGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00897b"/>
    </linearGradient>
    <linearGradient id="rbgGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="rbgDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00e676" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#rbgBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#00e676" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Logo RBG stylisé -->
  <g filter="url(#rbgDrop)" transform="translate(256, 175)">
    <circle cx="0" cy="0" r="76" fill="#072b17" stroke="url(#rbgGold)" stroke-width="5"/>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#rbgGreen)" text-anchor="middle" letter-spacing="2">RBG</text>
  </g>

  <!-- Badge Fréquence 101.7 FM -->
  <g transform="translate(256, 285)">
    <rect x="-110" y="-18" width="220" height="38" rx="19" fill="url(#rbgGold)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#051f11" text-anchor="middle" letter-spacing="1">101.7 FM</text>
  </g>

  <!-- Titre RADIO BRO GWENED -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">RADIO BRO GWENED</text>

  <!-- Slogan -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#a7f3d0" text-anchor="middle" letter-spacing="3">BREZHONEG HA GALLEG • MORBIHAN</text>

  <!-- Ville / Pays -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffd54f" text-anchor="middle" letter-spacing="2">PONTIVY • BRETAGNE</text>
</svg>
