<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ahBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051419"/>
      <stop offset="50%" stop-color="#0b2933"/>
      <stop offset="100%" stop-color="#020a0d"/>
    </linearGradient>
    <linearGradient id="ahCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80D8FF"/>
      <stop offset="50%" stop-color="#00B0FF"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
    <linearGradient id="ahGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <filter id="ahDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#ahBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ahCyan)" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Logo AHOTOR FM -->
  <g filter="url(#ahDrop)" transform="translate(256, 185)">
    <rect x="-95" y="-50" width="190" height="100" rx="20" fill="url(#ahCyan)"/>
    <text x="0" y="20" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">AHOTOR</text>
  </g>

  <!-- Badge 92.3 FM Accra -->
  <g transform="translate(256, 285)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="url(#ahGold)" filter="url(#ahDrop)"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#051419" text-anchor="middle" letter-spacing="2">92.3 FM • ACCRA</text>
  </g>

  <!-- Titre Principal AHOTOR FM -->
  <text x="256" y="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">AHOTOR 92.3 FM</text>

  <!-- Sous-titre Comfort & Voice of the People -->
  <text x="256" y="395" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="url(#ahCyan)" text-anchor="middle" letter-spacing="3">VOICE OF THE PEOPLE</text>

  <!-- Drapeau ghanéen miniature en bas -->
  <g transform="translate(256, 430)">
    <rect x="-18" y="-7" width="36" height="5" fill="#CE1126" rx="1"/>
    <rect x="-18" y="-2" width="36" height="5" fill="#FCD116"/>
    <polygon points="0,-2 1.5,0.5 4,0.5 2,2 2.5,4.5 0,3 -2.5,4.5 -2,2 -4,0.5 -1.5,0.5" fill="#000000"/>
    <rect x="-18" y="3" width="36" height="5" fill="#006B3F" rx="1"/>
    <rect x="-18" y="-7" width="36" height="15" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" rx="2"/>
  </g>
</svg>