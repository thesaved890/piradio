<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="hhsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14041a"/>
      <stop offset="50%" stop-color="#260833"/>
      <stop offset="100%" stop-color="#0a020d"/>
    </linearGradient>
    <linearGradient id="hhsNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="50%" stop-color="#7209B7"/>
      <stop offset="100%" stop-color="#4CC9F0"/>
    </linearGradient>
    <filter id="hhsShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#hhsBg)" stroke="url(#hhsNeon)" stroke-width="3" filter="url(#hhsShadow)"/>

  <!-- Casque audio / beats -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#240730" stroke="#FF007F" stroke-width="2"/>
    <path d="M -14 4 A 14 14 0 0 1 14 4" fill="none" stroke="#4CC9F0" stroke-width="3" stroke-linecap="round"/>
    <rect x="-16" y="2" width="6" height="10" rx="3" fill="#FF007F"/>
    <rect x="10" y="2" width="6" height="10" rx="3" fill="#FF007F"/>
  </g>

  <!-- Titre HIP HOP SOUL -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="1.5" text-anchor="middle" filter="url(#hhsShadow)">HIP HOP SOUL</text>

  <!-- Tag RAP & SOUL MAROC -->
  <rect x="36" y="116" width="128" height="26" rx="8" fill="url(#hhsNeon)"/>
  <text x="100" y="134" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.2" text-anchor="middle">URBAN &amp; BEATS</text>

  <!-- Pied MAROC -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#17041f" stroke="#4CC9F0" stroke-width="1.2"/>
  <text x="100" y="171" fill="#4CC9F0" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">MAROC URBAN MUSIC</text>
</svg>
