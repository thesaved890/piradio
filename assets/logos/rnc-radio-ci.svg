<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rncBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d0a21"/>
      <stop offset="50%" stop-color="#380d3f"/>
      <stop offset="100%" stop-color="#120415"/>
    </linearGradient>
    <linearGradient id="rncGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="rncPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ab47bc"/>
      <stop offset="100%" stop-color="#7b1fa2"/>
    </linearGradient>
    <filter id="rncGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#ffd54f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#rncBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#ba68c8" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Croix dorée stylisée -->
  <g filter="url(#rncGlow)">
    <circle cx="256" cy="180" r="75" fill="#24072b" stroke="url(#rncGold)" stroke-width="5"/>
    <!-- Croix latine dorée -->
    <rect x="249" y="130" width="14" height="100" rx="4" fill="url(#rncGold)"/>
    <rect x="220" y="155" width="72" height="14" rx="4" fill="url(#rncGold)"/>
    <!-- Rayons de lumière -->
    <circle cx="256" cy="162" r="32" fill="none" stroke="#fff59d" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Titre RNC -->
  <text x="256" y="295" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" text-anchor="middle" letter-spacing="4">RNC</text>
  <text x="256" y="325" fill="#e1bee7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="3">LA VOIX DE L'ÉVANGILE</text>

  <!-- Badge Fréquence 102.5 FM -->
  <rect x="156" y="350" width="200" height="46" rx="23" fill="url(#rncGold)"/>
  <text x="256" y="381" fill="#1d0a21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" text-anchor="middle" letter-spacing="1">102.5 FM</text>

  <!-- Ville / Pays -->
  <text x="256" y="435" fill="#ce93d8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" text-anchor="middle" letter-spacing="2">CÔTE D'IVOIRE</text>
</svg>

