<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="atlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="50%" stop-color="#0f2647"/>
      <stop offset="100%" stop-color="#040b14"/>
    </linearGradient>
    <linearGradient id="atlGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <filter id="atlShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#atlBg)" stroke="url(#atlGold)" stroke-width="3" filter="url(#atlShadow)"/>

  <!-- Rose des vents / ondes atlantiques -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#0d2342" stroke="url(#atlGold)" stroke-width="2"/>
    <polygon points="0,-16 4,-4 16,0 4,4 0,16 -4,4 -16,0 -4,-4" fill="url(#atlGold)"/>
    <circle cx="0" cy="0" r="3" fill="#081426"/>
  </g>

  <!-- Titre ATLANTIC -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="2" text-anchor="middle" filter="url(#atlShadow)">ATLANTIC</text>

  <!-- Tag ÉCONOMIE &amp; CULTURE -->
  <rect x="36" y="116" width="128" height="26" rx="8" fill="url(#atlGold)"/>
  <text x="100" y="134" fill="#081426" font-family="'Inter', sans-serif" font-weight="900" font-size="11.5" letter-spacing="1.2" text-anchor="middle">RADIO D'INFLUENCE</text>

  <!-- Pied MAROC -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#071221" stroke="url(#atlGold)" stroke-width="1.2"/>
  <text x="100" y="171" fill="#F3E5AB" font-family="'Inter', sans-serif" font-weight="800" font-size="10.5" letter-spacing="1.8" text-anchor="middle">ÉCONOMIE • CASABLANCA</text>
</svg>
