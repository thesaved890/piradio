<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="phxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0707"/>
      <stop offset="50%" stop-color="#3d0d0d"/>
      <stop offset="100%" stop-color="#140303"/>
    </linearGradient>
    <linearGradient id="phxFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d32f2f"/>
      <stop offset="50%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#ffeb3b"/>
    </linearGradient>
    <linearGradient id="phxGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    <filter id="phxDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#ff5722" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#phxBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#ff5722" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Phoenix flamboyant stylisé -->
  <g filter="url(#phxDrop)" transform="translate(256, 175)">
    <circle cx="0" cy="0" r="76" fill="#240707" stroke="url(#phxFlame)" stroke-width="5"/>
    <!-- Ailes et flammes de l'oiseau Phénix -->
    <path d="M 0 -45 C 15 -25 35 -15 50 10 C 35 15 20 5 0 25 C -20 5 -35 15 -50 10 C -35 -15 -15 -25 0 -45 Z" fill="url(#phxFlame)"/>
    <circle cx="0" cy="-15" r="7" fill="#ffffff"/>
  </g>

  <!-- Badge Fréquence 89.5 FM -->
  <g transform="translate(256, 285)">
    <rect x="-110" y="-18" width="220" height="38" rx="19" fill="url(#phxGold)" filter="url(#phxDrop)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#1f0707" text-anchor="middle" letter-spacing="1">89.5 FM</text>
  </g>

  <!-- Titre Principal RADIO PHOENIX -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="29" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">RADIO PHOENIX</text>

  <!-- Slogan The Station of the Nation -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffab91" text-anchor="middle" letter-spacing="3">STATION OF THE NATION</text>

  <!-- Ville / Pays -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffd54f" text-anchor="middle" letter-spacing="2">LUSAKA • ZAMBIA 🇿🇲</text>
</svg>
