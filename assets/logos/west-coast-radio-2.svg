<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="wcr2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14061a"/>
      <stop offset="50%" stop-color="#2a0d35"/>
      <stop offset="100%" stop-color="#0e0412"/>
    </linearGradient>
    <linearGradient id="wcr2Magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4081"/>
      <stop offset="100%" stop-color="#e040fb"/>
    </linearGradient>
    <linearGradient id="wcr2Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="wcr2Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <filter id="wcr2Drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#ff4081" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#wcr2Bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#e040fb" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Ondes radio festives -->
  <g fill="none" stroke="url(#wcr2Cyan)" stroke-linecap="round" opacity="0.6">
    <path d="M 130 170 A 140 140 0 0 1 382 170" stroke-width="3" stroke-dasharray="6 8"/>
    <path d="M 160 180 A 105 105 0 0 1 352 180" stroke-width="4"/>
    <path d="M 195 190 A 70 70 0 0 1 317 190" stroke-width="5"/>
  </g>

  <!-- Emblème central WEST COAST RADIO 2 -->
  <g filter="url(#wcr2Drop)" transform="translate(256, 185)">
    <circle cx="0" cy="0" r="76" fill="#1b0824" stroke="url(#wcr2Magenta)" stroke-width="5"/>
    <!-- Vague & Soleil music vibe -->
    <path d="M -45 15 Q -20 -15 0 10 Q 20 -15 45 15 L 45 35 L -45 35 Z" fill="url(#wcr2Cyan)" opacity="0.85"/>
    <circle cx="0" cy="-22" r="20" fill="url(#wcr2Gold)"/>
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">WCR 2</text>
  </g>

  <!-- Badge Fréquence 95.3 FM -->
  <g transform="translate(256, 290)">
    <rect x="-110" y="-18" width="220" height="38" rx="19" fill="url(#wcr2Gold)" filter="url(#wcr2Drop)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#14061a" text-anchor="middle" letter-spacing="1">95.3 FM</text>
  </g>

  <!-- Titre Principal WEST COAST RADIO 2 -->
  <text x="256" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">WEST COAST RADIO 2</text>

  <!-- Sous-titre Hits, Afrobeats & Reggae -->
  <text x="256" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ea80fc" text-anchor="middle" letter-spacing="3">AFROBEATS, REGGAE &amp; HITS</text>

  <!-- Ville et pays -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffd54f" text-anchor="middle" letter-spacing="2">KOTU • THE GAMBIA 🇬🇲</text>
</svg>
