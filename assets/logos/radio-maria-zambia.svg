<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rmzBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041b2d"/>
      <stop offset="50%" stop-color="#0a3356"/>
      <stop offset="100%" stop-color="#02111d"/>
    </linearGradient>
    <linearGradient id="rmzBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40c4ff"/>
      <stop offset="100%" stop-color="#0091ea"/>
    </linearGradient>
    <linearGradient id="rmzGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="rmzDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#40c4ff" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#rmzBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#40c4ff" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Logo Radio Maria stylisé -->
  <g filter="url(#rmzDrop)" transform="translate(256, 175)">
    <circle cx="0" cy="0" r="76" fill="#06223b" stroke="url(#rmzBlue)" stroke-width="5"/>
    <!-- M marial stylisé avec étoile -->
    <path d="M -30 25 L -30 -15 L -10 10 L 10 -15 L 30 25" fill="none" stroke="url(#rmzGold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="-30" r="6" fill="#ffd54f"/>
  </g>

  <!-- Badge National -->
  <g transform="translate(256, 285)">
    <rect x="-110" y="-18" width="220" height="38" rx="19" fill="url(#rmzGold)" filter="url(#rmzDrop)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#041b2d" text-anchor="middle" letter-spacing="1">VOICE OF HOPE</text>
  </g>

  <!-- Titre RADIO MARIA -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="29" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">RADIO MARIA ZAMBIA</text>

  <!-- Slogan -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#80d8ff" text-anchor="middle" letter-spacing="3">FAITH, PEACE &amp; COMMUNITY</text>

  <!-- Ville / Pays -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffd54f" text-anchor="middle" letter-spacing="2">LUSAKA • ZAMBIA 🇿🇲</text>
</svg>
