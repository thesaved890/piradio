<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="plusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140608"/>
      <stop offset="50%" stop-color="#2b0d12"/>
      <stop offset="100%" stop-color="#0a0304"/>
    </linearGradient>
    <linearGradient id="plusRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="50%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#plusBg)" stroke="#E63946" stroke-width="3"/>

  <!-- Croix stylisée PLUS -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#E63946"/>
    <path d="M 0 -12 L 0 12 M -12 0 L 12 0" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Titre RADIO PLUS -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="2" text-anchor="middle">RADIO PLUS</text>

  <!-- Tag AGADIR • MARRAKECH -->
  <rect x="34" y="116" width="132" height="26" rx="8" fill="url(#plusRed)"/>
  <text x="100" y="134" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="11.5" letter-spacing="1.2" text-anchor="middle">AGADIR • CASABLANCA</text>

  <!-- Pied MAROC -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#1b070a" stroke="#E63946" stroke-width="1.2"/>
  <text x="100" y="171" fill="#FFA000" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">LA RADIO DE PROXIMITÉ</text>
</svg>