<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="hotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0400"/>
      <stop offset="50%" stop-color="#380a00"/>
      <stop offset="100%" stop-color="#100200"/>
    </linearGradient>
    <linearGradient id="hotFlame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d50000"/>
      <stop offset="60%" stop-color="#ff6d00"/>
      <stop offset="100%" stop-color="#ffd600"/>
    </linearGradient>
    <linearGradient id="hotGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <filter id="hotDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#ff3d00" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#hotBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#ff3d00" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Flamme HOT FM stylisée -->
  <g filter="url(#hotDrop)" transform="translate(256, 175)">
    <circle cx="0" cy="0" r="76" fill="#200500" stroke="url(#hotFlame)" stroke-width="5"/>
    <!-- Flamme dynamique -->
    <path d="M 0 -45 C 20 -25 35 -10 30 20 C 25 35 15 45 0 45 C -15 45 -25 35 -30 20 C -35 5 -15 -10 0 -45 Z" fill="url(#hotFlame)"/>
    <path d="M 0 -15 C 10 -5 15 5 12 20 C 10 28 5 32 0 32 C -5 32 -10 28 -12 20 C -15 10 -5 0 0 -15 Z" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Badge Fréquence 87.7 FM -->
  <g transform="translate(256, 285)">
    <rect x="-110" y="-18" width="220" height="38" rx="19" fill="url(#hotGold)" filter="url(#hotDrop)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#1a0400" text-anchor="middle" letter-spacing="1">87.7 FM</text>
  </g>

  <!-- Titre HOT FM -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">HOT FM</text>

  <!-- Slogan -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffab91" text-anchor="middle" letter-spacing="3">ZAMBIA'S HOTTEST STATION</text>

  <!-- Ville / Pays -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffd54f" text-anchor="middle" letter-spacing="2">LUSAKA • ZAMBIA 🇿🇲</text>
</svg>

