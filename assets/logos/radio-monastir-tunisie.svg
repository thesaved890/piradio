<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="monBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051426"/>
      <stop offset="50%" stop-color="#0a2647"/>
      <stop offset="100%" stop-color="#020c18"/>
    </linearGradient>
    <linearGradient id="monGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="monShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#monBg)" stroke="#38BDF8" stroke-width="3" filter="url(#monShadow)"/>

  <!-- Tour du Ribat de Monastir -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#0c2340" stroke="#38BDF8" stroke-width="2"/>
    <rect x="-6" y="-12" width="12" height="22" rx="1" fill="#FFD100"/>
    <polygon points="-8,-12 8,-12 0,-18" fill="#38BDF8"/>
  </g>

  <!-- Titre RADIO MONASTIR -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="1.5" text-anchor="middle" filter="url(#monShadow)">RADIO MONASTIR</text>

  <!-- Tag إذاعة المنستير -->
  <rect x="36" y="116" width="128" height="26" rx="8" fill="url(#monGold)"/>
  <text x="100" y="134" fill="#051426" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.2" text-anchor="middle">إذاعة المنستير</text>

  <!-- Pied TUNISIE -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#071b30" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="100" y="171" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">SAHEL • TUNISIE</text>
</svg>
