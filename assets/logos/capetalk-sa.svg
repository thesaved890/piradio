<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgCape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081d29"/>
      <stop offset="50%" stop-color="#0e3a54"/>
      <stop offset="100%" stop-color="#05141c"/>
    </linearGradient>
    <linearGradient id="capeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DD0E1"/>
      <stop offset="100%" stop-color="#00ACC1"/>
    </linearGradient>
    <linearGradient id="capeYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEE58"/>
      <stop offset="100%" stop-color="#FDD835"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgCape)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#capeCyan)" stroke-width="2.5" opacity="0.85"/>

  <!-- Logo CapeTalk &amp; Table Mountain / Mer -->
  <g transform="translate(100, 68)">
    <circle cx="0" cy="0" r="38" fill="#09283a" stroke="url(#capeYellow)" stroke-width="2"/>
    <!-- Profil Table Mountain stylisé -->
    <path d="M -22,8 L -16,-6 L 16,-6 L 22,8 Z" fill="url(#capeCyan)"/>
    <text x="0" y="24" font-family="'Arial Black', Impact, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle">567</text>
  </g>

  <!-- Titre CAPETALK -->
  <text x="100" y="126" font-family="'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CAPETALK</text>
  <text x="100" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="url(#capeYellow)" text-anchor="middle" letter-spacing="2">JOIN THE CONVERSATION</text>

  <!-- Cartouche Le Cap -->
  <rect x="20" y="158" width="160" height="26" rx="8" fill="url(#capeCyan)"/>
  <text x="100" y="175" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#081D29" text-anchor="middle" letter-spacing="1">CAPE TOWN TALK &amp; NEWS</text>
</svg>
