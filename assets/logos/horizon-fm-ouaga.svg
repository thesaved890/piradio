<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="horizonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b2d"/>
      <stop offset="50%" stop-color="#0c2c48"/>
      <stop offset="100%" stop-color="#030c14"/>
    </linearGradient>
    <linearGradient id="horizonSun" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF512F"/>
      <stop offset="100%" stop-color="#F09819"/>
    </linearGradient>
    <linearGradient id="horizonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#3A7BD5"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#horizonBg)"/>
  <rect width="194" height="194" x="3" y="3" rx="33" fill="none" stroke="url(#horizonSun)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Sun Rising over Horizon -->
  <circle cx="100" cy="74" r="38" fill="#041220" stroke="url(#horizonCyan)" stroke-width="2"/>
  <path d="M 76 74 A 24 24 0 0 1 124 74 Z" fill="url(#horizonSun)"/>
  <line x1="68" y1="74" x2="132" y2="74" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 72 84 Q 100 76, 128 84" fill="none" stroke="url(#horizonCyan)" stroke-width="2.5"/>

  <text x="100" y="132" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="20" letter-spacing="2" text-anchor="middle">HORIZON FM</text>
  <text x="100" y="152" fill="url(#horizonSun)" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="2" text-anchor="middle">104.4 FM</text>

  <rect x="36" y="166" width="128" height="20" rx="6" fill="#02080f" stroke="url(#horizonSun)" stroke-width="1.2"/>
  <text x="100" y="180" fill="#F09819" font-family="'Inter', sans-serif" font-weight="700" font-size="8.5" letter-spacing="1" text-anchor="middle">OUAGADOUGOU • DEPUIS 1987</text>
</svg>
