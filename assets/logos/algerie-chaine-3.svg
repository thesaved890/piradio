<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgCh3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2319"/>
      <stop offset="60%" stop-color="#064024"/>
      <stop offset="100%" stop-color="#021f11"/>
    </linearGradient>
    <linearGradient id="goldCh3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="redCh3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B5C"/>
      <stop offset="100%" stop-color="#C6002A"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgCh3)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#goldCh3)" stroke-width="2" opacity="0.8"/>

  <!-- Badge Institutionnel Radio Algérie -->
  <rect x="25" y="18" width="150" height="24" rx="6" fill="#006233" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="100" y="34" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">RADIO ALGÉRIE</text>

  <!-- Cercle central Chaine 3 -->
  <circle cx="100" cy="98" r="48" fill="#042617" stroke="url(#redCh3)" stroke-width="3"/>
  <circle cx="100" cy="98" r="42" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Grand chiffre 3 stylisé avec croissant -->
  <text x="96" y="116" font-family="'Arial Black', Impact, sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>
  
  <!-- Croissant & Étoile rouge -->
  <path d="M 124,78 A 10 10 0 1 0 134,92 A 8 8 0 1 1 124,78 Z" fill="#D21034"/>
  <polygon points="135,84 136.5,88 140.5,88 137.5,90.5 138.5,94.5 135,92 131.5,94.5 132.5,90.5 129.5,88 133.5,88" fill="#D21034"/>

  <!-- Libellé Chaîne 3 -->
  <text x="100" y="138" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="url(#goldCh3)" text-anchor="middle" letter-spacing="2">CHAÎNE 3</text>

  <!-- Bannière inférieure FM -->
  <rect x="30" y="156" width="140" height="28" rx="8" fill="url(#redCh3)"/>
  <text x="100" y="174" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">FRANÇAIS • 88.4 FM</text>
</svg>
