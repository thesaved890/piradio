<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="balafonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1106"/>
      <stop offset="50%" stop-color="#2d1c0b"/>
      <stop offset="100%" stop-color="#0a0602"/>
    </linearGradient>
    <linearGradient id="balafonGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="100%" stop-color="#FBB034"/>
    </linearGradient>
    <linearGradient id="balafonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#balafonBg)"/>
  <rect width="194" height="194" x="3" y="3" rx="33" fill="none" stroke="url(#balafonGold)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Icon: Traditional Balafon wooden keys & mallets -->
  <circle cx="100" cy="74" r="38" fill="#100903" stroke="url(#balafonGreen)" stroke-width="2"/>
  <!-- Balafon wooden slats -->
  <rect x="74" y="66" width="6" height="22" rx="2" fill="url(#balafonGold)"/>
  <rect x="84" y="62" width="6" height="26" rx="2" fill="url(#balafonGold)"/>
  <rect x="94" y="58" width="6" height="30" rx="2" fill="#FFFFFF"/>
  <rect x="104" y="62" width="6" height="26" rx="2" fill="url(#balafonGold)"/>
  <rect x="114" y="66" width="6" height="22" rx="2" fill="url(#balafonGold)"/>
  <path d="M 70 88 L 126 88" stroke="url(#balafonGreen)" stroke-width="2.5" stroke-linecap="round"/>

  <text x="100" y="130" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="18" letter-spacing="1.5" text-anchor="middle">BALAFON</text>
  <text x="100" y="148" fill="url(#balafonGold)" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="2" text-anchor="middle">102.7 FM</text>

  <rect x="36" y="166" width="128" height="20" rx="6" fill="#080401" stroke="url(#balafonGold)" stroke-width="1.2"/>
  <text x="100" y="180" fill="#00E676" font-family="'Inter', sans-serif" font-weight="700" font-size="8.5" letter-spacing="1" text-anchor="middle">BOBO-DIOULASSO • SIKASSO-BOBO</text>
</svg>
