<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="parlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081c10"/>
      <stop offset="50%" stop-color="#103820"/>
      <stop offset="100%" stop-color="#05120a"/>
    </linearGradient>
    <linearGradient id="parlGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    <linearGradient id="parlGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
    <filter id="parlDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#ffd54f" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#parlBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#2e7d32" stroke-opacity="0.4" stroke-width="4"/>

  <!-- Emblème officiel du Parlement -->
  <g filter="url(#parlDrop)" transform="translate(256, 175)">
    <circle cx="0" cy="0" r="76" fill="#0d2817" stroke="url(#parlGold)" stroke-width="5"/>
    <!-- Masse cérémonielle / Colonnes du parlement -->
    <rect x="-8" y="-40" width="16" height="80" rx="3" fill="url(#parlGold)"/>
    <circle cx="0" cy="-42" r="14" fill="url(#parlGold)"/>
    <rect x="-24" y="28" width="48" height="10" rx="2" fill="url(#parlGold)"/>
  </g>

  <!-- Badge Fréquence 92.5 FM -->
  <g transform="translate(256, 285)">
    <rect x="-110" y="-18" width="220" height="38" rx="19" fill="url(#parlGold)" filter="url(#parlDrop)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#081c10" text-anchor="middle" letter-spacing="1">92.5 FM</text>
  </g>

  <!-- Titre PARLIAMENT RADIO -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">PARLIAMENT RADIO</text>

  <!-- Slogan -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#a5d6a7" text-anchor="middle" letter-spacing="3">DEMOCRACY &amp; GOVERNANCE</text>

  <!-- Ville / Pays -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffd54f" text-anchor="middle" letter-spacing="2">LUSAKA • ZAMBIA 🇿🇲</text>
</svg>
