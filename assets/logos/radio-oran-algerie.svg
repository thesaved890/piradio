<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgOran" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d30"/>
      <stop offset="50%" stop-color="#103c66"/>
      <stop offset="100%" stop-color="#071828"/>
    </linearGradient>
    <linearGradient id="oranSunset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#FB8C00"/>
    </linearGradient>
    <linearGradient id="goldOran" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgOran)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#oranSunset)" stroke-width="2" opacity="0.85"/>

  <!-- En-tête Radio Algérie -->
  <text x="100" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="url(#goldOran)" text-anchor="middle" letter-spacing="2">RADIO ALGÉRIE</text>

  <!-- Fort de Santa Cruz & Baie d'Oran stylisé -->
  <g transform="translate(100, 74)">
    <circle cx="0" cy="0" r="40" fill="#082542" stroke="url(#oranSunset)" stroke-width="2.5"/>
    <!-- Muraille fortifiée Santa Cruz sur le mont Murdjadjo -->
    <path d="M -24,18 L -16,2 L -8,6 L 0,-14 L 8,-4 L 16,8 L 24,18 Z" fill="none" stroke="url(#goldOran)" stroke-width="2"/>
    <circle cx="0" cy="-14" r="3" fill="#FFFFFF"/>
    <!-- Vagues marines -->
    <path d="M -28,20 Q -14,14 0,20 T 28,20" fill="none" stroke="#4FC3F7" stroke-width="1.5"/>
  </g>

  <!-- Titre Radio Oran -->
  <text x="100" y="132" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">RADIO ORAN</text>
  <text x="100" y="150" font-family="'Amiri', 'Traditional Arabic', serif" font-size="17" font-weight="bold" fill="url(#oranSunset)" text-anchor="middle">إذاعة وهران • الباهية</text>

  <!-- Cartouche inférieur -->
  <rect x="25" y="162" width="150" height="25" rx="8" fill="url(#oranSunset)"/>
  <text x="100" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="900" fill="#0B1E33" text-anchor="middle" letter-spacing="1">EL BAHIA • BERCEAU DU RAÏ</text>
</svg>