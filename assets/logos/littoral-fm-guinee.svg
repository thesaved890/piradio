<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="littoralBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041b2d"/>
      <stop offset="50%" stop-color="#0b3052"/>
      <stop offset="100%" stop-color="#020d17"/>
    </linearGradient>
    <linearGradient id="littoralWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="50%" stop-color="#48CAE4"/>
      <stop offset="100%" stop-color="#90E0EF"/>
    </linearGradient>
    <filter id="littoralShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#littoralBg)" stroke="#00B4D8" stroke-width="3" filter="url(#littoralShadow)"/>

  <!-- Vague littorale stylisée et phare/antenne -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="24" fill="#032845" stroke="#00B4D8" stroke-width="2"/>
    <!-- Vagues -->
    <path d="M -16 6 Q -8 -6 0 6 Q 8 16 16 6" fill="none" stroke="url(#littoralWave)" stroke-width="3" stroke-linecap="round"/>
    <path d="M -12 -2 Q -6 -10 0 -2 Q 6 6 12 -2" fill="none" stroke="#90E0EF" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Antenne émettrice -->
    <line x1="0" y1="-8" x2="0" y2="-22" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-22" r="3" fill="#00B4D8"/>
  </g>

  <!-- Nom LITTORAL FM -->
  <text x="100" y="104" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="21" letter-spacing="2" text-anchor="middle" filter="url(#littoralShadow)">LITTORAL FM</text>

  <!-- Tag GUINÉE LIVE -->
  <rect x="44" y="116" width="112" height="26" rx="8" fill="url(#littoralWave)"/>
  <text x="100" y="134" fill="#041b2d" font-family="'Inter', sans-serif" font-weight="900" font-size="13.5" letter-spacing="1.5" text-anchor="middle">GUINÉE LIVE</text>

  <!-- Cartouche Fréquence & Région -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#061f36" stroke="#00B4D8" stroke-width="1.2"/>
  <text x="100" y="171" fill="#48CAE4" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="2" text-anchor="middle">99.7 FM • CONAKRY</text>
</svg>

