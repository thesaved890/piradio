<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="hitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#hitBg)" stroke="#FFE500" stroke-width="3.5"/>

  <!-- Étoile et dynamique HIT -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="24" fill="#FFE500"/>
    <polygon points="0,-16 4.5,-4 16,-4 7,3 10,14 0,7 -10,14 -7,3 -16,-4 -4.5,-4" fill="#000000"/>
  </g>

  <!-- Nom HIT RADIO -->
  <text x="100" y="105" fill="#FFE500" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="25" letter-spacing="2" text-anchor="middle">HIT RADIO</text>

  <!-- Tag 100% HITS -->
  <rect x="36" y="116" width="128" height="26" rx="8" fill="#FFE500"/>
  <text x="100" y="134" fill="#000000" font-family="'Inter', sans-serif" font-weight="900" font-size="13" letter-spacing="1.5" text-anchor="middle">100% HITS</text>

  <!-- Pied de badge MAROC -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#171717" stroke="#FFE500" stroke-width="1.2"/>
  <text x="100" y="171" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="2" text-anchor="middle">MAROC • LA RADIO N°1</text>
</svg>