<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="dzBadgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1912"/>
      <stop offset="50%" stop-color="#053018"/>
      <stop offset="100%" stop-color="#031f0f"/>
    </linearGradient>
    <linearGradient id="dzGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="50%" stop-color="#E8B838"/>
      <stop offset="100%" stop-color="#9C7515"/>
    </linearGradient>
    <filter id="dzGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="circleClip">
      <circle cx="100" cy="95" r="54"/>
    </clipPath>
  </defs>

  <!-- Fond circulaire sombre premium -->
  <rect width="200" height="200" rx="36" fill="url(#dzBadgeBg)"/>

  <!-- Bordure extérieure dorée ciselée -->
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#dzGold)" stroke-width="2.5" opacity="0.85"/>
  <rect x="9" y="9" width="182" height="182" rx="28" fill="none" stroke="#006233" stroke-width="1.5" opacity="0.6"/>

  <!-- Ondes radio concentriques -->
  <circle cx="100" cy="95" r="76" fill="none" stroke="#006233" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.5"/>
  <circle cx="100" cy="95" r="66" fill="none" stroke="url(#dzGold)" stroke-width="1" stroke-dasharray="2 5" opacity="0.7"/>

  <!-- Médaillon central : Drapeau de l'Algérie -->
  <g clip-path="url(#circleClip)">
    <!-- Moitié gauche verte -->
    <rect x="46" y="41" width="54" height="108" fill="#006233"/>
    <!-- Moitié droite blanche -->
    <rect x="100" y="41" width="54" height="108" fill="#FFFFFF"/>
    
    <!-- Croissant rouge officiel -->
    <circle cx="100" cy="95" r="30" fill="#D21034"/>
    <circle cx="107" cy="95" r="24" fill="#FFFFFF"/>
    <!-- Étoile rouge officielle à 5 branches -->
    <polygon points="107,83 110,91 118,91 112,96 114,104 107,99 100,104 102,96 96,91 104,91" fill="#D21034"/>
  </g>

  <!-- Bordure dorée du disque central -->
  <circle cx="100" cy="95" r="54" fill="none" stroke="url(#dzGold)" stroke-width="3" filter="url(#dzGlow)"/>

  <!-- Filigrane Pi Web3 discret -->
  <text x="100" y="40" font-family="'Arial Black', sans-serif" font-size="13" font-weight="900" fill="url(#dzGold)" text-anchor="middle" letter-spacing="3" opacity="0.9">π PI RADIO</text>

  <!-- Cartouche inférieur Algérie -->
  <rect x="22" y="157" width="156" height="30" rx="10" fill="#006233" stroke="url(#dzGold)" stroke-width="1.5"/>
  <text x="100" y="177" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">🇩🇿 ALGÉRIE</text>
</svg>