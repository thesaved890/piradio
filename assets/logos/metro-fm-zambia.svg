<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="metBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14061f"/>
      <stop offset="50%" stop-color="#2a0d3f"/>
      <stop offset="100%" stop-color="#0e0417"/>
    </linearGradient>
    <linearGradient id="metCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <linearGradient id="metMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4081"/>
      <stop offset="100%" stop-color="#c51162"/>
    </linearGradient>
    <linearGradient id="metGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#metBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#00e5ff" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Logo M stylisé Metro -->
  <g transform="translate(256, 175)">
    <circle cx="0" cy="0" r="76" fill="#1b082a" stroke="url(#metCyan)" stroke-width="5"/>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="url(#metMagenta)" text-anchor="middle" letter-spacing="1">M</text>
  </g>

  <!-- Badge Fréquence 94.5 FM -->
  <g transform="translate(256, 285)">
    <rect x="-110" y="-18" width="220" height="38" rx="19" fill="url(#metGold)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#14061f" text-anchor="middle" letter-spacing="1">94.5 FM</text>
  </g>

  <!-- Titre METRO FM -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">METRO FM</text>

  <!-- Slogan -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#80d8ff" text-anchor="middle" letter-spacing="3">URBAN MUSIC &amp; LIFESTYLE</text>

  <!-- Ville / Pays -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffd54f" text-anchor="middle" letter-spacing="2">LUSAKA • ZAMBIA 🇿🇲</text>
</svg>