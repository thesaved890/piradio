<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="kassaraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1106"/>
      <stop offset="50%" stop-color="#2d1d0c"/>
      <stop offset="100%" stop-color="#0b0602"/>
    </linearGradient>
    <linearGradient id="kassaraAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFC837"/>
      <stop offset="100%" stop-color="#FF8008"/>
    </linearGradient>
    <linearGradient id="kassaraTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C9FF"/>
      <stop offset="100%" stop-color="#92FE9D"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="36" fill="url(#kassaraBg)"/>
  <rect width="194" height="194" x="3" y="3" rx="33" fill="none" stroke="url(#kassaraAmber)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Icon: Waves / Mountain / Kayes Sun -->
  <circle cx="100" cy="74" r="38" fill="#140b03" stroke="url(#kassaraTeal)" stroke-width="2"/>
  <!-- Stylized Sun & River Senegal -->
  <circle cx="100" cy="66" r="14" fill="url(#kassaraAmber)"/>
  <path d="M 74 82 Q 87 75, 100 82 T 126 82" fill="none" stroke="url(#kassaraTeal)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 78 89 Q 89 82, 100 89 T 122 89" fill="none" stroke="url(#kassaraTeal)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- Station Name -->
  <text x="100" y="130" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="16" letter-spacing="1" text-anchor="middle">BARIKAMA</text>
  <text x="100" y="148" fill="url(#kassaraAmber)" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="1.5" text-anchor="middle">KASSARA 107.4 FM</text>

  <!-- Subtitle -->
  <rect x="36" y="166" width="128" height="20" rx="6" fill="#0c0702" stroke="url(#kassaraTeal)" stroke-width="1.2"/>
  <text x="100" y="180" fill="#92FE9D" font-family="'Inter', sans-serif" font-weight="700" font-size="9" letter-spacing="1.5" text-anchor="middle">KAYES • 1ÈRE RÉGION DU MALI</text>
</svg>

