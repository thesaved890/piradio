<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="miskBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="50%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="miskGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#F3E5AB"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
    <filter id="miskShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#miskBg)" stroke="url(#miskGold)" stroke-width="3" filter="url(#miskShadow)"/>

  <!-- Logo Misk épuré (مسك) -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#1c1c1c" stroke="url(#miskGold)" stroke-width="2"/>
    <text x="0" y="8" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="1" text-anchor="middle">M</text>
  </g>

  <!-- Titre RADIO MISK -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="2.5" text-anchor="middle" filter="url(#miskShadow)">RADIO MISK</text>

  <!-- Tag CULTURE & INDIE -->
  <rect x="36" y="116" width="128" height="26" rx="8" fill="url(#miskGold)"/>
  <text x="100" y="134" fill="#141414" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.2" text-anchor="middle">CULTURE &amp; INDIE</text>

  <!-- Pied TUNISIE -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#1a1a1a" stroke="url(#miskGold)" stroke-width="1.2"/>
  <text x="100" y="171" fill="#F3E5AB" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">LA RADIO ALTERNATIVE</text>
</svg>
