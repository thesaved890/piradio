<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bougouniBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1205"/>
      <stop offset="50%" stop-color="#3d1e0a"/>
      <stop offset="100%" stop-color="#140702"/>
    </linearGradient>
    <linearGradient id="bougouniGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDD55"/>
      <stop offset="100%" stop-color="#FF8800"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="36" fill="url(#bougouniBg)"/>
  <rect width="194" height="194" x="3" y="3" rx="33" fill="none" stroke="url(#bougouniGold)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Icon: Traditional Talking Drum / Speaker -->
  <circle cx="100" cy="74" r="38" fill="#1b0b03" stroke="url(#bougouniGold)" stroke-width="2"/>
  <!-- Megaphone / Kunkan (Voice) -->
  <path d="M 82 82 L 94 82 L 110 96 L 110 52 L 94 66 L 82 66 Z" fill="url(#bougouniGold)"/>
  <path d="M 118 64 A 14 14 0 0 1 118 84" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 125 58 A 24 24 0 0 1 125 90" fill="none" stroke="url(#bougouniGold)" stroke-width="2" stroke-linecap="round"/>

  <!-- Text -->
  <text x="100" y="130" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="16" letter-spacing="1" text-anchor="middle">BOUGOUNI</text>
  <text x="100" y="148" fill="url(#bougouniGold)" font-family="'Inter', sans-serif" font-weight="800" font-size="14" letter-spacing="1.5" text-anchor="middle">KUNKAN 102.9</text>

  <!-- Region -->
  <rect x="36" y="166" width="128" height="20" rx="6" fill="#0f0502" stroke="url(#bougouniGold)" stroke-width="1.2"/>
  <text x="100" y="180" fill="#FFB703" font-family="'Inter', sans-serif" font-weight="700" font-size="9" letter-spacing="1.5" text-anchor="middle">SIKASSO • VOIX DU TERROIR</text>
</svg>
