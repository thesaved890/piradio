<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rcfaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c38"/>
      <stop offset="50%" stop-color="#053366"/>
      <stop offset="100%" stop-color="#011021"/>
    </linearGradient>
    <linearGradient id="rcfaOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ff6d00"/>
    </linearGradient>
    <linearGradient id="rcfaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b0ff"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <filter id="rcfaDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#ff9100" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#rcfaBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#00b0ff" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Logo RCF stylisé -->
  <g filter="url(#rcfaDrop)" transform="translate(256, 175)">
    <circle cx="0" cy="0" r="76" fill="#042244" stroke="url(#rcfaOrange)" stroke-width="5"/>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">rcf</text>
  </g>

  <!-- Badge Fréquence 96.3 FM -->
  <g transform="translate(256, 285)">
    <rect x="-110" y="-18" width="220" height="38" rx="19" fill="url(#rcfaOrange)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">96.3 FM</text>
  </g>

  <!-- Titre RCF ALPHA -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">RCF ALPHA</text>

  <!-- Slogan -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#80d8ff" text-anchor="middle" letter-spacing="3">LA RADIO CHRÉTIENNE EN ILLE-ET-VILAINE</text>

  <!-- Ville / Pays -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffd54f" text-anchor="middle" letter-spacing="2">RENNES • BRETAGNE</text>
</svg>
