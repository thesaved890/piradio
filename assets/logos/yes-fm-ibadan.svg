<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="yesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001830"/>
      <stop offset="50%" stop-color="#003566"/>
      <stop offset="100%" stop-color="#000d1a"/>
    </linearGradient>
    <linearGradient id="yesYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD60A"/>
      <stop offset="100%" stop-color="#FFC300"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F3B43F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#yesBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Frequency Top Badge -->
  <g transform="translate(156, 65)">
    <rect width="200" height="46" rx="23" fill="url(#yesYellow)"/>
    <text x="100" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" fill="#001830" text-anchor="middle" letter-spacing="2">101.7 FM</text>
  </g>

  <!-- Big YES Typography -->
  <text x="256" y="225" font-family="'Impact', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="120" fill="url(#yesYellow)" text-anchor="middle" letter-spacing="4">YES</text>
  <text x="256" y="285" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">FM IBADAN</text>

  <!-- Oyo State Slogan -->
  <text x="256" y="350" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#E0E1DD" text-anchor="middle" letter-spacing="3">OYO STATE • NIGERIA</text>
  <text x="256" y="388" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" fill="#90E0EF" text-anchor="middle" letter-spacing="2">THE ENTERTAINMENT HUB</text>

  <!-- Live Tag -->
  <g transform="translate(146, 422)">
    <rect width="220" height="40" rx="20" fill="#003318" stroke="url(#gold)" stroke-width="2"/>
    <text x="110" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#00E676" text-anchor="middle" letter-spacing="3">🇳🇬 IBADAN 100% LIVE</text>
  </g>
</svg>
