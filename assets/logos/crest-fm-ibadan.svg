<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="crestBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b0938"/>
      <stop offset="50%" stop-color="#4a154b"/>
      <stop offset="100%" stop-color="#15041c"/>
    </linearGradient>
    <linearGradient id="crestRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#D50000"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F3B43F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#crestBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Frequency Top Badge -->
  <g transform="translate(156, 65)">
    <rect width="200" height="46" rx="23" fill="url(#crestRed)"/>
    <text x="100" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">91.1 FM</text>
  </g>

  <!-- Big CREST Typography -->
  <text x="256" y="215" font-family="'Impact', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="96" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">CREST FM</text>
  <text x="256" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#crestRed)" text-anchor="middle" letter-spacing="8">IBADAN</text>

  <!-- Location Tag & Slogan -->
  <text x="256" y="345" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="24" fill="#E1BEE7" text-anchor="middle" letter-spacing="3">OYO STATE • NIGERIA</text>
  <text x="256" y="385" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" fill="#F8BBD0" text-anchor="middle" letter-spacing="2">NEWS, VIEWS &amp; BEST OF ENTERTAINMENT</text>

  <!-- Live Tag -->
  <g transform="translate(146, 422)">
    <rect width="220" height="40" rx="20" fill="#003318" stroke="url(#gold)" stroke-width="2"/>
    <text x="110" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#00E676" text-anchor="middle" letter-spacing="3">🇳🇬 IBADAN 100% LIVE</text>
  </g>
</svg>

