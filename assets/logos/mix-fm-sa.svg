<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgMix" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a24"/>
      <stop offset="50%" stop-color="#2a124a"/>
      <stop offset="100%" stop-color="#0e061a"/>
    </linearGradient>
    <linearGradient id="mixPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A7A"/>
      <stop offset="100%" stop-color="#D81B60"/>
    </linearGradient>
    <linearGradient id="mixCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgMix)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#mixPink)" stroke-width="2.5" opacity="0.85"/>

  <!-- Logo Mix FM Sliders / Equalizer -->
  <g transform="translate(100, 68)">
    <circle cx="0" cy="0" r="38" fill="#1f0b38" stroke="url(#mixCyan)" stroke-width="2"/>
    <!-- Barres d'égaliseur audio -->
    <rect x="-18" y="-12" width="6" height="24" rx="2" fill="url(#mixPink)"/>
    <rect x="-6" y="-22" width="6" height="34" rx="2" fill="url(#mixCyan)"/>
    <rect x="6" y="-8" width="6" height="20" rx="2" fill="url(#mixPink)"/>
    <rect x="18" y="-18" width="6" height="30" rx="2" fill="url(#mixCyan)"/>
  </g>

  <!-- Titre MIX FM -->
  <text x="100" y="126" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">MIX FM</text>
  <text x="100" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="url(#mixCyan)" text-anchor="middle" letter-spacing="2">93.8 FM • MIDRAND</text>

  <!-- Cartouche Joburg -->
  <rect x="20" y="158" width="160" height="26" rx="8" fill="url(#mixPink)"/>
  <text x="100" y="175" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GREATER JOHANNESBURG</text>
</svg>