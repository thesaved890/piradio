<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="frissonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0404"/>
      <stop offset="50%" stop-color="#3b0808"/>
      <stop offset="100%" stop-color="#120202"/>
    </linearGradient>
    <linearGradient id="frissonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="50%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#ff9100"/>
    </linearGradient>
    <radialGradient id="frissonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff1744" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#frissonBg)"/>
  <circle cx="100" cy="82" r="58" fill="none" stroke="url(#frissonGrad)" stroke-width="2.5"/>
  <!-- Soundwave / Frequency pulse -->
  <g fill="url(#frissonGrad)">
    <rect x="52" y="76" width="6" height="16" rx="3"/>
    <rect x="64" y="66" width="6" height="36" rx="3"/>
    <rect x="76" y="56" width="6" height="56" rx="3"/>
    <rect x="88" y="46" width="6" height="76" rx="3"/>
    <rect x="100" y="38" width="6" height="92" rx="3"/>
    <rect x="112" y="48" width="6" height="72" rx="3"/>
    <rect x="124" y="58" width="6" height="52" rx="3"/>
    <rect x="136" y="68" width="6" height="32" rx="3"/>
    <rect x="148" y="78" width="6" height="12" rx="3"/>
  </g>
  <!-- Center Glow and Heartbeat Vibe -->
  <circle cx="100" cy="84" r="26" fill="url(#frissonGlow)"/>
  <text x="100" y="90" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="2" text-anchor="middle">95.2 FM</text>
  <text x="100" y="132" font-family="system-ui,-apple-system,sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="3" text-anchor="middle">FRISSONS</text>
