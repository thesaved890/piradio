      <stop offset="0%" stop-color="#051c24"/>
      <stop offset="50%" stop-color="#0a2f3d"/>
      <stop offset="100%" stop-color="#020e12"/>
    </linearGradient>
    <linearGradient id="anfaniCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
    <linearGradient id="anfaniGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#FF9100"/>
