  <circle cx="100" cy="74" r="38" fill="#031318" stroke="url(#anfaniGold)" stroke-width="2"/>
  <path d="M 88 88 L 100 52 L 112 88" stroke="url(#anfaniCyan)" stroke-width="3" stroke-linecap="round"/>
  <line x1="92" y1="76" x2="108" y2="76" stroke="url(#anfaniCyan)" stroke-width="2"/>
  <circle cx="100" cy="50" r="4" fill="url(#anfaniGold)"/>

  <text x="100" y="132" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="22" letter-spacing="2" text-anchor="middle">ANFANI</text>
  <text x="100" y="152" fill="url(#anfaniGold)" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="2" text-anchor="middle">100.0 FM</text>

  <rect x="36" y="166" width="128" height="20" rx="6" fill="#02080a" stroke="url(#anfaniCyan)" stroke-width="1.2"/>
  <text x="100" y="180" fill="#00E5FF" font-family="'Inter', sans-serif" font-weight="700" font-size="9" letter-spacing="1.5" text-anchor="middle">NIAMEY • 1ÈRE RADIO PRIVÉE</text>
