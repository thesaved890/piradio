  </defs>

  <rect width="200" height="200" rx="36" fill="url(#anfaniBg)"/>
  <rect width="194" height="194" x="3" y="3" rx="33" fill="none" stroke="url(#anfaniCyan)" stroke-width="2.5" stroke-opacity="0.85"/>

