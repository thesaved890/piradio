<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgConst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1106"/>
      <stop offset="50%" stop-color="#38220c"/>
      <stop offset="100%" stop-color="#140c04"/>
    </linearGradient>
    <linearGradient id="goldConst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgConst)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#goldConst)" stroke-width="2" opacity="0.85"/>

  <!-- En-tête Radio Algérie -->
  <text x="100" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="url(#goldConst)" text-anchor="middle" letter-spacing="2">RADIO ALGÉRIE</text>

  <!-- Pont suspendu de Constantine (Sidi M'Cid) stylisé -->
  <g transform="translate(100, 74)">
    <circle cx="0" cy="0" r="40" fill="#201306" stroke="url(#goldConst)" stroke-width="2.5"/>
    <!-- Piliers & câbles du pont suspendu -->
    <line x1="-26" y1="18" x2="-26" y2="-18" stroke="url(#goldConst)" stroke-width="3"/>
    <line x1="26" y1="18" x2="26" y2="-18" stroke="url(#goldConst)" stroke-width="3"/>
    <!-- Câble principal suspendu -->
    <path d="M -26,-12 Q 0,10 26,-12" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="-32" y1="6" x2="32" y2="6" stroke="url(#goldConst)" stroke-width="2.5"/>
    <!-- Suspentes verticales -->
    <line x1="-12" y1="2" x2="-12" y2="6" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="9" x2="0" y2="6" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="12" y1="2" x2="12" y2="6" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Titre Radio Constantine -->
  <text x="100" y="132" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CONSTANTINE</text>
  <text x="100" y="150" font-family="'Amiri', 'Traditional Arabic', serif" font-size="17" font-weight="bold" fill="url(#goldConst)" text-anchor="middle">إذاعة قسنطينة • سيرتا</text>

  <!-- Cartouche inférieur -->
  <rect x="20" y="162" width="160" height="25" rx="8" fill="url(#goldConst)"/>
  <text x="100" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="900" fill="#1C1106" text-anchor="middle" letter-spacing="1">VILLE DES PONTS & MALOUF</text>
</svg>
