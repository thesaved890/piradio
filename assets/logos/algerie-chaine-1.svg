<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgCh1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b2f"/>
      <stop offset="50%" stop-color="#0a325e"/>
      <stop offset="100%" stop-color="#05182e"/>
    </linearGradient>
    <linearGradient id="blueCh1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="goldCh1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgCh1)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#blueCh1)" stroke-width="2" opacity="0.8"/>

  <!-- En-tête officiel Radio Algérie -->
  <rect x="25" y="16" width="150" height="24" rx="6" fill="#006233" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="100" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">RADIO ALGÉRIE</text>

  <!-- Médaillon central Chaine 1 -->
  <circle cx="100" cy="95" r="48" fill="#04203d" stroke="url(#blueCh1)" stroke-width="3"/>
  
  <!-- Grand chiffre 1 stylisé -->
  <text x="96" y="112" font-family="'Arial Black', Impact, sans-serif" font-size="52" font-weight="900" fill="#FFFFFF" text-anchor="middle">1</text>
  
  <!-- Calligraphie arabe القناة الأولى -->
  <text x="100" y="136" font-family="'Amiri', 'Traditional Arabic', 'Segoe UI', serif" font-size="14" font-weight="bold" fill="url(#goldCh1)" text-anchor="middle">القناة الأولى</text>

  <!-- Cartouche inférieur -->
  <rect x="25" y="156" width="150" height="28" rx="8" fill="url(#blueCh1)"/>
  <text x="100" y="174" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CHAÎNE 1 • ARABE</text>
</svg>
