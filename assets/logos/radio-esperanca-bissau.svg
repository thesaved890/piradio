<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="esperancaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051726"/>
      <stop offset="50%" stop-color="#0a2a47"/>
      <stop offset="100%" stop-color="#030d17"/>
    </linearGradient>
    <linearGradient id="esperancaGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00B4D8"/>
      <stop offset="50%" stop-color="#90E0EF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#esperancaBg)" stroke="#00B4D8" stroke-width="3"/>

  <!-- Rayons de lumière et colombe de paix -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="22" fill="#0077B6" stroke="#90E0EF" stroke-width="2"/>
    <!-- Croix / symbole d'espoir et ailes stylisées -->
    <path d="M 0 -12 L 0 12 M -9 -5 L 9 -5" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M -16 6 Q -8 -2 0 6 Q 8 -2 16 6" fill="none" stroke="#FCD116" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Titre VOZ DE ESPERANÇA -->
  <text x="100" y="104" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="18.5" letter-spacing="1" text-anchor="middle">VOZ DE ESPERANÇA</text>

  <!-- Tag BISSAU LIVE -->
  <rect x="42" y="116" width="116" height="26" rx="8" fill="#0077B6"/>
  <text x="100" y="134" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.5" text-anchor="middle">BISSAU • FÉ &amp; PAZ</text>

  <!-- Pied de badge -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#081e33" stroke="#00B4D8" stroke-width="1.2"/>
  <text x="100" y="171" fill="#90E0EF" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">GUINÉ-BISSAU</text>
</svg>