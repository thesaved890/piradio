<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#0f2b48"/>
      <stop offset="100%" stop-color="#05101f"/>
    </linearGradient>
    <linearGradient id="rcOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E44"/>
      <stop offset="50%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#D64516"/>
    </linearGradient>
    <linearGradient id="rcCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80E5FF"/>
      <stop offset="50%" stop-color="#00C9FF"/>
      <stop offset="100%" stop-color="#0088CC"/>
    </linearGradient>
    <linearGradient id="rcGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <radialGradient id="rcGlow" cx="50%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    
  </defs>

  <!-- Fond circulaire et lueur -->
  <circle cx="256" cy="256" r="240" fill="url(#rcBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#rcCyan)" stroke-width="3" stroke-opacity="0.7"/>
  <circle cx="256" cy="200" r="170" fill="url(#rcGlow)"/>

  <!-- Ondes radio émettrices -->
  <g fill="none" stroke="url(#rcCyan)" stroke-linecap="round" opacity="0.8">
    <path d="M 140 185 A 130 130 0 0 1 372 185" stroke-width="3.5" stroke-dasharray="8 8"/>
    <path d="M 170 195 A 100 100 0 0 1 342 195" stroke-width="4.5"/>
    <path d="M 200 205 A 70 70 0 0 1 312 205" stroke-width="5.5"/>
  </g>

  <!-- Tour émettrice / Micro stylisé au centre -->
  <g transform="translate(256, 195)">
    <!-- Disque central orange soleil couchant -->
    <circle cx="0" cy="0" r="62" fill="url(#rcOrange)"/>
    <circle cx="0" cy="0" r="56" fill="#0A192F" stroke="url(#rcOrange)" stroke-width="2"/>
    
    <!-- Silhouette microphone moderne -->
    <rect x="-14" y="-30" width="28" height="42" rx="14" fill="url(#rcCyan)"/>
    <path d="M -22 -10 C -22 18 22 18 22 -10" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="0" y2="34" stroke="#FFFFFF" stroke-width="3.5"/>
    <line x1="-12" y1="34" x2="12" y2="34" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Badge Fréquence 94.3 FM -->
  <g transform="translate(256, 290)">
    <rect x="-85" y="-18" width="170" height="36" rx="18" fill="url(#rcOrange)"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">94.3 FM</text>
  </g>

  <!-- Titre RADIO COTONOU -->
  <text x="256" y="365" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">RADIO COTONOU</text>

  <!-- Sous-titre Ville &amp; Pays -->
  <g transform="translate(256, 400)">
    <text x="0" y="0" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="url(#rcGold)" text-anchor="middle" letter-spacing="4">COTONOU • BÉNIN</text>
  </g>

  <!-- Puce du drapeau béninois en bas -->
  <g transform="translate(256, 430)">
    <rect x="-18" y="-7" width="12" height="14" fill="#008751" rx="2"/>
    <rect x="-6" y="-7" width="24" height="7" fill="#FCD116" rx="1"/>
    <rect x="-6" y="0" width="24" height="7" fill="#E8112D" rx="1"/>
    <rect x="-18" y="-7" width="36" height="14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" rx="2"/>
  </g>
</svg>