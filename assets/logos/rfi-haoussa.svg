<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rfiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800010"/>
      <stop offset="60%" stop-color="#E2001A"/>
      <stop offset="100%" stop-color="#4A000A"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F3B43F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#rfiBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#goldBorder)" stroke-width="4" stroke-opacity="0.8"/>
  
  <!-- Red RFI Box Header -->
  <rect x="76" y="80" width="360" height="150" rx="24" fill="#FFFFFF"/>
  <text x="256" y="195" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="120" fill="#E2001A" text-anchor="middle" letter-spacing="-4">rfi</text>

  <!-- Haoussa Text -->
  <text x="256" y="300" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">HAOUSSA</text>
  <text x="256" y="350" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="28" fill="#FFE082" text-anchor="middle" letter-spacing="3">LABARAI DA DUMI-DUMISU</text>

  <!-- Nigeria Service Ribbon -->
  <g transform="translate(106, 395)">
    <rect width="300" height="56" rx="28" fill="#003318" stroke="url(#goldBorder)" stroke-width="2.5"/>
    <rect x="18" y="14" width="12" height="28" rx="2" fill="#008751"/>
    <rect x="30" y="14" width="12" height="28" fill="#FFFFFF"/>
    <rect x="42" y="14" width="12" height="28" rx="2" fill="#008751"/>
    <text x="175" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">NIGERIA • 96.0 FM</text>
  </g>
</svg>
