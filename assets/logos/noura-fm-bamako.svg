<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="nouraBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052014"/>
      <stop offset="50%" stop-color="#0a3321"/>
      <stop offset="100%" stop-color="#02140c"/>
    </linearGradient>
    <linearGradient id="nouraGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="100%" stop-color="#C79600"/>
    </linearGradient>
    <linearGradient id="nouraGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="36" fill="url(#nouraBg)"/>
  <rect width="194" height="194" x="3" y="3" rx="33" fill="none" stroke="url(#nouraGold)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Crescent &amp; Star / Waves Motif -->
  <circle cx="100" cy="74" r="38" fill="#041a10" stroke="url(#nouraGreen)" stroke-width="2"/>
  <!-- Crescent -->
  <path d="M 106 52 A 24 24 0 1 0 106 94 A 20 20 0 1 1 106 52 Z" fill="url(#nouraGold)"/>
  <circle cx="112" cy="73" r="4" fill="#FFFFFF"/>

  <!-- Station Name -->
  <text x="100" y="132" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="22" letter-spacing="2" text-anchor="middle">NOURA FM</text>
  <text x="100" y="152" fill="url(#nouraGold)" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="2" text-anchor="middle">94.5 FM</text>

  <!-- City &amp; Country -->
  <rect x="36" y="166" width="128" height="20" rx="6" fill="#021008" stroke="url(#nouraGreen)" stroke-width="1.2"/>
  <text x="100" y="180" fill="#00E676" font-family="'Inter', sans-serif" font-weight="700" font-size="9" letter-spacing="1.5" text-anchor="middle">BAMAKO • LA VOIX DE LA PAIX</text>
</svg>

