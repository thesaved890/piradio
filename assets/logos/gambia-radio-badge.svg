<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gmBadgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1220"/>
      <stop offset="50%" stop-color="#0e1d33"/>
      <stop offset="100%" stop-color="#060b14"/>
    </linearGradient>
    <linearGradient id="gmRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef5350"/>
      <stop offset="100%" stop-color="#c62828"/>
    </linearGradient>
    <linearGradient id="gmBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="100%" stop-color="#0277bd"/>
    </linearGradient>
    <linearGradient id="gmGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <filter id="gmDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0277bd" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#gmBadgeBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#29b6f6" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Ondes radio -->
  <circle cx="256" cy="190" r="140" fill="none" stroke="#29b6f6" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="256" cy="190" r="170" fill="none" stroke="#29b6f6" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Emblème central -->
  <g filter="url(#gmDrop)">
    <circle cx="256" cy="180" r="75" fill="#08182b" stroke="#ffffff" stroke-opacity="0.2" stroke-width="4"/>
    <!-- Drapeau Gambien stylisé en rond -->
    <clipPath id="circleClip">
      <circle cx="256" cy="180" r="68"/>
    </clipPath>
    <g clip-path="url(#circleClip)">
      <rect x="180" y="112" width="152" height="45" fill="url(#gmRed)"/>
      <rect x="180" y="157" width="152" height="8" fill="#ffffff"/>
      <rect x="180" y="165" width="152" height="30" fill="url(#gmBlue)"/>
      <rect x="180" y="195" width="152" height="8" fill="#ffffff"/>
      <rect x="180" y="203" width="152" height="45" fill="url(#gmGreen)"/>
    </g>
  </g>

  <!-- Titre GAMBIA RADIO -->
  <text x="256" y="295" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30" text-anchor="middle" letter-spacing="3">GAMBIA RADIO</text>
  <text x="256" y="325" fill="#81d4fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="3">THE SMILING COAST OF AFRICA</text>

  <!-- Badge National FM -->
  <rect x="166" y="350" width="180" height="46" rx="23" fill="url(#gmBlue)"/>
  <text x="256" y="381" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="2">FM &amp; LIVE</text>

  <!-- Ville / Pays -->
  <text x="256" y="435" fill="#a5d6a7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" text-anchor="middle" letter-spacing="2">BANJUL • THE GAMBIA 🇬🇲</text>
</svg>
