<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="hayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240c08"/>
      <stop offset="50%" stop-color="#42160e"/>
      <stop offset="100%" stop-color="#140604"/>
    </linearGradient>
    <linearGradient id="hayCoral" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E76F51"/>
      <stop offset="50%" stop-color="#F4A261"/>
      <stop offset="100%" stop-color="#FFD100"/>
    </linearGradient>
    <filter id="hayShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#hayBg)" stroke="#E76F51" stroke-width="3" filter="url(#hayShadow)"/>

  <!-- Battement de vie / Al Hayet (الحياة) -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#30100a" stroke="#E76F51" stroke-width="2"/>
    <path d="M -14 0 L -8 0 L -4 -10 L 0 10 L 4 -6 L 8 0 L 14 0" fill="none" stroke="#FFD100" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Titre ALHAYET FM -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="2" text-anchor="middle" filter="url(#hayShadow)">ALHAYET FM</text>

  <!-- Tag إذاعة الحياة -->
  <rect x="36" y="116" width="128" height="26" rx="8" fill="url(#hayCoral)"/>
  <text x="100" y="134" fill="#240C08" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.2" text-anchor="middle">صوت الحياة • KAIROUAN</text>

  <!-- Pied TUNISIE -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#1c0906" stroke="#E76F51" stroke-width="1.2"/>
  <text x="100" y="171" fill="#F4A261" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">SANTÉ &amp; SOCIÉTÉ</text>
</svg>

