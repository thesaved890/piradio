  <text x="100" y="132" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="900" fill="#ffd700" letter-spacing="1" text-anchor="middle">ZODIAK BROADCASTING</text>
  <!-- Banner -->
  <rect x="18" y="146" width="164" height="36" rx="10" fill="#1a0c02" stroke="url(#zbsSun)" stroke-width="1.5"/>
  <text x="100" y="163" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">ZODIAK MALAWİ</text>
  <text x="100" y="176" font-family="system-ui,-apple-system,sans-serif" font-size="8.5" font-weight="700" fill="#ff9100" letter-spacing="1.2" text-anchor="middle">TOP NEWS &amp; ENTERTAINMENT</text>
