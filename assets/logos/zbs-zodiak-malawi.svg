  <circle cx="100" cy="80" r="22" fill="url(#zbsSun)"/>
  <text x="100" y="88" font-family="system-ui,-apple-system,sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">ZBS</text>
  <!-- Radiating Rays -->
  <g stroke="url(#zbsSun)" stroke-width="3" stroke-linecap="round">
    <line x1="100" y1="50" x2="100" y2="42"/>
    <line x1="100" y1="110" x2="100" y2="118"/>
    <line x1="70" y1="80" x2="62" y2="80"/>
    <line x1="130" y1="80" x2="138" y2="80"/>
    <line x1="78" y1="58" x2="72" y2="52"/>
    <line x1="122" y1="102" x2="128" y2="108"/>
