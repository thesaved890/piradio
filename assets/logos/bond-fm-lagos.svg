<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bondBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A237E"/>
      <stop offset="50%" stop-color="#283593"/>
      <stop offset="100%" stop-color="#0D133D"/>
    </linearGradient>
    <linearGradient id="bondGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F3B43F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bondBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#bondGold)" stroke-width="4" stroke-opacity="0.85"/>

  <!-- Frequency Pill -->
  <g transform="translate(156, 65)">
    <rect width="200" height="46" rx="23" fill="url(#bondGold)"/>
    <text x="100" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" fill="#1A237E" text-anchor="middle" letter-spacing="2">92.9 FM</text>
  </g>

  <!-- Big BOND FM Typography -->
  <text x="256" y="215" font-family="'Impact', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="96" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">BOND FM</text>
  <text x="256" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#bondGold)" text-anchor="middle" letter-spacing="8">LAGOS</text>

  <!-- Slogan -->
  <text x="256" y="348" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" fill="#C5CAE9" text-anchor="middle" letter-spacing="3">GRASSROOTS BROADCASTING</text>
  <text x="256" y="388" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" fill="#E8EAF6" text-anchor="middle" letter-spacing="2">YORUBA • IGBO • HAUSA • PIDGIN</text>

  <!-- Live Tag -->
  <g transform="translate(146, 422)">
    <rect width="220" height="40" rx="20" fill="#003318" stroke="url(#bondGold)" stroke-width="2"/>
    <text x="110" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#00E676" text-anchor="middle" letter-spacing="3">🇳🇬 FRCN LAGOS LIVE</text>
  </g>
</svg>

