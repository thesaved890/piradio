<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgCulture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24102c"/>
      <stop offset="50%" stop-color="#451859"/>
      <stop offset="100%" stop-color="#190920"/>
    </linearGradient>
    <linearGradient id="purpleCulture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CE93D8"/>
      <stop offset="100%" stop-color="#8E24AA"/>
    </linearGradient>
    <linearGradient id="goldCult" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgCulture)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#purpleCulture)" stroke-width="2" opacity="0.8"/>

  <!-- En-tête Radio Algérie -->
  <text x="100" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="url(#goldCult)" text-anchor="middle" letter-spacing="2">RADIO ALGÉRIE</text>

  <!-- Symbole Lyre / Culture et Plume -->
  <g transform="translate(100, 80)">
    <circle cx="0" cy="0" r="38" fill="#1b0824" stroke="url(#purpleCulture)" stroke-width="2.5"/>
    <!-- Lyre stylisée -->
    <path d="M -16,-18 C -16,10 -10,20 0,22 C 10,20 16,10 16,-18" fill="none" stroke="url(#goldCult)" stroke-width="2.5"/>
    <line x1="-16" y1="-18" x2="16" y2="-18" stroke="url(#goldCult)" stroke-width="3"/>
    <line x1="-8" y1="-18" x2="-8" y2="18" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
    <line x1="0" y1="-18" x2="0" y2="20" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
    <line x1="8" y1="-18" x2="8" y2="18" stroke="#FFFFFF" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- Texte Culture -->
  <text x="100" y="136" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CULTURE</text>
  <text x="100" y="154" font-family="'Amiri', 'Traditional Arabic', serif" font-size="15" font-weight="bold" fill="url(#goldCult)" text-anchor="middle">إذاعة الثقافة</text>

  <!-- Cartouche inférieur -->
  <rect x="25" y="164" width="150" height="24" rx="8" fill="url(#purpleCulture)"/>
  <text x="100" y="180" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ARTS • HISTOIRE • DÉBATS</text>
</svg>