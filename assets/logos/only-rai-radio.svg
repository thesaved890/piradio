<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="raiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140326"/>
      <stop offset="50%" stop-color="#2a084d"/>
      <stop offset="100%" stop-color="#0a0114"/>
    </linearGradient>
    <linearGradient id="raiNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7209B7"/>
      <stop offset="50%" stop-color="#B5179E"/>
      <stop offset="100%" stop-color="#FFD100"/>
    </linearGradient>
    
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#raiBg)" stroke="url(#raiNeon)" stroke-width="3"/>

  <!-- Égaliseur / micro Raï -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#3c096c" stroke="#FFD100" stroke-width="2"/>
    <rect x="-12" y="-6" width="5" height="12" rx="2.5" fill="#FFD100"/>
    <rect x="-3" y="-12" width="5" height="24" rx="2.5" fill="#FF4D6D"/>
    <rect x="6" y="-8" width="5" height="16" rx="2.5" fill="#FFD100"/>
  </g>

  <!-- Titre ONLY RAÏ -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="23" letter-spacing="2" text-anchor="middle">ONLY RAÏ</text>

  <!-- Tag 100% RAÏ MAGHREB -->
  <rect x="34" y="116" width="132" height="26" rx="8" fill="url(#raiNeon)"/>
  <text x="100" y="134" fill="#0A0114" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.5" text-anchor="middle">100% RAÏ LIVE</text>

  <!-- Pied MAROC -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#1b0630" stroke="#FFD100" stroke-width="1.2"/>
  <text x="100" y="171" fill="#FFD100" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">LES HITS DU RAÏ</text>
</svg>