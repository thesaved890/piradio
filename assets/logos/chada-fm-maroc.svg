<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="chadaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18042b"/>
      <stop offset="50%" stop-color="#2d0a4e"/>
      <stop offset="100%" stop-color="#0c0217"/>
    </linearGradient>
    <linearGradient id="chadaNeon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9D4EDD"/>
      <stop offset="50%" stop-color="#C77DFF"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#chadaBg)" stroke="url(#chadaNeon)" stroke-width="3"/>

  <!-- Note de musique &amp; fleur stylisée (Chada = parfum/arôme) -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#24073d" stroke="#C77DFF" stroke-width="2"/>
    <circle cx="-6" cy="6" r="5" fill="#FF007F"/>
    <circle cx="6" cy="2" r="5" fill="#FF007F"/>
    <path d="M -1 6 L -1 -10 L 11 -14 L 11 2" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
  </g>

  <!-- Titre CHADA FM -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="23" letter-spacing="2" text-anchor="middle">CHADA FM</text>

  <!-- Tag 100% MAROCAIN -->
  <rect x="36" y="116" width="128" height="26" rx="8" fill="url(#chadaNeon)"/>
  <text x="100" y="134" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.5" text-anchor="middle">100% MAROCAIN</text>

  <!-- Pied MAROC -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#1b0630" stroke="#FF007F" stroke-width="1.2"/>
  <text x="100" y="171" fill="#C77DFF" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">MUSIQUE &amp; ÉVASION</text>
</svg>