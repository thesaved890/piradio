<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="yfmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#1c1a00"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="yfmYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFF00"/>
      <stop offset="50%" stop-color="#FFD600"/>
      <stop offset="100%" stop-color="#FFAB00"/>
    </linearGradient>
    
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#yfmBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#yfmYellow)" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Logo YFM Noir &amp; Jaune néon -->
  <g transform="translate(256, 185)">
    <circle cx="0" cy="0" r="62" fill="url(#yfmYellow)"/>
    <circle cx="0" cy="0" r="54" fill="#000000"/>
    <text x="0" y="24" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="url(#yfmYellow)" text-anchor="middle" font-style="italic">Y</text>
  </g>

  <!-- Badge 107.9 FM Accra -->
  <g transform="translate(256, 285)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="url(#yfmYellow)"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="2">107.9 FM • ACCRA</text>
  </g>

  <!-- Titre Principal YFM GHANA -->
  <text x="256" y="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">YFM GHANA</text>

  <!-- Sous-titre For The Young &amp; Young At Heart -->
  <text x="256" y="395" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="url(#yfmYellow)" text-anchor="middle" letter-spacing="3">FOR THE YOUNG AT HEART</text>

  <!-- Drapeau ghanéen miniature en bas -->
  <g transform="translate(256, 430)">
    <rect x="-18" y="-7" width="36" height="5" fill="#CE1126" rx="1"/>
    <rect x="-18" y="-2" width="36" height="5" fill="#FCD116"/>
    <polygon points="0,-2 1.5,0.5 4,0.5 2,2 2.5,4.5 0,3 -2.5,4.5 -2,2 -4,0.5 -1.5,0.5" fill="#000000"/>
    <rect x="-18" y="3" width="36" height="5" fill="#006B3F" rx="1"/>
    <rect x="-18" y="-7" width="36" height="15" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" rx="2"/>
  </g>
</svg>