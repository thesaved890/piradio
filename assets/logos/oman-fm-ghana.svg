<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="omBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1226"/>
      <stop offset="50%" stop-color="#122045"/>
      <stop offset="100%" stop-color="#050a17"/>
    </linearGradient>
    <linearGradient id="omGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#omBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#omGold)" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Logo OMAN FM -->
  <g transform="translate(256, 185)">
    <rect x="-95" y="-50" width="190" height="100" rx="20" fill="#122045" stroke="url(#omGold)" stroke-width="3"/>
    <text x="0" y="20" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="url(#omGold)" text-anchor="middle" letter-spacing="3">OMAN</text>
  </g>

  <!-- Badge 107.1 FM Kencity Media -->
  <g transform="translate(256, 285)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="url(#omGold)"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#0a1226" text-anchor="middle" letter-spacing="2">107.1 FM • ACCRA</text>
  </g>

  <!-- Titre Principal OMAN FM -->
  <text x="256" y="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">OMAN 107.1 FM</text>

  <!-- Sous-titre Kencity Media -->
  <text x="256" y="395" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="url(#omGold)" text-anchor="middle" letter-spacing="3">THE VOICE OF THE NATION</text>

  <!-- Drapeau ghanéen miniature en bas -->
  <g transform="translate(256, 430)">
    <rect x="-18" y="-7" width="36" height="5" fill="#CE1126" rx="1"/>
    <rect x="-18" y="-2" width="36" height="5" fill="#FCD116"/>
    <polygon points="0,-2 1.5,0.5 4,0.5 2,2 2.5,4.5 0,3 -2.5,4.5 -2,2 -4,0.5 -1.5,0.5" fill="#000000"/>
    <rect x="-18" y="3" width="36" height="5" fill="#006B3F" rx="1"/>
    <rect x="-18" y="-7" width="36" height="15" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" rx="2"/>
  </g>
</svg>