<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="slBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1728"/>
      <stop offset="50%" stop-color="#09221d"/>
      <stop offset="100%" stop-color="#05141e"/>
    </linearGradient>
    <linearGradient id="slRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1eb53a"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#0072c6"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#slBg)"/>
  <circle cx="100" cy="90" r="66" fill="none" stroke="url(#slRing)" stroke-width="3" opacity="0.85"/>
  <circle cx="100" cy="90" r="58" fill="#0a1728"/>
  <!-- Sierra Leone Tricolor (Green, White, Light Blue) -->
  <g clip-path="url(#slFlagClip)">
    <clipPath id="slFlagClip">
      <circle cx="100" cy="90" r="54"/>
    </clipPath>
    <rect x="40" y="36" width="120" height="36" fill="#1eb53a"/>
    <rect x="40" y="72" width="120" height="36" fill="#ffffff"/>
    <rect x="40" y="108" width="120" height="36" fill="#0072c6"/>
    <!-- Radio Tower in center -->
    <path d="M 98 62 L 102 62 L 108 114 L 92 114 Z" fill="#0e2338" opacity="0.85"/>
    <circle cx="100" cy="60" r="4" fill="#ffd700"/>
    <!-- Radiating Waves -->
    <path d="M 88 56 A 14 14 0 0 0 88 64" fill="none" stroke="#0072c6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 112 56 A 14 14 0 0 1 112 64" fill="none" stroke="#0072c6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 82 50 A 22 22 0 0 0 82 70" fill="none" stroke="#1eb53a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 118 50 A 22 22 0 0 1 118 70" fill="none" stroke="#1eb53a" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Bottom Ribbon / Label -->
  <rect x="18" y="152" width="164" height="32" rx="10" fill="#0c1d2e" stroke="url(#slRing)" stroke-width="1.5"/>
  <text x="100" y="173" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="1.2" text-anchor="middle">SIERRA LEONE 🇸🇱</text>
</svg>