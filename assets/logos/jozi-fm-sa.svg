<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgJozi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e05"/>
      <stop offset="50%" stop-color="#3b1d09"/>
      <stop offset="100%" stop-color="#140902"/>
    </linearGradient>
    <linearGradient id="orangeJozi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="50%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="goldJozi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgJozi)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#orangeJozi)" stroke-width="2.5" opacity="0.85"/>

  <!-- Logo Jozi FM Soweto & Tours d'Orlando stylisées -->
  <g transform="translate(100, 68)">
    <circle cx="0" cy="0" r="38" fill="#291204" stroke="url(#orangeJozi)" stroke-width="2"/>
    <!-- Tours de refroidissement d'Orlando à Soweto stylisées -->
    <path d="M -16,16 C -14,-6 -8,-16 -6,-16 L -2,-16 C 0,-16 6,-6 8,16 Z" fill="url(#orangeJozi)"/>
    <path d="M -4,16 C -2,-6 4,-16 6,-16 L 10,-16 C 12,-16 18,-6 20,16 Z" fill="url(#goldJozi)"/>
    <text x="-6" y="22" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF">105.8</text>
  </g>

  <!-- Titre JOZI FM -->
  <text x="100" y="128" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">JOZI FM</text>
  <text x="100" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="url(#goldJozi)" text-anchor="middle" letter-spacing="2">MORE THAN JUST RADIO</text>

  <!-- Cartouche Soweto & Joburg -->
  <rect x="20" y="158" width="160" height="26" rx="8" fill="url(#orangeJozi)"/>
  <text x="100" y="175" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SOWETO • GAUTENG</text>
</svg>
