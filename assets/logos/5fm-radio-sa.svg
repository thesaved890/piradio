<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg5fm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a1c"/>
      <stop offset="50%" stop-color="#2a0f3d"/>
      <stop offset="100%" stop-color="#0f0717"/>
    </linearGradient>
    <linearGradient id="neon5fm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E040FB"/>
      <stop offset="100%" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="cyan5fm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00B0FF"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bg5fm)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#neon5fm)" stroke-width="2.5" opacity="0.85"/>

  <!-- Logo 5FM emblématique -->
  <g transform="translate(100, 72)">
    <!-- Grand chiffre 5 stylisé -->
    <circle cx="0" cy="0" r="42" fill="#1d0a2c" stroke="url(#cyan5fm)" stroke-width="2.5"/>
    <text x="-12" y="18" font-family="'Arial Black', Impact, sans-serif" font-size="52" font-weight="900" fill="url(#cyan5fm)" text-anchor="middle">5</text>
    <!-- Badge FM néon -->
    <rect x="10" y="-14" width="30" height="28" rx="6" fill="url(#neon5fm)"/>
    <text x="25" y="6" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">FM</text>
  </g>

  <!-- Tagline LIVE LOUD -->
  <text x="100" y="136" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">LIVE LOUD</text>
  <text x="100" y="152" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="url(#neon5fm)" text-anchor="middle" letter-spacing="2">YOUTH • DANCE • POP</text>

  <!-- Cartouche SABC -->
  <rect x="25" y="160" width="150" height="25" rx="8" fill="url(#neon5fm)"/>
  <text x="100" y="176" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">🇿🇦 SABC • SOUTH AFRICA</text>
</svg>