<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="lgfTalkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c172b"/>
      <stop offset="50%" stop-color="#16294d"/>
      <stop offset="100%" stop-color="#060c18"/>
    </linearGradient>
    <linearGradient id="lgfTalkRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D90429"/>
      <stop offset="50%" stop-color="#EF233C"/>
      <stop offset="100%" stop-color="#FF4D6D"/>
    </linearGradient>
    
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#lgfTalkBg)" stroke="url(#lgfTalkRed)" stroke-width="3"/>

  <!-- Bulle de dialogue et micro -->
  <g transform="translate(100, 52)">
    <path d="M -24 -18 L 24 -18 Q 30 -18 30 -12 L 30 10 Q 30 16 24 16 L 4 16 L -6 24 L -6 16 L -24 16 Q -30 16 -30 10 L -30 -12 Q -30 -18 -24 -18 Z" fill="url(#lgfTalkRed)"/>
    <!-- Icône micro stylisé blanc -->
    <rect x="-4" y="-10" width="8" height="14" rx="4" fill="#FFFFFF"/>
    <path d="M -7 -3 Q -7 7 0 7 Q 7 7 7 -3" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="7" x2="0" y2="11" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="-4" y1="11" x2="4" y2="11" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Titre LGF TALK -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="23" letter-spacing="2" text-anchor="middle">LGF TALK</text>

  <!-- Tag DÉBATS &amp; INFOS -->
  <rect x="40" y="116" width="120" height="26" rx="8" fill="#1D3557" stroke="url(#lgfTalkRed)" stroke-width="1.5"/>
  <text x="100" y="134" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.5" text-anchor="middle">GUINÉE • INFOS</text>

  <!-- Pied de badge -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#0d1b33" stroke="url(#lgfTalkRed)" stroke-width="1.2"/>
  <text x="100" y="171" fill="#EF233C" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">DÉBATS &amp; SOCIÉTÉ</text>
</svg>