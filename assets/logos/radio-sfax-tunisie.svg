    <path d="M -12 12 L -12 -2 C -12 -12 12 -12 12 -2 L 12 12 Z" fill="none" stroke="#FFD100" stroke-width="2.5"/>
    <circle cx="0" cy="-2" r="3" fill="#00A896"/>
  </g>

  <!-- Titre RADIO SFAX -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="2" text-anchor="middle">RADIO SFAX</text>

