<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="mosBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1224"/>
      <stop offset="50%" stop-color="#142142"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="mosYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    <filter id="mosShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#mosBg)" stroke="url(#mosYellow)" stroke-width="3" filter="url(#mosShadow)"/>

  <!-- Logo Mosaïque stylisé avec mosaïque de couleurs -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#0f1d38" stroke="url(#mosYellow)" stroke-width="2"/>
    <!-- Éléments de mosaïque géométrique -->
    <rect x="-10" y="-10" width="8" height="8" rx="2" fill="#FFD100"/>
    <rect x="2" y="-10" width="8" height="8" rx="2" fill="#FF6F00"/>
    <rect x="-10" y="2" width="8" height="8" rx="2" fill="#E70013"/>
    <rect x="2" y="2" width="8" height="8" rx="2" fill="#00A896"/>
  </g>

  <!-- Titre MOSAÏQUE FM -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="2" text-anchor="middle" filter="url(#mosShadow)">MOSAÏQUE FM</text>

  <!-- Tag RADIO N°1 EN TUNISIE -->
  <rect x="34" y="116" width="132" height="26" rx="8" fill="url(#mosYellow)"/>
  <text x="100" y="134" fill="#0A1224" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.2" text-anchor="middle">94.9 FM • RADIO N°1</text>

  <!-- Pied TUNISIE -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#0c172e" stroke="url(#mosYellow)" stroke-width="1.2"/>
  <text x="100" y="171" fill="#FFD100" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">TUNIS • GRAND TUNIS</text>
</svg>

