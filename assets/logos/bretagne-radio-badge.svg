<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bzhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="50%" stop-color="#18202c"/>
      <stop offset="100%" stop-color="#0a0d13"/>
    </linearGradient>
    <linearGradient id="bzhGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="bzhDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#bzhBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Ondes radio -->
  <circle cx="256" cy="190" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  <circle cx="256" cy="190" r="170" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2"/>

  <!-- Emblème central Gwenn ha Du & Triskell -->
  <g filter="url(#bzhDrop)">
    <circle cx="256" cy="180" r="76" fill="#111620" stroke="url(#bzhGold)" stroke-width="4"/>
    <!-- Triskell celte stylisé doré -->
    <g fill="none" stroke="url(#bzhGold)" stroke-width="6" stroke-linecap="round">
      <path d="M 256 180 A 18 18 0 0 1 270 160 A 18 18 0 1 0 240 148"/>
      <path d="M 256 180 A 18 18 0 0 1 245 198 A 18 18 0 1 0 220 205"/>
      <path d="M 256 180 A 18 18 0 0 1 262 195 A 18 18 0 1 0 286 198"/>
    </g>
    <!-- Hermine centrale miniature -->
    <circle cx="256" cy="180" r="4" fill="#ffffff"/>
  </g>

  <!-- Titre BRETAGNE • BREIZH -->
  <text x="256" y="295" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="30" text-anchor="middle" letter-spacing="3">RADIOS DE BRETAGNE</text>
  <text x="256" y="325" fill="#90caf9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="15" text-anchor="middle" letter-spacing="4">BREIZH • BZH • FRANCE</text>

  <!-- Badge Régional FM -->
  <rect x="166" y="350" width="180" height="46" rx="23" fill="url(#bzhGold)"/>
  <text x="256" y="381" fill="#0f141c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="2">FM &amp; DIRECT</text>

  <!-- Villes phares -->
  <text x="256" y="435" fill="#e0e0e0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="2">RENNES • BREST • QUIMPER • VANNES</text>
</svg>

