<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="wcr1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021526"/>
      <stop offset="50%" stop-color="#072a4a"/>
      <stop offset="100%" stop-color="#02101e"/>
    </linearGradient>
    <linearGradient id="wcr1Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    <linearGradient id="wcr1Cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29b6f6"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
    <filter id="wcr1Drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#wcr1Bg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#29b6f6" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Ondes radio côtières -->
  <g fill="none" stroke="url(#wcr1Cyan)" stroke-linecap="round" opacity="0.6">
    <path d="M 130 170 A 140 140 0 0 1 382 170" stroke-width="3" stroke-dasharray="6 8"/>
    <path d="M 160 180 A 105 105 0 0 1 352 180" stroke-width="4"/>
    <path d="M 195 190 A 70 70 0 0 1 317 190" stroke-width="5"/>
  </g>

  <!-- Emblème central WEST COAST RADIO 1 -->
  <g filter="url(#wcr1Drop)" transform="translate(256, 185)">
    <circle cx="0" cy="0" r="76" fill="#031b30" stroke="url(#wcr1Gold)" stroke-width="5"/>
    <!-- Vague &amp; Soleil stylisé -->
    <path d="M -45 15 Q -20 -15 0 10 Q 20 -15 45 15 L 45 35 L -45 35 Z" fill="url(#wcr1Cyan)" opacity="0.85"/>
    <circle cx="0" cy="-22" r="20" fill="url(#wcr1Gold)"/>
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">WCR 1</text>
  </g>

  <!-- Badge Fréquence 92.1 FM -->
  <g transform="translate(256, 290)">
    <rect x="-110" y="-18" width="220" height="38" rx="19" fill="url(#wcr1Gold)" filter="url(#wcr1Drop)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="900" fill="#021526" text-anchor="middle" letter-spacing="1">92.1 FM</text>
  </g>

  <!-- Titre Principal WEST COAST RADIO -->
  <text x="256" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">WEST COAST RADIO 1</text>

  <!-- Sous-titre News, Talk &amp; Coffee Time -->
  <text x="256" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#81d4fa" text-anchor="middle" letter-spacing="3">NEWS, TALK &amp; CURRENT AFFAIRS</text>

  <!-- Drapeau gambien miniature et ville -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffd54f" text-anchor="middle" letter-spacing="2">BANJUL • THE GAMBIA 🇬🇲</text>
</svg>

