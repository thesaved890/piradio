<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="biziBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091b24"/>
      <stop offset="50%" stop-color="#102e3d"/>
      <stop offset="100%" stop-color="#040d12"/>
    </linearGradient>
    <linearGradient id="biziCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>
    <linearGradient id="biziYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDE00"/>
      <stop offset="100%" stop-color="#FF9000"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#biziBg)"/>
  <rect width="194" height="194" x="3" y="3" rx="33" fill="none" stroke="url(#biziCyan)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- BZ Monogram &amp; Globe waves -->
  <circle cx="100" cy="74" r="38" fill="#07151c" stroke="url(#biziYellow)" stroke-width="2"/>
  <text x="100" y="84" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="28" letter-spacing="3" text-anchor="middle">BZ</text>

  <text x="100" y="130" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="20" letter-spacing="1.5" text-anchor="middle">BIZI INTER</text>
  <text x="100" y="148" fill="url(#biziCyan)" font-family="'Inter', sans-serif" font-weight="800" font-size="12" letter-spacing="2" text-anchor="middle">GROUPE BZ • WEB</text>

  <rect x="36" y="166" width="128" height="20" rx="6" fill="#03090d" stroke="url(#biziCyan)" stroke-width="1.2"/>
  <text x="100" y="180" fill="#FFDE00" font-family="'Inter', sans-serif" font-weight="700" font-size="9" letter-spacing="1.5" text-anchor="middle">BURKINA &amp; DIASPORA</text>
</svg>
