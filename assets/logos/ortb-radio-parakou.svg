<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="opBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1105"/>
      <stop offset="50%" stop-color="#361f0a"/>
      <stop offset="100%" stop-color="#140a02"/>
    </linearGradient>
    <linearGradient id="opAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB74D"/>
      <stop offset="50%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="opGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="50%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#007E33"/>
    </linearGradient>
    <linearGradient id="opGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <radialGradient id="opGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FF9800" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF9800" stop-opacity="0"/>
    </radialGradient>
    
  </defs>

  <!-- Fond circulaire et lueur -->
  <circle cx="256" cy="256" r="240" fill="url(#opBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#opAmber)" stroke-width="3" stroke-opacity="0.8"/>
  <circle cx="256" cy="190" r="170" fill="url(#opGlow)"/>

  <!-- Ondes radio -->
  <g fill="none" stroke="url(#opAmber)" stroke-linecap="round" opacity="0.8">
    <path d="M 140 170 A 130 130 0 0 1 372 170" stroke-width="3" stroke-dasharray="6 8"/>
    <path d="M 170 180 A 100 100 0 0 1 342 180" stroke-width="4"/>
    <path d="M 200 190 A 70 70 0 0 1 312 190" stroke-width="5"/>
  </g>

  <!-- Logo stylisé ORTB Parakou -->
  <g transform="translate(256, 185)">
    <!-- Carte blanche pour clarté -->
    <rect x="-105" y="-55" width="210" height="110" rx="20" fill="#FFFFFF"/>
    <!-- Ruban ORTB -->
    <path d="M -80 0 C -80 -35 -40 -35 -20 -10 C 0 15 40 15 60 -10 C 70 -25 80 -25 80 -10" fill="none" stroke="url(#opGreen)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="65" cy="-12" r="7" fill="#E65100"/>
    <!-- Texte ORTB -->
    <text x="0" y="32" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="900" fill="#E65100" text-anchor="middle" letter-spacing="4">ortb</text>
  </g>

  <!-- Badge Fréquence 91.4 FM Parakou -->
  <g transform="translate(256, 285)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="url(#opAmber)"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">91.4 FM • PARAKOU</text>
  </g>

  <!-- Titre Principal -->
  <text x="256" y="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">RADIO PARAKOU</text>

  <!-- Sous-titre Région Borgou -->
  <text x="256" y="395" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="url(#opGold)" text-anchor="middle" letter-spacing="3">NORD BÉNIN • BORGOU</text>

  <!-- Drapeau béninois miniature en bas -->
  <g transform="translate(256, 430)">
    <rect x="-18" y="-7" width="12" height="14" fill="#008751" rx="2"/>
    <rect x="-6" y="-7" width="24" height="7" fill="#FCD116" rx="1"/>
    <rect x="-6" y="0" width="24" height="7" fill="#E8112D" rx="1"/>
    <rect x="-18" y="-7" width="36" height="14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" rx="2"/>
  </g>
</svg>