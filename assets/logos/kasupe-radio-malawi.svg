<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="ksBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c24"/>
      <stop offset="50%" stop-color="#0a3645"/>
      <stop offset="100%" stop-color="#031117"/>
    </linearGradient>
    <linearGradient id="ksWater" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#ksBg)"/>
  <circle cx="100" cy="84" r="58" fill="none" stroke="url(#ksWater)" stroke-width="2"/>
  <!-- Kasupe (Spring/Fountain) Water Droplet &amp; Waves -->
  <path d="M 100 56 C 90 72, 80 82, 80 94 A 20 20 0 0 0 120 94 C 120 82, 110 72, 100 56 Z" fill="url(#ksWater)"/>
  <circle cx="100" cy="94" r="8" fill="#ffffff" opacity="0.8"/>
