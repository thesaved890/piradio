  <ellipse cx="100" cy="112" rx="30" ry="6" fill="none" stroke="#00e5ff" stroke-width="2"/>
  <ellipse cx="100" cy="118" rx="42" ry="7" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.6"/>
  <text x="100" y="132" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">KASUPE</text>
  <!-- Banner -->
  <rect x="18" y="146" width="164" height="36" rx="10" fill="#03141a" stroke="url(#ksWater)" stroke-width="1.5"/>
  <text x="100" y="163" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">KASUPE RADIO</text>
  <text x="100" y="176" font-family="system-ui,-apple-system,sans-serif" font-size="8.5" font-weight="700" fill="#00e5ff" letter-spacing="1.2" text-anchor="middle">THE LIVING SPRING • MALAWI</text>
</svg>