<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="medi1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#122b54"/>
      <stop offset="100%" stop-color="#071224"/>
    </linearGradient>
    <linearGradient id="medi1Cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A3E0"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FFD100"/>
    </linearGradient>
    <filter id="medi1Shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#medi1Bg)" stroke="#00A3E0" stroke-width="3" filter="url(#medi1Shadow)"/>

  <!-- Logo stylisé MEDI 1 avec l'arche méditerranéenne -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="24" fill="#0c2344" stroke="#00A3E0" stroke-width="2"/>
    <path d="M -16 8 Q 0 -16 16 8" fill="none" stroke="#FFD100" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="0" cy="-6" r="4" fill="#38BDF8"/>
  </g>

  <!-- Titre MEDI 1 -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="26" letter-spacing="2.5" text-anchor="middle" filter="url(#medi1Shadow)">MEDI 1</text>

  <!-- Tag RADIO DU GRAND MAGHREB -->
  <rect x="32" y="116" width="136" height="26" rx="8" fill="url(#medi1Cyan)"/>
  <text x="100" y="134" fill="#0A192F" font-family="'Inter', sans-serif" font-weight="900" font-size="11.5" letter-spacing="1.2" text-anchor="middle">RADIO INTERNATIONALE</text>

  <!-- Cartouche Tanger • Rabat • Casablanca -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#091b33" stroke="#00A3E0" stroke-width="1.2"/>
  <text x="100" y="171" fill="#38BDF8" font-family="'Inter', sans-serif" font-weight="800" font-size="10.5" letter-spacing="1.8" text-anchor="middle">TANGER • MAROC</text>
</svg>
