<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bfDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180709"/>
      <stop offset="50%" stop-color="#1e0c10"/>
      <stop offset="100%" stop-color="#07140a"/>
    </linearGradient>
    <linearGradient id="bfRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2B3E"/>
      <stop offset="100%" stop-color="#E01E2E"/>
    </linearGradient>
    <linearGradient id="bfGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#009E49"/>
    </linearGradient>
    <linearGradient id="bfGoldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="50%" stop-color="#FFD100"/>
      <stop offset="100%" stop-color="#D49B00"/>
    </linearGradient>
    <filter id="bfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="200" height="200" rx="36" fill="url(#bfDarkBg)"/>
  <rect width="194" height="194" x="3" y="3" rx="33" fill="none" stroke="url(#bfGoldGlow)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Subtle Burkina 2-color horizontal flag background -->
  <g opacity="0.3">
    <rect x="22" y="24" width="156" height="74" rx="8" fill="url(#bfRedGrad)"/>
    <rect x="22" y="102" width="156" height="74" rx="8" fill="url(#bfGreenGrad)"/>
  </g>

  <!-- Inner Dark Glass Circle -->
  <circle cx="100" cy="95" r="62" fill="#0d0f0e" stroke="url(#bfGoldGlow)" stroke-width="2" filter="url(#bfGlow)"/>

  <!-- Signal Waves (Red left, Green right) -->
  <path d="M 68 80 A 42 42 0 0 1 68 110" fill="none" stroke="url(#bfRedGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 58 72 A 56 56 0 0 1 58 118" fill="none" stroke="url(#bfRedGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>
  <path d="M 132 80 A 42 42 0 0 0 132 110" fill="none" stroke="url(#bfGreenGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 142 72 A 56 56 0 0 0 142 118" fill="none" stroke="url(#bfGreenGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>

  <!-- Golden Pi Symbol π -->
  <g transform="translate(100, 92) scale(1.15)">
    <!-- Pi top bar -->
    <path d="M -22 -14 C -20 -18, -12 -18, 0 -18 C 12 -18, 20 -18, 22 -14 C 23 -11, 20 -11, 16 -13 C 10 -15, -10 -15, -16 -13 C -20 -11, -23 -11, -22 -14 Z" fill="url(#bfGoldGlow)"/>
    <!-- Pi legs -->
    <path d="M -12 -14 C -12 0, -14 10, -18 16 C -20 18, -17 20, -14 18 C -10 13, -7 0, -6 -14 Z" fill="url(#bfGoldGlow)"/>
    <path d="M 7 -14 L 7 12 C 7 17, 10 19, 14 19 C 17 19, 18 17, 16 16 C 13 16, 12 14, 12 11 L 12 -14 Z" fill="url(#bfGoldGlow)"/>
  </g>

  <!-- Yellow 5-pointed Star of Burkina Faso ★ at top -->
  <polygon points="100,48 103,57 112,57 105,62 108,71 100,66 92,71 95,62 88,57 97,57" fill="#FFD100" filter="url(#bfGlow)"/>

  <!-- Banner Bottom -->
  <rect x="22" y="152" width="156" height="30" rx="8" fill="#070c08" stroke="url(#bfGoldGlow)" stroke-width="1.5"/>
  <text x="100" y="172" fill="#FFD100" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="2" text-anchor="middle">BURKINA FASO</text>
</svg>
