<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="glBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A001A"/>
      <stop offset="50%" stop-color="#3D003D"/>
      <stop offset="100%" stop-color="#0F000F"/>
    </linearGradient>
    <linearGradient id="glPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4081"/>
      <stop offset="100%" stop-color="#C51162"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F3B43F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#glBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.85"/>

  <!-- Heart / Cross Motif -->
  <g transform="translate(256, 160)">
    <circle cx="0" cy="0" r="65" fill="#290029" stroke="url(#glPink)" stroke-width="4"/>
    <text x="0" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="url(#gold)" text-anchor="middle">💖</text>
  </g>

  <!-- Big GL RADIO Typography -->
  <text x="256" y="275" font-family="'Impact', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="78" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">GL RADIO</text>
  <text x="256" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" fill="url(#glPink)" text-anchor="middle" letter-spacing="6">GOD'S LOVE LINE</text>

  <!-- Slogan & Country -->
  <text x="256" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#F8BBD0" text-anchor="middle" letter-spacing="3">GOSPEL JAMBOREE</text>
  <text x="256" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#FCE4EC" text-anchor="middle" letter-spacing="2">KOUMÉ • CAMEROUN</text>

  <!-- Live Tag -->
  <g transform="translate(146, 430)">
    <rect width="220" height="38" rx="19" fill="#003318" stroke="url(#gold)" stroke-width="2"/>
    <text x="110" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" fill="#00E676" text-anchor="middle" letter-spacing="3">🇨🇲 GOSPEL 24/7</text>
  </g>
</svg>

