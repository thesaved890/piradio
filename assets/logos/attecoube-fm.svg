<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="atBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a02"/>
      <stop offset="50%" stop-color="#291404"/>
      <stop offset="100%" stop-color="#0a0501"/>
    </linearGradient>
    <linearGradient id="atOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA040"/>
      <stop offset="50%" stop-color="#FF8200"/>
      <stop offset="100%" stop-color="#D65F00"/>
    </linearGradient>
    <filter id="atDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#atBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#atOrange)" stroke-width="3" stroke-opacity="0.8"/>

  <g filter="url(#atDrop)" transform="translate(256, 185)">
    <circle cx="0" cy="0" r="62" fill="url(#atOrange)"/>
    <circle cx="0" cy="0" r="54" fill="#140a02"/>
    <text x="0" y="16" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="url(#atOrange)" text-anchor="middle">AFM</text>
  </g>

  <!-- Badge Commune d'Attécoubé -->
  <g transform="translate(256, 285)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="url(#atOrange)" filter="url(#atDrop)"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#140a02" text-anchor="middle" letter-spacing="2">RADIO LOCALE</text>
  </g>

  <!-- Titre Principal ATTÉCOUBÉ FM -->
  <text x="256" y="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">ATTÉCOUBÉ FM</text>

  <!-- Sous-titre Abidjan Proximité -->
  <text x="256" y="395" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="url(#atOrange)" text-anchor="middle" letter-spacing="3">ABIDJAN • LA VOIX DE PROXIMITÉ</text>

  <!-- Drapeau ivoirien miniature en bas -->
  <g transform="translate(256, 430)">
    <rect x="-18" y="-7" width="12" height="14" fill="#FF8200" rx="2"/>
    <rect x="-6" y="-7" width="12" height="14" fill="#FFFFFF"/>
    <rect x="6" y="-7" width="12" height="14" fill="#009A44" rx="2"/>
    <rect x="-18" y="-7" width="36" height="14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" rx="2"/>
  </g>
</svg>
