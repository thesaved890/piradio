<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="fopBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a12"/>
      <stop offset="50%" stop-color="#0f3322"/>
      <stop offset="100%" stop-color="#05120c"/>
    </linearGradient>
    <linearGradient id="fopGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#16a085"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#fopBg)"/>
  <circle cx="100" cy="84" r="58" fill="none" stroke="url(#fopGreen)" stroke-width="2"/>
  <!-- FOP Letters &amp; Global Signal -->
  <text x="100" y="86" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="2" text-anchor="middle">FOP</text>
  <path d="M 60 84 A 40 40 0 0 1 140 84" fill="none" stroke="url(#fopGreen)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 70 84 A 30 30 0 0 1 130 84" fill="none" stroke="#ffd700" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="118" font-family="system-ui,-apple-system,sans-serif" font-size="10.5" font-weight="800" fill="#ffd700" letter-spacing="2" text-anchor="middle">SIERRA LEONE</text>
  <!-- Banner -->
  <rect x="20" y="146" width="160" height="36" rx="10" fill="#061f14" stroke="url(#fopGreen)" stroke-width="1.5"/>
  <text x="100" y="163" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">FOP RADIO</text>
  <text x="100" y="176" font-family="system-ui,-apple-system,sans-serif" font-size="8.5" font-weight="700" fill="#2ecc71" letter-spacing="1.2" text-anchor="middle">COMMUNITY BROADCAST</text>
</svg>