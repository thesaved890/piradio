<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="marsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240608"/>
      <stop offset="50%" stop-color="#400b0f"/>
      <stop offset="100%" stop-color="#140305"/>
    </linearGradient>
    <linearGradient id="marsRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="50%" stop-color="#FF4D6D"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <filter id="marsShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#marsBg)" stroke="url(#marsRed)" stroke-width="3" filter="url(#marsShadow)"/>

  <!-- Ballon de sport / planète Mars dynamique -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#E63946"/>
    <!-- Motif ballon de foot et ondes -->
    <polygon points="0,-10 8,-4 5,6 -5,6 -8,-4" fill="#FFFFFF"/>
    <path d="M 0 -10 L 0 -18 M 8 -4 L 16 -8 M 5 6 L 12 14 M -5 6 L -12 14 M -8 -4 L -16 -8" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- Titre RADIO MARS -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="23" letter-spacing="2" text-anchor="middle" filter="url(#marsShadow)">RADIO MARS</text>

  <!-- Tag 100% SPORT &amp; FOOTBALL -->
  <rect x="34" y="116" width="132" height="26" rx="8" fill="url(#marsRed)"/>
  <text x="100" y="134" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.5" text-anchor="middle">100% SPORT • 91.2 FM</text>

  <!-- Cartouche Maroc -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#1a0407" stroke="url(#marsRed)" stroke-width="1.2"/>
  <text x="100" y="171" fill="#FFA000" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">LE SPORT AU MAROC</text>
</svg>
