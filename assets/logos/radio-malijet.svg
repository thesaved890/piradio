<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="malijetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1728"/>
      <stop offset="50%" stop-color="#11223b"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="malijetRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2E4C"/>
      <stop offset="100%" stop-color="#D0021B"/>
    </linearGradient>
    <linearGradient id="malijetGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD200"/>
      <stop offset="100%" stop-color="#F7971E"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="36" fill="url(#malijetBg)"/>
  <rect width="194" height="194" x="3" y="3" rx="33" fill="none" stroke="url(#malijetRed)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Logo emblem: Jet wing / Mali colors -->
  <circle cx="100" cy="74" r="38" fill="#08101c" stroke="url(#malijetGold)" stroke-width="2"/>
  <path d="M 72 82 L 98 56 L 128 56 L 102 82 Z" fill="url(#malijetRed)"/>
  <path d="M 80 88 L 100 68 L 120 68 L 100 88 Z" fill="url(#malijetGold)"/>

  <!-- Title -->
  <text x="100" y="132" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="22" letter-spacing="2" text-anchor="middle">MALIJET</text>
  <text x="100" y="152" fill="url(#malijetGold)" font-family="'Inter', sans-serif" font-weight="800" font-size="12" letter-spacing="2" text-anchor="middle">RADIO WEB &amp; ACTUS</text>

  <!-- Bottom -->
  <rect x="36" y="166" width="128" height="20" rx="6" fill="#040810" stroke="url(#malijetGold)" stroke-width="1.2"/>
  <text x="100" y="180" fill="#FFD200" font-family="'Inter', sans-serif" font-weight="700" font-size="9" letter-spacing="1.5" text-anchor="middle">BAMAKO • 100% MALI</text>
</svg>
