<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="amalBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051b2e"/>
      <stop offset="50%" stop-color="#0b3154"/>
      <stop offset="100%" stop-color="#030e1a"/>
    </linearGradient>
    <linearGradient id="amalCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0288D1"/>
      <stop offset="50%" stop-color="#29B6F6"/>
      <stop offset="100%" stop-color="#FFE082"/>
    </linearGradient>
    
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#amalBg)" stroke="#29B6F6" stroke-width="3"/>

  <!-- Rayons de lumière et colombe d'espoir -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#082540" stroke="#29B6F6" stroke-width="2"/>
    <path d="M -12 6 Q -6 -6 0 4 Q 6 -6 12 6" fill="none" stroke="#FFE082" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-6" r="3.5" fill="#FFFFFF"/>
  </g>

  <!-- Titre SAWT AL AMAL -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="1.5" text-anchor="middle">SAWT AL AMAL</text>

  <!-- Tag LA VOIX DE L'ESPOIR -->
  <rect x="34" y="116" width="132" height="26" rx="8" fill="url(#amalCyan)"/>
  <text x="100" y="134" fill="#051B2E" font-family="'Inter', sans-serif" font-weight="900" font-size="11.5" letter-spacing="1.2" text-anchor="middle">صوت الأمل • MAROC</text>

  <!-- Pied MAROC -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#072038" stroke="#29B6F6" stroke-width="1.2"/>
  <text x="100" y="171" fill="#FFE082" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">LA VOIX DE L'ESPOIR</text>
</svg>