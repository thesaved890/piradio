<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="kleduBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b3a"/>
      <stop offset="50%" stop-color="#071226"/>
      <stop offset="100%" stop-color="#020814"/>
    </linearGradient>
    <linearGradient id="kleduCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0088FF"/>
    </linearGradient>
    <linearGradient id="kleduOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9900"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="36" fill="url(#kleduBg)"/>
  <rect width="194" height="194" x="3" y="3" rx="33" fill="none" stroke="url(#kleduCyan)" stroke-width="2.5" stroke-opacity="0.8"/>

  <!-- Glowing Sound wave orb -->
  <circle cx="100" cy="74" r="38" fill="#040e1f" stroke="url(#kleduOrange)" stroke-width="2.5"/>
  <path d="M 85 74 L 92 60 L 98 84 L 104 64 L 109 79 L 115 74" fill="none" stroke="url(#kleduCyan)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Station Name -->
  <text x="100" y="132" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="24" letter-spacing="2" text-anchor="middle">KLÉDU</text>
  <text x="100" y="152" fill="url(#kleduCyan)" font-family="'Inter', sans-serif" font-weight="700" font-size="12" letter-spacing="3" text-anchor="middle">101.2 FM</text>

  <!-- Badge Mali / Bamako -->
  <rect x="36" y="166" width="128" height="20" rx="6" fill="#030a17" stroke="url(#kleduOrange)" stroke-width="1.2"/>
  <text x="100" y="180" fill="#FFB703" font-family="'Inter', sans-serif" font-weight="700" font-size="9" letter-spacing="1.5" text-anchor="middle">BAMAKO • MALI</text>
</svg>

