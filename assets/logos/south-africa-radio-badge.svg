<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="zaBadgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1824"/>
      <stop offset="50%" stop-color="#07221c"/>
      <stop offset="100%" stop-color="#05121b"/>
    </linearGradient>
    <linearGradient id="zaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="50%" stop-color="#E8B838"/>
      <stop offset="100%" stop-color="#9C7515"/>
    </linearGradient>
    <clipPath id="zaFlagClip">
      <circle cx="100" cy="94" r="54"/>
    </clipPath>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#zaBadgeBg)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#zaGold)" stroke-width="2.5" opacity="0.85"/>
  <rect x="9" y="9" width="182" height="182" rx="28" fill="none" stroke="#007749" stroke-width="1.5" opacity="0.6"/>

  <!-- Ondes radio concentriques -->
  <circle cx="100" cy="94" r="75" fill="none" stroke="#007749" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.4"/>
  <circle cx="100" cy="94" r="65" fill="none" stroke="url(#zaGold)" stroke-width="1" stroke-dasharray="2 5" opacity="0.7"/>

  <!-- Disque Drapeau officiel de l'Afrique du Sud -->
  <g clip-path="url(#zaFlagClip)">
    <!-- Fond rouge (haut) et bleu (bas) -->
    <rect x="46" y="40" width="108" height="54" fill="#E03C31"/>
    <rect x="46" y="94" width="108" height="54" fill="#001489"/>
    <!-- Bordures blanches -->
    <polygon points="46,40 46,148 100,94" fill="#FFFFFF"/>
    <rect x="80" y="86" width="74" height="16" fill="#FFFFFF"/>
    <!-- Bande verte en Y -->
    <polygon points="46,46 46,142 94,94" fill="#007749"/>
    <polygon points="86,40 100,54 154,54 154,40" fill="#FFFFFF"/>
    <polygon points="86,148 100,134 154,134 154,148" fill="#FFFFFF"/>
    <rect x="88" y="88" width="66" height="12" fill="#007749"/>
    <polygon points="46,48 92,94 154,94 154,88 94,88 52,46" fill="#007749"/>
    <polygon points="46,140 92,94 154,94 154,100 94,100 52,142" fill="#007749"/>
    <!-- Triangle noir avec bordure jaune/or -->
    <polygon points="46,56 46,132 84,94" fill="#FFB81C"/>
    <polygon points="46,62 46,126 78,94" fill="#000000"/>
  </g>

  <!-- Anneau doré extérieur du disque -->
  <circle cx="100" cy="94" r="54" fill="none" stroke="url(#zaGold)" stroke-width="3"/>

  <!-- Filigrane Pi Web3 discret -->
  <text x="100" y="38" font-family="'Arial Black', sans-serif" font-size="12" font-weight="900" fill="url(#zaGold)" text-anchor="middle" letter-spacing="3" opacity="0.9">π PI RADIO</text>

  <!-- Cartouche inférieur Afrique du Sud -->
  <rect x="18" y="157" width="164" height="30" rx="10" fill="#07221C" stroke="url(#zaGold)" stroke-width="1.5"/>
  <text x="100" y="177" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">🇿🇦 SOUTH AFRICA</text>
</svg>
