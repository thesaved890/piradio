<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgAntinea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d2e"/>
      <stop offset="50%" stop-color="#143e5c"/>
      <stop offset="100%" stop-color="#071521"/>
    </linearGradient>
    <linearGradient id="goldAntinea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="cyanAntinea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4DD0E1"/>
      <stop offset="100%" stop-color="#00ACC1"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgAntinea)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#goldAntinea)" stroke-width="2" opacity="0.85"/>

  <!-- Symbole Antinéa - Reine des Touaregs & Méditerranée -->
  <g transform="translate(100, 72)">
    <circle cx="0" cy="0" r="42" fill="#08233a" stroke="url(#cyanAntinea)" stroke-width="2.5"/>
    <!-- Diadème / couronne touareg & croix du sud stylisée -->
    <path d="M -18,-10 L 0,-26 L 18,-10 L 10,14 L -10,14 Z" fill="none" stroke="url(#goldAntinea)" stroke-width="2"/>
    <circle cx="0" cy="-6" r="5" fill="#D32F2F"/>
  </g>

  <!-- Titre Antinea Radio -->
  <text x="100" y="132" font-family="'Arial Black', sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ANTINEA</text>
  <text x="100" y="148" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="url(#goldAntinea)" text-anchor="middle" letter-spacing="3">RADIO</text>

  <!-- Cartouche inférieur -->
  <rect x="20" y="160" width="160" height="25" rx="8" fill="url(#cyanAntinea)"/>
  <text x="100" y="176" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="900" fill="#061F33" text-anchor="middle" letter-spacing="1">MÉDITERRANÉE & BERBÈRE</text>
</svg>
