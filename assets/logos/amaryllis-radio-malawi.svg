<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="amBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#240718"/>
      <stop offset="50%" stop-color="#470f30"/>
      <stop offset="100%" stop-color="#14030d"/>
    </linearGradient>
    <linearGradient id="amPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4081"/>
      <stop offset="100%" stop-color="#c2185b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#amBg)"/>
  <circle cx="100" cy="84" r="58" fill="none" stroke="url(#amPink)" stroke-width="2"/>
  <!-- Amaryllis Floral Blossom Petals -->
  <g fill="url(#amPink)" opacity="0.9">
    <ellipse cx="100" cy="68" rx="8" ry="18"/>
    <ellipse cx="100" cy="100" rx="8" ry="18"/>
    <ellipse cx="84" cy="84" rx="18" ry="8"/>
    <ellipse cx="116" cy="84" rx="18" ry="8"/>
  </g>
  <circle cx="100" cy="84" r="8" fill="#ffd700"/>
  <!-- Radio Waves -->
  <path d="M 62 84 A 42 42 0 0 0 62 100" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <path d="M 138 84 A 42 42 0 0 1 138 100" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="100" y="130" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">AMARYLLIS</text>
  <!-- Banner -->
  <rect x="18" y="146" width="164" height="36" rx="10" fill="#170410" stroke="url(#amPink)" stroke-width="1.5"/>
  <text x="100" y="163" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">AMARYLLIS E-RADIO</text>
  <text x="100" y="176" font-family="system-ui,-apple-system,sans-serif" font-size="8.5" font-weight="700" fill="#ff4081" letter-spacing="1.2" text-anchor="middle">BLANTYRE • MALAWI</text>
</svg>