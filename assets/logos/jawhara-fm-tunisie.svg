<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="jawBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04152d"/>
      <stop offset="50%" stop-color="#0a2a57"/>
      <stop offset="100%" stop-color="#020c1a"/>
    </linearGradient>
    <linearGradient id="jawJewel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BF72"/>
      <stop offset="50%" stop-color="#00D2FC"/>
      <stop offset="100%" stop-color="#FFD100"/>
    </linearGradient>
    
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#jawBg)" stroke="#00D2FC" stroke-width="3"/>

  <!-- Diamant / Gemme Jawhara (جوهرة) -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#082347" stroke="#00D2FC" stroke-width="2"/>
    <polygon points="-12,-4 0,-14 12,-4 0,14" fill="none" stroke="url(#jawJewel)" stroke-width="2.5" stroke-linejoin="round"/>
    <line x1="-12" y1="-4" x2="12" y2="-4" stroke="url(#jawJewel)" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#FFD100"/>
  </g>

  <!-- Titre JAWHARA FM -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="2" text-anchor="middle">JAWHARA FM</text>

  <!-- Tag 102.5 FM • SOUSSE -->
  <rect x="36" y="116" width="128" height="26" rx="8" fill="url(#jawJewel)"/>
  <text x="100" y="134" fill="#04152D" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.2" text-anchor="middle">102.5 FM • SOUSSE</text>

  <!-- Pied TUNISIE -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#061d3d" stroke="#00D2FC" stroke-width="1.2"/>
  <text x="100" y="171" fill="#00D2FC" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">LA JOIE D'ÉCOUTER</text>
</svg>