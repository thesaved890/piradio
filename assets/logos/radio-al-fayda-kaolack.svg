<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="faydaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002D18"/>
      <stop offset="50%" stop-color="#005C30"/>
      <stop offset="100%" stop-color="#001F10"/>
    </linearGradient>
    <linearGradient id="faydaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="50%" stop-color="#FDD835"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#faydaBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#faydaGold)" stroke-width="4" stroke-opacity="0.85"/>

  <!-- Frequency Pill -->
  <g transform="translate(156, 65)">
    <rect width="200" height="46" rx="23" fill="url(#faydaGold)"/>
    <text x="100" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" fill="#002D18" text-anchor="middle" letter-spacing="2">90.1 FM</text>
  </g>

  <!-- Mosque Crescent / Star Motif -->
  <g transform="translate(256, 160)">
    <circle cx="0" cy="0" r="65" fill="#001C0F" stroke="url(#faydaGold)" stroke-width="4"/>
    <text x="0" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="url(#faydaGold)" text-anchor="middle">🌙</text>
  </g>

  <!-- Big Typography -->
  <text x="256" y="275" font-family="'Impact', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">AL FAYDA</text>
  <text x="256" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="url(#faydaGold)" text-anchor="middle" letter-spacing="8">RADIO KAOLACK</text>

  <!-- Slogan & Country -->
  <text x="256" y="375" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" fill="#C8E6C9" text-anchor="middle" letter-spacing="3">MÉDINA BAYE NIASS</text>
  <text x="256" y="405" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#E8F5E9" text-anchor="middle" letter-spacing="2">SPIRITUALITÉ, CULTURE &amp; DÉVELOPPEMENT</text>

  <!-- Live Tag -->
  <g transform="translate(146, 430)">
    <rect width="220" height="38" rx="19" fill="#00180B" stroke="url(#faydaGold)" stroke-width="2"/>
    <text x="110" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="15" fill="#00E676" text-anchor="middle" letter-spacing="3">🇸🇳 KAOLACK LIVE</text>
  </g>
