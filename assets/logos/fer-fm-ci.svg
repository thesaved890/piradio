<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ferBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1926"/>
      <stop offset="50%" stop-color="#14324a"/>
      <stop offset="100%" stop-color="#050e17"/>
    </linearGradient>
    <linearGradient id="ferOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA040"/>
      <stop offset="50%" stop-color="#FF8200"/>
      <stop offset="100%" stop-color="#D65F00"/>
    </linearGradient>
    <linearGradient id="ferCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80D8FF"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
    <filter id="ferDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#ferBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ferOrange)" stroke-width="3" stroke-opacity="0.8"/>

  <g filter="url(#ferDrop)" transform="translate(256, 185)">
    <circle cx="0" cy="0" r="62" fill="url(#ferOrange)"/>
    <circle cx="0" cy="0" r="54" fill="#0a1926"/>
    <text x="0" y="16" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="url(#ferOrange)" text-anchor="middle">FER</text>
  </g>

  <!-- Badge Info Route &amp; Sécurité -->
  <g transform="translate(256, 285)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="url(#ferOrange)" filter="url(#ferDrop)"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#0a1926" text-anchor="middle" letter-spacing="2">INFO ROUTE &amp; ACTUS</text>
  </g>

  <!-- Titre Principal FER FM -->
  <text x="256" y="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">FER FM CÔTE D'IVOIRE</text>

  <!-- Sous-titre La Radio de la Route -->
  <text x="256" y="395" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="url(#ferCyan)" text-anchor="middle" letter-spacing="3">LA RADIO DE LA ROUTE &amp; DU VOYAGE</text>

  <!-- Drapeau ivoirien miniature en bas -->
  <g transform="translate(256, 430)">
    <rect x="-18" y="-7" width="12" height="14" fill="#FF8200" rx="2"/>
    <rect x="-6" y="-7" width="12" height="14" fill="#FFFFFF"/>
    <rect x="6" y="-7" width="12" height="14" fill="#009A44" rx="2"/>
    <rect x="-18" y="-7" width="36" height="14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" rx="2"/>
  </g>
</svg>
