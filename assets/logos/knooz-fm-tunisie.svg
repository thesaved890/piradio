<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="knoozBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1403"/>
      <stop offset="50%" stop-color="#3d2807"/>
      <stop offset="100%" stop-color="#120b01"/>
    </linearGradient>
    <linearGradient id="knoozSun" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD100"/>
      <stop offset="50%" stop-color="#FF9E00"/>
      <stop offset="100%" stop-color="#E70013"/>
    </linearGradient>
    <filter id="knoozShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#knoozBg)" stroke="#FFD100" stroke-width="3" filter="url(#knoozShadow)"/>

  <!-- Trésor / Coffre / Sourire KnOOz -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#2e1e05" stroke="#FFD100" stroke-width="2"/>
    <path d="M -12 2 Q 0 14 12 2" fill="none" stroke="#FFD100" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-6" cy="-4" r="2.5" fill="#E70013"/>
    <circle cx="6" cy="-4" r="2.5" fill="#E70013"/>
  </g>

  <!-- Titre KnOOz FM -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="23" letter-spacing="2" text-anchor="middle" filter="url(#knoozShadow)">KnOOz FM</text>

  <!-- Tag LE SOURIRE EN PLUS -->
  <rect x="36" y="116" width="128" height="26" rx="8" fill="url(#knoozSun)"/>
  <text x="100" y="134" fill="#1F1403" font-family="'Inter', sans-serif" font-weight="900" font-size="11.5" letter-spacing="1.2" text-anchor="middle">LE SOURIRE EN PLUS</text>

  <!-- Pied TUNISIE -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#1c1203" stroke="#FFD100" stroke-width="1.2"/>
  <text x="100" y="171" fill="#FFD100" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">كنوز إف إم • TUNISIE</text>
</svg>

