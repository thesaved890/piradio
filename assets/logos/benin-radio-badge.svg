<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bjBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b12"/>
      <stop offset="50%" stop-color="#0a2a1b"/>
      <stop offset="100%" stop-color="#04120b"/>
    </linearGradient>
    <linearGradient id="bjGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <linearGradient id="bjGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A86B"/>
      <stop offset="100%" stop-color="#006633"/>
    </linearGradient>
    <linearGradient id="bjYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEB3B"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>
    <linearGradient id="bjRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF334B"/>
      <stop offset="100%" stop-color="#C60018"/>
    </linearGradient>
    <radialGradient id="bjGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FCD116" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FCD116" stop-opacity="0"/>
    </radialGradient>
    <filter id="bjShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fond circulaire sombre premium -->
  <circle cx="256" cy="256" r="240" fill="url(#bjBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#bjGold)" stroke-width="4" stroke-opacity="0.8"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="256" cy="210" r="180" fill="url(#bjGlow)"/>

  <!-- Ondes Radio supérieures -->
  <g fill="none" stroke="url(#bjGold)" stroke-linecap="round" opacity="0.85">
    <path d="M 120 180 A 150 150 0 0 1 392 180" stroke-width="3" stroke-dasharray="6 8"/>
    <path d="M 150 195 A 120 120 0 0 1 362 195" stroke-width="4"/>
    <path d="M 180 210 A 90 90 0 0 1 332 210" stroke-width="5"/>
  </g>

  <!-- Écusson National Béninois aux 3 couleurs officielles -->
  <g filter="url(#bjShadow)">
    <clipPath id="bjShieldClip">
      <path d="M 176 140 C 176 140 256 126 336 140 C 336 210 336 266 256 312 C 176 266 176 210 176 140 Z"/>
    </clipPath>
    <!-- Contenu du bouclier : Vert à gauche, Jaune en haut à droite, Rouge en bas à droite -->
    <g clip-path="url(#bjShieldClip)">
      <!-- Fond entier Vert à gauche (40% de largeur : 176 à 240) -->
      <rect x="176" y="126" width="64" height="190" fill="url(#bjGreen)"/>
      <!-- Jaune en haut à droite (240 à 336, haut) -->
      <rect x="240" y="126" width="96" height="95" fill="url(#bjYellow)"/>
      <!-- Rouge en bas à droite (240 à 336, bas) -->
      <rect x="240" y="221" width="96" height="95" fill="url(#bjRed)"/>
    </g>
    <!-- Bordure dorée du bouclier -->
    <path d="M 176 140 C 176 140 256 126 336 140 C 336 210 336 266 256 312 C 176 266 176 210 176 140 Z" fill="none" stroke="url(#bjGold)" stroke-width="5"/>
  </g>

  <!-- Symbole Pi au centre de l'écusson -->
  <g transform="translate(256, 218) scale(1.1)" filter="url(#bjShadow)">
    <circle cx="0" cy="0" r="32" fill="#0c2317" stroke="url(#bjGold)" stroke-width="2.5"/>
    <text x="0" y="12" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" fill="url(#bjGold)" text-anchor="middle">π</text>
  </g>

  <!-- Étoile et ondes micro sous le bouclier -->
  <g transform="translate(256, 332)">
    <circle cx="-30" cy="0" r="2" fill="#FCD116" opacity="0.8"/>
    <polygon points="0,-8 2.5,-2.5 8,-2.5 3.5,1.5 5,7 0,3.5 -5,7 -3.5,1.5 -8,-2.5 -2.5,-2.5" fill="#FCD116"/>
    <circle cx="30" cy="0" r="2" fill="#FCD116" opacity="0.8"/>
  </g>

  <!-- Banderole BÉNIN -->
  <g transform="translate(256, 380)">
    <rect x="-140" y="-24" width="280" height="48" rx="24" fill="#071b12" stroke="url(#bjGold)" stroke-width="3"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="5">BÉNIN</text>
  </g>

  <!-- Sous-titre officiel -->
  <text x="256" y="434" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" fill="url(#bjGold)" text-anchor="middle" letter-spacing="3" opacity="0.95">RADIO LIVE • FM &amp; WEB</text>
</svg>