<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="expBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f050a"/>
      <stop offset="50%" stop-color="#380a13"/>
      <stop offset="100%" stop-color="#120306"/>
    </linearGradient>
    <linearGradient id="expRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E70013"/>
      <stop offset="50%" stop-color="#FF334B"/>
      <stop offset="100%" stop-color="#FFB703"/>
    </linearGradient>
    <filter id="expShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#expBg)" stroke="url(#expRed)" stroke-width="3" filter="url(#expShadow)"/>

  <!-- Sigle X dynamique / Express -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#29070e" stroke="url(#expRed)" stroke-width="2"/>
    <path d="M -10 -10 L 10 10 M 10 -10 L -10 10" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <polygon points="6,-10 10,-10 10,-6" fill="url(#expRed)"/>
  </g>

  <!-- Titre EXPRESS FM -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="21" letter-spacing="2" text-anchor="middle" filter="url(#expShadow)">EXPRESS FM</text>

  <!-- Tag ÉCONOMIE & BUSINESS -->
  <rect x="32" y="116" width="136" height="26" rx="8" fill="url(#expRed)"/>
  <text x="100" y="134" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="11.5" letter-spacing="1.2" text-anchor="middle">ÉCONOMIE &amp; BUSINESS</text>

  <!-- Pied TUNISIE -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#170407" stroke="url(#expRed)" stroke-width="1.2"/>
  <text x="100" y="171" fill="#FFB703" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">TUNISIE • 103.6 FM</text>
</svg>

