<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="srBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1400"/>
      <stop offset="50%" stop-color="#332400"/>
      <stop offset="100%" stop-color="#120d00"/>
    </linearGradient>
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="50%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#srBg)"/>
  <circle cx="100" cy="84" r="58" fill="none" stroke="url(#starGold)" stroke-width="2"/>
  <!-- Glowing Star -->
  <g fill="url(#starGold)" filter="drop-shadow(0 0 6px rgba(255,215,0,0.6))">
    <polygon points="100,45 108,68 132,68 113,82 120,105 100,91 80,105 87,82 68,68 92,68"/>
  </g>
  <!-- Radio Waves -->
  <circle cx="100" cy="84" r="44" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.6" stroke-dasharray="4 3"/>
  <text x="100" y="126" font-family="system-ui,-apple-system,sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">103.5 FM</text>
  <!-- Banner -->
  <rect x="18" y="146" width="164" height="36" rx="10" fill="#1c1300" stroke="url(#starGold)" stroke-width="1.5"/>
  <text x="100" y="163" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">STAR RADIO SL</text>
  <text x="100" y="176" font-family="system-ui,-apple-system,sans-serif" font-size="8.5" font-weight="700" fill="url(#starGold)" letter-spacing="1.2" text-anchor="middle">THE VOICE OF THE NATION</text>
</svg>