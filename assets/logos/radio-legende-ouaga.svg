<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="legendeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1106"/>
      <stop offset="50%" stop-color="#2d1c0b"/>
      <stop offset="100%" stop-color="#0a0602"/>
    </linearGradient>
    <linearGradient id="legendeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFDD00"/>
      <stop offset="100%" stop-color="#FBB034"/>
    </linearGradient>
    <linearGradient id="legendeOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5E3A"/>
      <stop offset="100%" stop-color="#FF2A68"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#legendeBg)"/>
  <rect width="194" height="194" x="3" y="3" rx="33" fill="none" stroke="url(#legendeGold)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Legend Star / Crown -->
  <circle cx="100" cy="74" r="38" fill="#100903" stroke="url(#legendeOrange)" stroke-width="2"/>
  <polygon points="100,56 104,68 116,68 106,76 110,88 100,80 90,88 94,76 84,68 96,68" fill="url(#legendeGold)"/>

  <text x="100" y="130" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="18" letter-spacing="1.5" text-anchor="middle">LÉGENDE</text>
  <text x="100" y="148" fill="url(#legendeGold)" font-family="'Inter', sans-serif" font-weight="800" font-size="12" letter-spacing="2" text-anchor="middle">RADIO OUAGA</text>

  <rect x="36" y="166" width="128" height="20" rx="6" fill="#080401" stroke="url(#legendeGold)" stroke-width="1.2"/>
  <text x="100" y="180" fill="#FF5E3A" font-family="'Inter', sans-serif" font-weight="700" font-size="8.5" letter-spacing="1" text-anchor="middle">OUAGADOUGOU • HITS &amp; CULTURE</text>
</svg>
