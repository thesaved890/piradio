<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051c10"/>
      <stop offset="50%" stop-color="#0a331d"/>
      <stop offset="100%" stop-color="#021008"/>
    </linearGradient>
    <linearGradient id="bayGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="50%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#007E33"/>
    </linearGradient>
    <linearGradient id="bayGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <radialGradient id="bayGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#00C853" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00C853" stop-opacity="0"/>
    </radialGradient>
    
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#bayBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#bayGold)" stroke-width="3" stroke-opacity="0.8"/>
  <circle cx="256" cy="190" r="170" fill="url(#bayGlow)"/>

  <!-- Ondes radio dorées -->
  <g fill="none" stroke="url(#bayGold)" stroke-linecap="round" opacity="0.8">
    <path d="M 140 170 A 130 130 0 0 1 372 170" stroke-width="3" stroke-dasharray="6 8"/>
    <path d="M 170 180 A 100 100 0 0 1 342 180" stroke-width="4"/>
    <path d="M 200 190 A 70 70 0 0 1 312 190" stroke-width="5"/>
  </g>

  <!-- Médaillon Al Bayane Croissant &amp; Étoile dorés -->
  <g transform="translate(256, 185)">
    <circle cx="0" cy="0" r="62" fill="url(#bayGreen)"/>
    <circle cx="0" cy="0" r="54" fill="#051c10"/>
    <!-- Croissant de lune islamique -->
    <path d="M -8 -24 A 28 28 0 1 0 20 20 A 24 24 0 1 1 -8 -24 Z" fill="url(#bayGold)"/>
    <polygon points="12,-6 14,-1 19,-1 15,2 17,7 12,4 7,7 9,2 5,-1 10,-1" fill="url(#bayGold)"/>
  </g>

  <!-- Badge 98.2 FM La Voix de l'Islam -->
  <g transform="translate(256, 285)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="url(#bayGold)"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#051c10" text-anchor="middle" letter-spacing="2">98.2 FM • ABIDJAN</text>
  </g>

  <!-- Titre Principal RADIO AL BAYANE -->
  <text x="256" y="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">RADIO AL BAYANE</text>

  <!-- Sous-titre Spiritualité &amp; Société -->
  <text x="256" y="395" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="url(#bayGold)" text-anchor="middle" letter-spacing="3">SPIRITUALITÉ &amp; ÉDUCATION</text>

  <!-- Drapeau ivoirien miniature en bas -->
  <g transform="translate(256, 430)">
    <rect x="-18" y="-7" width="12" height="14" fill="#FF8200" rx="2"/>
    <rect x="-6" y="-7" width="12" height="14" fill="#FFFFFF"/>
    <rect x="6" y="-7" width="12" height="14" fill="#009A44" rx="2"/>
    <rect x="-18" y="-7" width="36" height="14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" rx="2"/>
  </g>
</svg>