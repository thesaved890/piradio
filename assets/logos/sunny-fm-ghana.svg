<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sunBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f02"/>
      <stop offset="50%" stop-color="#2e2105"/>
      <stop offset="100%" stop-color="#0a0801"/>
    </linearGradient>
    <linearGradient id="sunGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <filter id="sunDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#sunBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#sunGold)" stroke-width="3" stroke-opacity="0.8"/>

  <!-- Soleil éclatant Sunny FM -->
  <g filter="url(#sunDrop)" transform="translate(256, 185)">
    <circle cx="0" cy="0" r="48" fill="url(#sunGold)"/>
    <path d="M 0 -68 L 0 -54 M 0 68 L 0 54 M -68 0 L -54 0 M 68 0 L 54 0 M -48 -48 L -38 -38 M 48 48 L 38 38 M -48 48 L -38 38 M 48 -48 L 38 -38" stroke="url(#sunGold)" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Badge 88.7 FM Christian Contemporary -->
  <g transform="translate(256, 285)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="url(#sunGold)" filter="url(#sunDrop)"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#140f02" text-anchor="middle" letter-spacing="2">88.7 FM • ACCRA</text>
  </g>

  <!-- Titre Principal SUNNY FM -->
  <text x="256" y="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">SUNNY 88.7 FM</text>

  <!-- Sous-titre Christian Contemporary -->
  <text x="256" y="395" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="url(#sunGold)" text-anchor="middle" letter-spacing="3">CHRISTIAN CONTEMPORARY</text>

  <!-- Drapeau ghanéen miniature en bas -->
  <g transform="translate(256, 430)">
    <rect x="-18" y="-7" width="36" height="5" fill="#CE1126" rx="1"/>
    <rect x="-18" y="-2" width="36" height="5" fill="#FCD116"/>
    <polygon points="0,-2 1.5,0.5 4,0.5 2,2 2.5,4.5 0,3 -2.5,4.5 -2,2 -4,0.5 -1.5,0.5" fill="#000000"/>
    <rect x="-18" y="3" width="36" height="5" fill="#006B3F" rx="1"/>
    <rect x="-18" y="-7" width="36" height="15" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" rx="2"/>
  </g>
</svg>
