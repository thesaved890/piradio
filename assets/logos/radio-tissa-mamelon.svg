<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tissaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e24"/>
      <stop offset="50%" stop-color="#2a143d"/>
      <stop offset="100%" stop-color="#0a0510"/>
    </linearGradient>
    <linearGradient id="tissaPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DA22FF"/>
      <stop offset="100%" stop-color="#9733EE"/>
    </linearGradient>
    <linearGradient id="tissaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE38A"/>
      <stop offset="100%" stop-color="#F38181"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="36" fill="url(#tissaBg)"/>
  <rect width="194" height="194" x="3" y="3" rx="33" fill="none" stroke="url(#tissaPurple)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Icon: Mamelon hill of Sikasso & Tower -->
  <circle cx="100" cy="74" r="38" fill="#110719" stroke="url(#tissaGold)" stroke-width="2"/>
  <!-- Mamelon Hill -->
  <path d="M 68 88 Q 100 58, 132 88 Z" fill="url(#tissaPurple)"/>
  <!-- Radio Mast on summit -->
  <line x1="100" y1="50" x2="100" y2="70" stroke="url(#tissaGold)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="100" cy="48" r="3" fill="#FFFFFF"/>
  <path d="M 92 56 A 10 10 0 0 1 108 56" fill="none" stroke="url(#tissaGold)" stroke-width="2"/>

  <!-- Station Name -->
  <text x="100" y="130" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="16" letter-spacing="1" text-anchor="middle">RADIO TISSA</text>
  <text x="100" y="148" fill="url(#tissaGold)" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="1.5" text-anchor="middle">99.7 FM</text>

  <!-- Region -->
  <rect x="36" y="166" width="128" height="20" rx="6" fill="#0c0413" stroke="url(#tissaPurple)" stroke-width="1.2"/>
  <text x="100" y="180" fill="#FCE38A" font-family="'Inter', sans-serif" font-weight="700" font-size="8.5" letter-spacing="1" text-anchor="middle">VOIX DU MAMELON • SIKASSO</text>
</svg>

