<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="hwBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140800"/>
      <stop offset="50%" stop-color="#2e1200"/>
      <stop offset="100%" stop-color="#0c0400"/>
    </linearGradient>
    <linearGradient id="hwOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6d00"/>
      <stop offset="100%" stop-color="#ff3d00"/>
    </linearGradient>
    <linearGradient id="hwYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#ffab00"/>
    </linearGradient>
    <filter id="hwDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#ff6d00" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#hwBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#ff6d00" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Emblème HIT WEST -->
  <g filter="url(#hwDrop)" transform="translate(256, 175)">
    <circle cx="0" cy="0" r="76" fill="#1f0c00" stroke="url(#hwOrange)" stroke-width="5"/>
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="url(#hwYellow)" text-anchor="middle" letter-spacing="2">HIT</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">WEST</text>
  </g>

  <!-- Badge Multi-fréquences -->
  <g transform="translate(256, 285)">
    <rect x="-140" y="-18" width="280" height="38" rx="19" fill="url(#hwYellow)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#140800" text-anchor="middle" letter-spacing="1">RENNES 99.2 • BREST 96.9</text>
  </g>

  <!-- Titre HIT WEST -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">HIT WEST</text>

  <!-- Slogan -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffab91" text-anchor="middle" letter-spacing="3">LE HIT RADIO DU GRAND OUEST</text>

  <!-- Villes de diffusion -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffd54f" text-anchor="middle" letter-spacing="2">QUIMPER • LORIENT • VANNES • ST-MALO</text>
</svg>
