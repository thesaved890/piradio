<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="mzBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061e1b"/>
      <stop offset="50%" stop-color="#0c3833"/>
      <stop offset="100%" stop-color="#041412"/>
    </linearGradient>
    <linearGradient id="mzTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#mzBg)"/>
  <circle cx="100" cy="84" r="58" fill="none" stroke="url(#mzTeal)" stroke-width="2"/>
  <!-- Strong Pillar (Mzati) &amp; Beacon Waves -->
  <rect x="94" y="60" width="12" height="48" rx="3" fill="#ffffff"/>
  <rect x="88" y="56" width="24" height="6" rx="2" fill="url(#mzTeal)"/>
  <rect x="86" y="104" width="28" height="6" rx="2" fill="url(#mzTeal)"/>
