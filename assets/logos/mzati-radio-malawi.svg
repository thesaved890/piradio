  <circle cx="100" cy="56" r="4" fill="#ffd700"/>
  <path d="M 80 50 A 24 24 0 0 0 80 62" fill="none" stroke="#00b4d8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 120 50 A 24 24 0 0 1 120 62" fill="none" stroke="#00b4d8" stroke-width="2.5" stroke-linecap="round"/>
  <text x="100" y="128" font-family="system-ui,-apple-system,sans-serif" font-size="13" font-weight="900" fill="#ffffff" letter-spacing="2" text-anchor="middle">MZATI</text>
  <!-- Banner -->
  <rect x="18" y="146" width="164" height="36" rx="10" fill="#041614" stroke="url(#mzTeal)" stroke-width="1.5"/>
  <text x="100" y="163" font-family="system-ui,-apple-system,sans-serif" font-size="11.5" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">MZATI RADIO</text>
  <text x="100" y="176" font-family="system-ui,-apple-system,sans-serif" font-size="8.5" font-weight="700" fill="#00b4d8" letter-spacing="1.2" text-anchor="middle">MULANJE &amp; BLANTYRE • MALAWI</text>
