<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ocBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021c24"/>
      <stop offset="50%" stop-color="#063544"/>
      <stop offset="100%" stop-color="#011217"/>
    </linearGradient>
    <linearGradient id="ocCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0097a7"/>
    </linearGradient>
    <linearGradient id="ocGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="ocDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00e5ff" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#ocBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#00e5ff" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Vague marine océane -->
  <g filter="url(#ocDrop)" transform="translate(256, 175)">
    <circle cx="0" cy="0" r="76" fill="#03222c" stroke="url(#ocCyan)" stroke-width="5"/>
    <!-- Vagues océaniques blanches et cyan -->
    <path d="M -45 15 C -25 -15 -10 15 10 -5 C 25 -20 40 5 45 15 L 45 35 L -45 35 Z" fill="url(#ocCyan)"/>
    <circle cx="15" cy="-22" r="14" fill="url(#ocGold)"/>
  </g>

  <!-- Badge Multi-fréquences -->
  <g transform="translate(256, 285)">
    <rect x="-140" y="-18" width="280" height="38" rx="19" fill="url(#ocGold)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" fill="#021c24" text-anchor="middle" letter-spacing="1">QUIMPER 97.2 • VANNES 100.3</text>
  </g>

  <!-- Titre OCÉANE -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">OCÉANE</text>

  <!-- Slogan -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#80deea" text-anchor="middle" letter-spacing="3">LA RADIO DU LITTORAL BRETON</text>

  <!-- Villes de diffusion -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#ffd54f" text-anchor="middle" letter-spacing="2">LANNION • CONCARNEAU • LORIENT</text>
</svg>

