<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="urbanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="60%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="urbanOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9100"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F3B43F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#urbanBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Frequency Badge -->
  <g transform="translate(156, 60)">
    <rect width="200" height="50" rx="25" fill="url(#urbanOrange)"/>
    <text x="100" y="34" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">94.5 FM</text>
  </g>

  <!-- URBAN Big Typography -->
  <text x="256" y="210" font-family="'Impact', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="96" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">URBAN</text>
  <text x="256" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#urbanOrange)" text-anchor="middle" letter-spacing="8">RADIO</text>

  <!-- Location Tag & Slogan -->
  <text x="256" y="345" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">ENUGU</text>
  <text x="256" y="385" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" fill="#90CAF9" text-anchor="middle" letter-spacing="2">THE SOUND OF THE EAST</text>

  <!-- Bottom Nigeria Tag -->
  <g transform="translate(136, 420)">
    <rect width="240" height="42" rx="21" fill="#003318" stroke="url(#gold)" stroke-width="2"/>
    <text x="120" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#00E676" text-anchor="middle" letter-spacing="3">🇳🇬 NIGERIA 100% LIVE</text>
  </g>
</svg>

