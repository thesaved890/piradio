<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051910"/>
      <stop offset="50%" stop-color="#0d3622"/>
      <stop offset="100%" stop-color="#03100a"/>
    </linearGradient>
    <linearGradient id="pceGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="50%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#007E33"/>
    </linearGradient>
    <linearGradient id="pceGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <filter id="pceDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#pceBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#pceGold)" stroke-width="3" stroke-opacity="0.8"/>

  <g filter="url(#pceDrop)" transform="translate(256, 185)">
    <circle cx="0" cy="0" r="62" fill="url(#pceGreen)"/>
    <circle cx="0" cy="0" r="54" fill="#051910"/>
    <!-- Colombe blanche de la paix avec rameau d'olivier -->
    <path d="M -24 8 C -10 -20 20 -20 32 -6 C 20 4 6 16 -12 18 C -18 18 -22 14 -24 8 Z" fill="#FFFFFF"/>
    <circle cx="18" cy="-8" r="3" fill="#051910"/>
    <path d="M 28 -2 C 34 -8 40 -8 42 -6" fill="none" stroke="url(#pceGold)" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Badge 104.3 FM Kɔkrokoo -->
  <g transform="translate(256, 285)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="url(#pceGold)" filter="url(#pceDrop)"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#051910" text-anchor="middle" letter-spacing="2">104.3 FM • ACCRA</text>
  </g>

  <!-- Titre Principal PEACE FM -->
  <text x="256" y="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">PEACE 104.3 FM</text>

  <!-- Sous-titre Kɔkrokoo • Despite Media -->
  <text x="256" y="395" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="url(#pceGold)" text-anchor="middle" letter-spacing="3">KƆKROKOO • DESPITE MEDIA</text>

  <!-- Drapeau ghanéen miniature en bas -->
  <g transform="translate(256, 430)">
    <rect x="-18" y="-7" width="36" height="5" fill="#CE1126" rx="1"/>
    <rect x="-18" y="-2" width="36" height="5" fill="#FCD116"/>
    <polygon points="0,-2 1.5,0.5 4,0.5 2,2 2.5,4.5 0,3 -2.5,4.5 -2,2 -4,0.5 -1.5,0.5" fill="#000000"/>
    <rect x="-18" y="3" width="36" height="5" fill="#006B3F" rx="1"/>
    <rect x="-18" y="-7" width="36" height="15" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" rx="2"/>
  </g>
</svg>
