<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgPower" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190e03"/>
      <stop offset="50%" stop-color="#3d2005"/>
      <stop offset="100%" stop-color="#120a02"/>
    </linearGradient>
    <linearGradient id="powerOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgPower)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#powerOrange)" stroke-width="2.5" opacity="0.85"/>

  <!-- Logo Power Bouton Marche / Arrêt & Éclair -->
  <g transform="translate(100, 70)">
    <circle cx="0" cy="0" r="38" fill="#261303" stroke="url(#powerOrange)" stroke-width="2.5"/>
    <!-- Symbole Power iconique -->
    <path d="M -16,-8 A 20 20 0 1 0 16,-8" fill="none" stroke="url(#powerOrange)" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="-20" x2="0" y2="2" stroke="url(#powerOrange)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Titre POWER 98.7 -->
  <text x="100" y="128" font-family="'Arial Black', Impact, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">POWER 98.7</text>
  <text x="100" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="url(#powerOrange)" text-anchor="middle" letter-spacing="2">NOW WE'RE TALKING</text>

  <!-- Cartouche Joburg Business -->
  <rect x="20" y="158" width="160" height="26" rx="8" fill="url(#powerOrange)"/>
  <text x="100" y="175" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#190E03" text-anchor="middle" letter-spacing="1">BUSINESS, NEWS & TALK</text>
</svg>
