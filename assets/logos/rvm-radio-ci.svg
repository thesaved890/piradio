<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rvmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041a12"/>
      <stop offset="50%" stop-color="#072c1e"/>
      <stop offset="100%" stop-color="#02100b"/>
    </linearGradient>
    <linearGradient id="rvmEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00897b"/>
    </linearGradient>
    <linearGradient id="rvmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ff9800"/>
    </linearGradient>
    
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#rvmBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#00e676" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Symbolique ondes / montagne -->
  <circle cx="256" cy="210" r="150" fill="none" stroke="#00e676" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="256" cy="210" r="180" fill="none" stroke="#00e676" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Emblème RVM -->
  <g>
    <circle cx="256" cy="180" r="85" fill="#031f15" stroke="url(#rvmEmerald)" stroke-width="6"/>
    <!-- Logo RVM stylisé -->
    <text x="256" y="200" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" text-anchor="middle" letter-spacing="2">RVM</text>
  </g>

  <!-- Nom complet sous l'emblème -->
  <text x="256" y="300" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" text-anchor="middle" letter-spacing="4">RVM RADIO</text>
  
  <!-- Badge Fréquence 106.2 FM -->
  <rect x="146" y="335" width="220" height="48" rx="24" fill="url(#rvmGold)"/>
  <text x="256" y="367" fill="#041a12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="25" text-anchor="middle" letter-spacing="1">106.2 FM</text>

  <!-- Région / Pays -->
  <text x="256" y="425" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="18" text-anchor="middle" letter-spacing="2">LA VOIX DU MORONOU • CI</text>
</svg>