      <stop offset="0%" stop-color="#041f1c"/>
      <stop offset="50%" stop-color="#093833"/>
      <stop offset="100%" stop-color="#021210"/>
    </linearGradient>
    <linearGradient id="aswatTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A896"/>
      <stop offset="50%" stop-color="#02C39A"/>
