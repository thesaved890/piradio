<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="nenebaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26"/>
      <stop offset="50%" stop-color="#0a293a"/>
      <stop offset="100%" stop-color="#030c12"/>
    </linearGradient>
    <linearGradient id="nenebaCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>
    <linearGradient id="nenebaGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F9D423"/>
      <stop offset="100%" stop-color="#FF4E50"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="36" fill="url(#nenebaBg)"/>
  <rect width="194" height="194" x="3" y="3" rx="33" fill="none" stroke="url(#nenebaCyan)" stroke-width="2.5" stroke-opacity="0.85"/>

  <!-- Icon: Markala Dam / River Niger waves -->
  <circle cx="100" cy="74" r="38" fill="#04121a" stroke="url(#nenebaGold)" stroke-width="2"/>
  <!-- Dam / Bridge pillars -->
  <rect x="76" y="66" width="6" height="22" rx="2" fill="url(#nenebaGold)"/>
  <rect x="88" y="60" width="6" height="28" rx="2" fill="url(#nenebaGold)"/>
  <rect x="100" y="56" width="6" height="32" rx="2" fill="url(#nenebaCyan)"/>
  <rect x="112" y="60" width="6" height="28" rx="2" fill="url(#nenebaGold)"/>
  <rect x="124" y="66" width="6" height="22" rx="2" fill="url(#nenebaGold)"/>
  <path d="M 70 88 Q 100 80, 130 88" fill="none" stroke="url(#nenebaCyan)" stroke-width="2.5"/>

  <!-- Station Name -->
  <text x="100" y="132" fill="#FFFFFF" font-family="'Inter', sans-serif" font-weight="900" font-size="20" letter-spacing="1.5" text-anchor="middle">NÉNÈBA FM</text>
  <text x="100" y="152" fill="url(#nenebaCyan)" font-family="'Inter', sans-serif" font-weight="800" font-size="13" letter-spacing="2" text-anchor="middle">97.7 FM</text>

  <!-- Region -->
  <rect x="36" y="166" width="128" height="20" rx="6" fill="#02090e" stroke="url(#nenebaGold)" stroke-width="1.2"/>
  <text x="100" y="180" fill="#F9D423" font-family="'Inter', sans-serif" font-weight="700" font-size="9" letter-spacing="1.5" text-anchor="middle">MARKALA • SÉGOU</text>
</svg>
