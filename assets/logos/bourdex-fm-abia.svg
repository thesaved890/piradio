<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bdxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#210000"/>
      <stop offset="50%" stop-color="#420000"/>
      <stop offset="100%" stop-color="#140000"/>
    </linearGradient>
    <linearGradient id="bdxGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#F3B43F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bdxBg)"/>
  <rect width="504" height="504" x="4" y="4" rx="92" fill="none" stroke="url(#bdxGold)" stroke-width="4" stroke-opacity="0.85"/>

  <!-- Frequency Pill -->
  <g transform="translate(156, 65)">
    <rect width="200" height="46" rx="23" fill="url(#bdxGold)"/>
    <text x="100" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="26" fill="#210000" text-anchor="middle" letter-spacing="2">97.9 FM</text>
  </g>

  <!-- Big BOURDEX FM Typography -->
  <text x="256" y="215" font-family="'Impact', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="82" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">BOURDEX FM</text>
  <text x="256" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#bdxGold)" text-anchor="middle" letter-spacing="8">ABIRIBA</text>

  <!-- Slogan -->
  <text x="256" y="348" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" fill="#FFCDD2" text-anchor="middle" letter-spacing="3">ABIA STATE • NIGERIA</text>
  <text x="256" y="388" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" fill="#FFEBEE" text-anchor="middle" letter-spacing="2">HIGHLIFE &amp; IGBO BROADCASTING</text>

  <!-- Live Tag -->
  <g transform="translate(146, 422)">
    <rect width="220" height="40" rx="20" fill="#003318" stroke="url(#bdxGold)" stroke-width="2"/>
    <text x="110" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="16" fill="#00E676" text-anchor="middle" letter-spacing="3">🇳🇬 ABIA LIVE 24/7</text>
  </g>
