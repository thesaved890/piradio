<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="afriondeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1008"/>
      <stop offset="50%" stop-color="#361a0a"/>
      <stop offset="100%" stop-color="#120803"/>
    </linearGradient>
    <linearGradient id="afriondeOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E76F51"/>
      <stop offset="50%" stop-color="#F4A261"/>
      <stop offset="100%" stop-color="#E9C46A"/>
    </linearGradient>
    <filter id="afriondeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#afriondeBg)" stroke="url(#afriondeOrange)" stroke-width="3" filter="url(#afriondeShadow)"/>

  <!-- Ondes radiophoniques et globe africain -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="16" fill="url(#afriondeOrange)"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#F4A261" stroke-width="2.5" opacity="0.7"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#E9C46A" stroke-width="2" opacity="0.4"/>
    <path d="M -6 -2 L 8 0 L -6 2 Z" fill="#1f1008"/>
  </g>

  <!-- Titre AfriOnde -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="22" letter-spacing="2" text-anchor="middle" filter="url(#afriondeShadow)">AFRIONDE</text>

  <!-- Tag CONAKRY -->
  <rect x="42" y="116" width="116" height="26" rx="8" fill="url(#afriondeOrange)"/>
  <text x="100" y="134" fill="#1f1008" font-family="'Inter', sans-serif" font-weight="900" font-size="13" letter-spacing="1.5" text-anchor="middle">CONAKRY 🇬🇳</text>

  <!-- Pied de badge -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#24130b" stroke="#F4A261" stroke-width="1.2"/>
  <text x="100" y="171" fill="#E9C46A" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">VOIX D'AFRIQUE</text>
</svg>

