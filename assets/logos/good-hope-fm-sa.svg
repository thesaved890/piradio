<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgHope" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b29"/>
      <stop offset="50%" stop-color="#0b3857"/>
      <stop offset="100%" stop-color="#051421"/>
    </linearGradient>
    <linearGradient id="hopeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>
    <linearGradient id="hopeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA726"/>
      <stop offset="100%" stop-color="#FB8C00"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgHope)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#hopeCyan)" stroke-width="2.5" opacity="0.85"/>

  <!-- Logo Good Hope Cap de Bonne Espérance &amp; Phare -->
  <g transform="translate(100, 68)">
    <circle cx="0" cy="0" r="38" fill="#09273d" stroke="url(#hopeCyan)" stroke-width="2"/>
    <!-- Silhouette du Cap &amp; océan -->
    <path d="M -22,14 Q -6,-16 0,-16 Q 6,-16 22,14 Z" fill="url(#hopeOrange)"/>
    <circle cx="0" cy="-16" r="3" fill="#FFFFFF"/>
    <!-- Faisceaux lumineux -->
    <line x1="-5" y1="-16" x2="-22" y2="-24" stroke="url(#hopeCyan)" stroke-width="1.5" stroke-dasharray="2 2"/>
    <line x1="5" y1="-16" x2="22" y2="-24" stroke="url(#hopeCyan)" stroke-width="1.5" stroke-dasharray="2 2"/>
  </g>

  <!-- Titre GOOD HOPE FM -->
  <text x="100" y="126" font-family="'Arial Black', Impact, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">GOOD HOPE FM</text>
  <text x="100" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="url(#hopeCyan)" text-anchor="middle" letter-spacing="2">CAPE TOWN'S ORIGINAL</text>

  <!-- Cartouche SABC Le Cap -->
  <rect x="20" y="158" width="160" height="26" rx="8" fill="url(#hopeOrange)"/>
  <text x="100" y="175" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#071B29" text-anchor="middle" letter-spacing="1">🇿🇦 SABC • CAPE TOWN</text>
</svg>
