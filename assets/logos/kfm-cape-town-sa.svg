<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgKfm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b2d"/>
      <stop offset="50%" stop-color="#123559"/>
      <stop offset="100%" stop-color="#071424"/>
    </linearGradient>
    <linearGradient id="kfmYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEE58"/>
      <stop offset="100%" stop-color="#FDD835"/>
    </linearGradient>
    <linearGradient id="kfmOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgKfm)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#kfmYellow)" stroke-width="2.5" opacity="0.85"/>

  <!-- Logo KFM & Silhouette de Table Mountain (Le Cap) -->
  <g transform="translate(100, 68)">
    <circle cx="0" cy="0" r="38" fill="#0c233c" stroke="url(#kfmYellow)" stroke-width="2"/>
    <!-- Table Mountain profil plat iconique -->
    <path d="M -26,14 L -20,-4 L 20,-4 L 26,14 Z" fill="url(#kfmOrange)"/>
    <text x="0" y="24" font-family="'Arial Black', Impact, sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" text-anchor="middle">KFM</text>
  </g>

  <!-- Titre KFM 94.5 -->
  <text x="100" y="128" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">KFM 94.5</text>
  <text x="100" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="url(#kfmYellow)" text-anchor="middle" letter-spacing="2">MOST MUSIC STATION</text>

  <!-- Cartouche Cape Town -->
  <rect x="20" y="158" width="160" height="26" rx="8" fill="url(#kfmOrange)"/>
  <text x="100" y="175" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">CAPE TOWN & WESTERN CAPE</text>
</svg>