<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgMetro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="50%" stop-color="#241315"/>
      <stop offset="100%" stop-color="#0f0e10"/>
    </linearGradient>
    <linearGradient id="metroRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="100%" stop-color="#C60B28"/>
    </linearGradient>
    <linearGradient id="metroGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgMetro)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#metroRed)" stroke-width="2.5" opacity="0.85"/>

  <!-- Logo METRO FM -->
  <g transform="translate(100, 68)">
    <circle cx="0" cy="0" r="38" fill="#1f090b" stroke="url(#metroRed)" stroke-width="2.5"/>
    <text x="0" y="14" font-family="'Arial Black', Impact, sans-serif" font-size="44" font-weight="900" fill="url(#metroRed)" text-anchor="middle">M</text>
  </g>

  <!-- Titre METRO FM -->
  <text x="100" y="126" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">METRO FM</text>
  <text x="100" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="url(#metroGold)" text-anchor="middle" letter-spacing="2">IT'S WHERE YOU'RE AT</text>

  <!-- Cartouche SABC -->
  <rect x="25" y="158" width="150" height="26" rx="8" fill="url(#metroRed)"/>
  <text x="100" y="175" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">🇿🇦 SABC • URBAN & R&B</text>
</svg>