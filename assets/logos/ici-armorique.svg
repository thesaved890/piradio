<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="armBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a36"/>
      <stop offset="50%" stop-color="#062e5e"/>
      <stop offset="100%" stop-color="#011024"/>
    </linearGradient>
    <linearGradient id="armBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a0e9"/>
      <stop offset="100%" stop-color="#005bac"/>
    </linearGradient>
    <linearGradient id="armOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9100"/>
      <stop offset="100%" stop-color="#ff6d00"/>
    </linearGradient>
    <filter id="armDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00a0e9" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="100" fill="url(#armBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#00a0e9" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Emblème ICI Radio France -->
  <g filter="url(#armDrop)" transform="translate(256, 175)">
    <rect x="-85" y="-55" width="170" height="110" rx="26" fill="url(#armBlue)" stroke="#ffffff" stroke-width="3"/>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="62" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-2">ici</text>
  </g>

  <!-- Badge Fréquences -->
  <g transform="translate(256, 285)">
    <rect x="-140" y="-18" width="280" height="38" rx="19" fill="url(#armOrange)"/>
    <text x="0" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">RENNES 103.1 • VITRÉ 101.6</text>
  </g>

  <!-- Titre Principal ICI ARMORIQUE -->
  <text x="256" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">ICI ARMORIQUE</text>

  <!-- Slogan -->
  <text x="256" y="395" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#80d8ff" text-anchor="middle" letter-spacing="3">L'ACTUALITÉ D'ILLE-ET-VILAINE</text>

  <!-- Villes de diffusion -->
  <text x="256" y="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffd54f" text-anchor="middle" letter-spacing="2">RADIO FRANCE • BRETAGNE EST</text>
</svg>
