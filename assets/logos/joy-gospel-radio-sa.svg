<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgJoy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071926"/>
      <stop offset="50%" stop-color="#0c2c44"/>
      <stop offset="100%" stop-color="#05131f"/>
    </linearGradient>
    <linearGradient id="joyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="joySky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgJoy)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#joyGold)" stroke-width="2.5" opacity="0.85"/>

  <!-- Logo Colombe de paix &amp; Croix Gospel lumineuse -->
  <g transform="translate(100, 68)">
    <circle cx="0" cy="0" r="38" fill="#082238" stroke="url(#joySky)" stroke-width="2"/>
    <!-- Croix dorée &amp; colombe -->
    <rect x="-3" y="-22" width="6" height="44" rx="2" fill="url(#joyGold)"/>
    <rect x="-16" y="-12" width="32" height="6" rx="2" fill="url(#joyGold)"/>
    <!-- Rayons de lumière célestes -->
    <circle cx="0" cy="-6" r="16" fill="none" stroke="url(#joyGold)" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  <!-- Titre JOY GOSPEL -->
  <text x="100" y="128" font-family="'Arial Black', Impact, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">JOY GOSPEL</text>
  <text x="100" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="url(#joyGold)" text-anchor="middle" letter-spacing="2">RADIO GROUP</text>

  <!-- Cartouche Gospel SA -->
  <rect x="20" y="158" width="160" height="26" rx="8" fill="url(#joySky)"/>
  <text x="100" y="175" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#071926" text-anchor="middle" letter-spacing="1">SOUTH AFRICAN PRAISE &amp; WORSHIP</text>
</svg>
