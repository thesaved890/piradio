<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgBahdja" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b2d"/>
      <stop offset="50%" stop-color="#0c355c"/>
      <stop offset="100%" stop-color="#071727"/>
    </linearGradient>
    <linearGradient id="bahdjaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="bahdjaSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgBahdja)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#bahdjaGold)" stroke-width="2" opacity="0.85"/>

  <!-- En-tête Radio Algérie -->
  <text x="100" y="28" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="900" fill="url(#bahdjaGold)" text-anchor="middle" letter-spacing="2">RADIO ALGÉRIE</text>

  <!-- Silhouette baie d'Alger & Monument des Martyrs (Maqam Echahid) stylisé -->
  <g transform="translate(100, 76)">
    <circle cx="0" cy="0" r="42" fill="#06223e" stroke="url(#bahdjaSky)" stroke-width="2"/>
    <!-- Maqam Echahid stylisé -->
    <path d="M -12,24 C -8,5 -4,-18 0,-26 C 4,-18 8,5 12,24" fill="none" stroke="url(#bahdjaGold)" stroke-width="2.5"/>
    <circle cx="0" cy="-26" r="3" fill="#FFFFFF"/>
    <!-- Vagues de la baie d'Alger -->
    <path d="M -30,22 Q -15,16 0,22 T 30,22" fill="none" stroke="url(#bahdjaSky)" stroke-width="1.5"/>
  </g>

  <!-- Titre El Bahdja -->
  <text x="100" y="132" font-family="'Arial Black', sans-serif" font-size="17" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">EL BAHDJA</text>
  <text x="100" y="150" font-family="'Amiri', 'Traditional Arabic', serif" font-size="16" font-weight="bold" fill="url(#bahdjaGold)" text-anchor="middle">الجزائر العاصمة 94.2</text>

  <!-- Cartouche inférieur -->
  <rect x="25" y="162" width="150" height="25" rx="8" fill="url(#bahdjaSky)"/>
  <text x="100" y="178" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="900" fill="#061F38" text-anchor="middle" letter-spacing="1">ALGER LA BLANCHE • CHAÂBI</text>
</svg>
