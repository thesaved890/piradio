<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bldiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0a0c"/>
      <stop offset="50%" stop-color="#381316"/>
      <stop offset="100%" stop-color="#120507"/>
    </linearGradient>
    <linearGradient id="bldiGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BC4749"/>
      <stop offset="50%" stop-color="#F28482"/>
      <stop offset="100%" stop-color="#F7D070"/>
    </linearGradient>
    
  </defs>

  <rect x="6" y="6" width="188" height="188" rx="36" fill="url(#bldiBg)" stroke="#F28482" stroke-width="3"/>

  <!-- Instrument luth / oud ou motif zellige marocain -->
  <g transform="translate(100, 52)">
    <circle cx="0" cy="0" r="23" fill="#BC4749"/>
    <!-- Étoile à 8 branches zellij -->
    <rect x="-10" y="-10" width="20" height="20" fill="none" stroke="#F7D070" stroke-width="2"/>
    <rect x="-10" y="-10" width="20" height="20" fill="none" stroke="#F7D070" stroke-width="2" transform="rotate(45)"/>
  </g>

  <!-- Titre BLDI -->
  <text x="100" y="105" fill="#FFFFFF" font-family="'Inter', -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="3" text-anchor="middle">BLDI</text>

  <!-- Tag CHAABI &amp; TERROIR -->
  <rect x="36" y="116" width="128" height="26" rx="8" fill="url(#bldiGold)"/>
  <text x="100" y="134" fill="#1F0A0C" font-family="'Inter', sans-serif" font-weight="900" font-size="12" letter-spacing="1.5" text-anchor="middle">100% CHAABI</text>

  <!-- Pied MAROC -->
  <rect x="24" y="152" width="152" height="28" rx="8" fill="#170709" stroke="#F28482" stroke-width="1.2"/>
  <text x="100" y="171" fill="#F7D070" font-family="'Inter', sans-serif" font-weight="800" font-size="11" letter-spacing="1.8" text-anchor="middle">TRADITION MAROCAINE</text>
</svg>