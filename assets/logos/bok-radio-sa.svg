<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgBok" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1d12"/>
      <stop offset="50%" stop-color="#123d24"/>
      <stop offset="100%" stop-color="#07170e"/>
    </linearGradient>
    <linearGradient id="bokGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="100%" stop-color="#FBC02D"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgBok)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#bokGold)" stroke-width="2.5" opacity="0.85"/>

  <!-- Logo Springbok (Gazelle emblème d'Afrique du Sud) -->
  <g transform="translate(100, 68)">
    <circle cx="0" cy="0" r="38" fill="#0d2b19" stroke="url(#bokGold)" stroke-width="2"/>
    <!-- Silhouette cornes de Springbok & tête -->
    <path d="M -12,14 L -4,-6 Q -12,-22 -16,-26 Q -10,-24 -2,-12 L 0,-6 L 2,-12 Q 10,-24 16,-26 Q 12,-22 4,-6 L 12,14 Z" fill="url(#bokGold)"/>
  </g>

  <!-- Titre BOK RADIO -->
  <text x="100" y="126" font-family="'Arial Black', Impact, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">BOK RADIO</text>
  <text x="100" y="146" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="url(#bokGold)" text-anchor="middle" letter-spacing="2">98.9 FM • JOU TROTS</text>

  <!-- Cartouche Western Cape -->
  <rect x="20" y="158" width="160" height="26" rx="8" fill="url(#bokGold)"/>
  <text x="100" y="175" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="900" fill="#0A1D12" text-anchor="middle" letter-spacing="1">AFRIKAANS • CAPE TOWN</text>
</svg>
