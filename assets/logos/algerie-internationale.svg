<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgRai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a050b"/>
      <stop offset="50%" stop-color="#4d0c15"/>
      <stop offset="100%" stop-color="#1f0207"/>
    </linearGradient>
    <linearGradient id="redRai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="100%" stop-color="#D00B2B"/>
    </linearGradient>
    <linearGradient id="goldRai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="36" fill="url(#bgRai)"/>
  <rect x="5" y="5" width="190" height="190" rx="32" fill="none" stroke="url(#redRai)" stroke-width="2" opacity="0.8"/>

  <!-- Logo Globe terrestre -->
  <g transform="translate(100, 78)">
    <circle cx="0" cy="0" r="38" fill="#150306" stroke="url(#redRai)" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="20" ry="38" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>
    <line x1="-38" y1="0" x2="38" y2="0" stroke="rgba(255,255,255,0.25)" stroke-width="1.2"/>
    <line x1="-33" y1="-18" x2="33" y2="-18" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <line x1="-33" y1="18" x2="33" y2="18" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    <!-- Acronyme RAI -->
    <text x="0" y="8" font-family="'Arial Black', sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">RAI</text>
  </g>

  <!-- Texte Algérie Internationale -->
  <text x="100" y="132" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ALGÉRIE</text>
  <text x="100" y="148" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="url(#goldRai)" text-anchor="middle" letter-spacing="1.5">INTERNATIONALE</text>

  <!-- Cartouche arabe inférieur -->
  <rect x="25" y="160" width="150" height="26" rx="8" fill="url(#redRai)"/>
  <text x="100" y="177" font-family="'Amiri', 'Traditional Arabic', serif" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">الجزائر الدولية</text>
</svg>