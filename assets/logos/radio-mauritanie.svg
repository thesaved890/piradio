<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="rmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022e1b"/>
      <stop offset="50%" stop-color="#054528"/>
      <stop offset="100%" stop-color="#011b10"/>
    </linearGradient>
    <linearGradient id="rmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="50%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#d4a000"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="36" fill="url(#rmBg)"/>
  <circle cx="100" cy="85" r="58" fill="none" stroke="url(#rmGold)" stroke-width="2.5"/>
  <!-- Islamic Crescent &amp; Star Emblem -->
  <g fill="url(#rmGold)">
    <path d="M 72 85 A 28 28 0 0 0 128 85 A 25 19 0 0 1 72 85 Z"/>
    <polygon points="100,62 102.8,70 111,70 104.5,75 107,83 100,78.5 93,83 95.5,75 89,70 97.2,70"/>
  </g>
  <!-- Radio Waves -->
  <path d="M 58 75 A 44 44 0 0 0 58 95" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <path d="M 142 75 A 44 44 0 0 1 142 95" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <!-- Arabic Calligraphy Text Simulation -->
  <text x="100" y="128" font-family="'Amiri', 'Traditional Arabic', serif, system-ui" font-size="14" font-weight="bold" fill="url(#rmGold)" text-anchor="middle">إذاعة موريتانيا</text>
  <!-- Banner -->
  <rect x="18" y="148" width="164" height="34" rx="10" fill="#021f12" stroke="url(#rmGold)" stroke-width="1.5"/>
  <text x="100" y="165" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="900" fill="#ffffff" letter-spacing="1" text-anchor="middle">RADIO MAURITANIE</text>
  <text x="100" y="177" font-family="system-ui,-apple-system,sans-serif" font-size="8.5" font-weight="700" fill="url(#rmGold)" letter-spacing="1.5" text-anchor="middle">CHAÎNE NATIONALE • 93.3 FM</text>
</svg>