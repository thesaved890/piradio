<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141005"/>
      <stop offset="50%" stop-color="#2b2008"/>
      <stop offset="100%" stop-color="#0a0802"/>
    </linearGradient>
    <linearGradient id="gmGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FCD116"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    
  </defs>

  <circle cx="256" cy="256" r="240" fill="url(#gmBg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gmGold)" stroke-width="3" stroke-opacity="0.8"/>

  <g transform="translate(256, 185)">
    <circle cx="0" cy="0" r="62" fill="url(#gmGold)"/>
    <circle cx="0" cy="0" r="54" fill="#141005"/>
    <text x="0" y="16" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="900" fill="url(#gmGold)" text-anchor="middle">102.3</text>
  </g>

  <!-- Badge 102.3 FM Guémon -->
  <g transform="translate(256, 285)">
    <rect x="-105" y="-18" width="210" height="36" rx="18" fill="url(#gmGold)"/>
    <text x="0" y="7" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#141005" text-anchor="middle" letter-spacing="2">102.3 FM • DUÉKOUÉ</text>
  </g>

  <!-- Titre Principal GUÉMON FM -->
  <text x="256" y="360" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">GUÉMON FM 102.3</text>

  <!-- Sous-titre Région du Guémon -->
  <text x="256" y="395" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="800" fill="url(#gmGold)" text-anchor="middle" letter-spacing="3">RÉGION DU GUÉMON • DUÉKOUÉ</text>

  <!-- Drapeau ivoirien miniature en bas -->
  <g transform="translate(256, 430)">
    <rect x="-18" y="-7" width="12" height="14" fill="#FF8200" rx="2"/>
    <rect x="-6" y="-7" width="12" height="14" fill="#FFFFFF"/>
    <rect x="6" y="-7" width="12" height="14" fill="#009A44" rx="2"/>
    <rect x="-18" y="-7" width="36" height="14" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1" rx="2"/>
  </g>
</svg>